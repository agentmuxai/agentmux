[package]
name = "agentmux-launcher"
version = "0.33.465"
description = "AgentMux Launcher — tiny exe that sets DLL path then spawns the CEF host"
authors = ["AgentMux Corp"]
edition = "2021"

[[bin]]
name = "agentmux-launcher"
path = "src/main.rs"

[dependencies]
# Phase B foundation: launcher gains a Tokio runtime so it can
# manage srv + host concurrently and (in later sub-PRs) host the
# named-pipe IPC server. Prior to Phase B the launcher was a tiny
# sync DLL-path-fixup + spawner; now it's the privileged owner per
# specs/SPEC_WINDOW_PROCESS_STATE_MACHINE_2026_04_27.md.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
    "sync",
    # Phase B.2: tokio::net::windows::named_pipe lives in this feature.
    "net",
] }
# Platform-default data_dir / config_dir resolution. Host already
# uses this; launcher must compute the SAME paths so both processes
# agree on the data dir for CEF cache, srv DB, etc.
dirs = "5"
# RFC3339 timestamps for backend_started_at logs, kept stable for
# log-format compatibility with the host's existing format.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# UUID v4 for the shared auth key launcher generates and gives to
# both srv (env var) and host (env var). Same generation method the
# host uses today (uuid::Uuid::new_v4) so the format is identical.
uuid = { version = "1", features = ["v4"] }
# Phase B.2: typed Command / Event protocol over named pipes. The
# wire types live in agentmux-common::ipc so launcher (server) and
# host (client) share one definition; serde_json is the format.
agentmux-common = { path = "../agentmux-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    # CreateJobObjectW takes SECURITY_ATTRIBUTES* — guarded by this
    # feature in windows-sys 0.59 even though the function lives in
    # Win32_System_JobObjects. Without it, CreateJobObjectW is absent.
    "Win32_Security",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[dev-dependencies]
# Phase B.3: property-based testing for the reducer. Generates
# arbitrary command sequences and asserts the reducer's invariants
# hold across all of them — catches edge cases unit tests miss.
# Dev-only: zero impact on release binary size.
proptest = "1"
