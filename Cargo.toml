[workspace]
resolver = "2"
members = ["agentmux-srv", "agentmux-cef", "agentmux-launcher", "agentmux-common", "agentmux-bashwrap", "agentmux-mcp"]

# Shared workspace metadata — members inherit `version` via
# `version.workspace = true` so a single bump touches one Cargo.toml.
# RFC #857 Phase 1.
[workspace.package]

version = "0.55.40"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# Fast release profile for testing (much faster compile, slightly larger binary)
[profile.fast-release]
inherits = "release"
lto = "thin"        # Thin LTO - parallel and much faster than full LTO
codegen-units = 16  # Parallel codegen - uses multiple CPU cores
strip = true
opt-level = 2       # Still optimized, but not as aggressive as "s"

# ─── CEF 152 binding patch ──────────────────────────────────────────────
# `cef-dll-sys` 152.1.0+152.0.6 on crates.io is generated from upstream
# CEF 152 headers, which do NOT include
# `CefWindow::BeginWindowDrag()` (the AgentMux source patch lives in
# `agentmuxai/cef@agentmux/7977-drag-rightclick-and-transparency`,
# ported from `agentmux/7778-drag-rightclick-and-transparency`). Without
# the binding-side field, our `--features patched-libcef` flag fails to
# compile against CEF 152 on Linux (`error[E0609]: no field
# begin_window_drag on type _cef_window_t` at
# `agentmux-cef/src/ui_tasks.rs:215`) — same failure mode as 148.
#
# The fork at `AgentU-asaf/cef-rs@agentmux/152-begin-window-drag`
# (PR #3 on that fork) appends the `begin_window_drag` slot to the
# linux_x86_64 binding. `_cef_window_t`'s layout is byte-identical
# between CEF 148 and 152 upstream (the pre-patch struct size assertion
# is `888usize` on both), so this is the exact same insertion point and
# size delta (888 → 896) as the 148 patch (`agentmux/148-begin-window-drag`,
# PR #1, kept for history/reference) — not a re-derivation. Windows/macOS
# binding files are untouched: `patched-libcef` is Linux-only in
# AgentMux's own build (`Taskfile.yml`'s `build:host:linux` is the only
# platform task that passes `--features patched-libcef`). The fork's
# branch is pinned by its commit SHA so the build is reproducible.
#
# Lifecycle: this `[patch.crates-io]` is temporary — when the patches
# are upstreamed to chromiumembedded/cef and tauri-apps/cef-rs (or when
# AgentMux's libcef build becomes the only consumer), remove this block
# and the workspace can use the public binding directly.
#
# See: docs/specs/SPEC_CEF_148_LINUX_FORWARD_PORT_2026_06_04.md §5,
# docs/specs/SPEC_CEF_MILESTONE_UPGRADE_148_TO_152_2026_09_07.md Phase C.
[patch.crates-io]
cef-dll-sys = { git = "https://github.com/AgentU-asaf/cef-rs", rev = "bfeae8047ecfc5e35cf7beb976cfeec208b2c5f5" }
