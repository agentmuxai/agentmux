[workspace]
resolver = "2"
members = ["agentmux-srv", "agentmux-cef", "agentmux-launcher", "agentmux-common", "agentmux-bashwrap", "agentmux-mcp"]

# Shared workspace metadata — members inherit `version` via
# `version.workspace = true` so a single bump touches one Cargo.toml.
# RFC #857 Phase 1.
[workspace.package]

version = "0.56.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# Fast release profile for testing (much faster compile, slightly larger binary)
[profile.fast-release]
inherits = "release"
lto = "thin"        # Thin LTO - parallel and much faster than full LTO
codegen-units = 16  # Parallel codegen - uses multiple CPU cores
strip = true
opt-level = 2       # Still optimized, but not as aggressive as "s"

# ─── CEF 152 binding patch ──────────────────────────────────────────────
# `cef-dll-sys` 152.1.0+152.0.6 on crates.io is generated from upstream
# CEF 152 headers, which do NOT include
# `CefWindow::BeginWindowDrag()` (the AgentMux source patch lives in
# `agentmuxai/cef@agentmux/7977-drag-rightclick-and-transparency`,
# ported from the 148-era `7778` branch — PR #3 on that repo). Without
# the binding-side field, our `--features patched-libcef` flag fails to
# compile against CEF on Linux (`error[E0609]: no field begin_window_drag
# on type _cef_window_t` at `agentmux-cef/src/ui_tasks.rs:215`).
#
# The fork at `AgentU-asaf/cef-rs@agentmux/152-begin-window-drag` appends
# the `begin_window_drag` slot to the linux_x86_64 binding — same
# mechanical edit (888 -> 896 byte struct size) carried for 148 since CEF
# 146. Also carries a `links` value rename (`cef_dll_wrapper` ->
# `cef_dll_wrapper_agentmux`), needed while this repo went through a
# temporary Windows-152/macOS+Linux-148 staged rollout
# (SPEC_CEF_MILESTONE_UPGRADE_148_TO_152_2026_09_07.md Phase C, PR #3204)
# — Cargo enforces one `links` value graph-wide, and the two majors briefly
# needed to coexist under different dependency-table keys. That split is
# now collapsed (Phase E, all three platforms have a verified 152 runtime)
# back to the single `cef` dependency below; the renamed `links` value
# stays regardless, since it's harmless once collision-free and reverting
# it buys nothing.
#
# `AgentU-asaf/cef-rs#4`/`#5` (the upstream PRs carrying this exact rename,
# for 148 and 152 respectively) are still unmerged as of this writing — no
# push access on that repo to merge them directly. This points at
# `GenericAgentX-asaf/cef-rs`'s identical commit (verified: same
# begin_window_drag content, same rename) pending that; repoint once
# either upstream PR lands.
#
# Lifecycle: this `[patch.crates-io]` is temporary — when the patches
# are upstreamed to chromiumembedded/cef and tauri-apps/cef-rs (or when
# AgentMux's libcef build becomes the only consumer), remove this block
# and the workspace can use the public binding directly.
#
# See: docs/specs/SPEC_CEF_148_LINUX_FORWARD_PORT_2026_06_04.md §5,
# docs/specs/SPEC_CEF_MILESTONE_UPGRADE_148_TO_152_2026_09_07.md
[patch.crates-io]
cef-dll-sys = { git = "https://github.com/GenericAgentX-asaf/cef-rs", rev = "9b0abfe649f4535c2af2a05bebe82681d21e9109" }
