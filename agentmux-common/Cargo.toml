[package]
name = "agentmux-common"
version.workspace = true
edition = "2021"
description = "Shared utilities for AgentMux crates"

[dependencies]
tokio = { version = "1", features = ["process"] }
tracing = "0.1"
thiserror = "1"
# Phase B.2: shared IPC protocol types (Command/Event) between
# launcher (server) and host (client). One source of truth so the
# wire format can't drift between the two binaries on a version-
# skew release. JSON over newline-delimited frames.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform home/data/config-dir lookup for the unified data-dir
# layout (see docs/specs/SPEC_DATA_DIR_UNIFICATION_2026-05-05.md).
dirs = "5"

# Windows page-file volume tracking (pagefile.rs), shared by agentmux-srv
# and agentmux-cef — see docs/specs/SPEC_RAM_PAGEFILE_PRESSURE_SPLIT_2026_08_07.md §4.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
