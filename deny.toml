# Known-vulnerability check for the Rust workspace: `cargo deny check advisories` against Cargo.lock
# (.github/workflows/ci-pr.yml `advisories`, nightly in ci-nightly-build.yml `advisories`).
#
# An advisory with no patched release yet is listed under `ignore`, one entry per line: its id, a reason, and a
# "review by YYYY-MM-DD" date. scripts/advisory-ignores.mjs refuses an entry without a reason or a date (and the
# nightly refuses one past its date), so the list can only shrink or be re-decided on purpose. A pull request fails only
# on an advisory that is not listed here.

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0195", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0367", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0368", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0369", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0386", reason = "the patched release is not taken yet; review by 2026-12-06" },
    { id = "RUSTSEC-2026-0429", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0436", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0543", reason = "no replacement chosen yet; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0545", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0546", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0547", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0548", reason = "no patched release is published; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0555", reason = "no replacement chosen yet; review by 2027-02-20" },
    { id = "RUSTSEC-2026-0592", reason = "no patched release is published; review by 2027-02-20" },
]
