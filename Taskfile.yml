version: "3"

# Load machine-local env overrides (gitignored).
# Use .env to extend PATH with cargo, node, brew, etc.
# Windows: cargo/node are usually in PATH from their installers — no .env needed.
# macOS/Linux: create .env with e.g. PATH=/home/user/.cargo/bin:/opt/homebrew/bin:...
dotenv: [".env"]

vars:
    APP_NAME: "AgentMux"
    BIN_DIR: "bin"
    VERSION:
        sh: 'PATH="$HOME/.cargo/bin:/opt/homebrew/opt/node@20/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" node version.cjs'
    RM: '{{if eq OS "windows"}}pwsh -Command Remove-Item -Force -ErrorAction SilentlyContinue{{else}}rm -f{{end}}'
    RMRF: '{{if eq OS "windows"}}pwsh -Command Remove-Item -Force -Recurse -ErrorAction SilentlyContinue{{else}}rm -rf{{end}}'
    DATE: '{{if eq OS "windows"}}pwsh -Command Get-Date -UFormat{{else}}date{{end}}'
    ARTIFACTS_BUCKET: agentmux-github-artifacts/staging
    RELEASES_BUCKET: dl.agentmux.ai/releases
    WINGET_PACKAGE: AgentMux.AgentMux

tasks:
    changeset:
        desc: 'Author a new changeset file. Usage: task changeset -- patch "fix(...): description"'
        cmds:
            - bash scripts/changeset.sh {{.CLI_ARGS}}

    release:
        desc: 'Consume pending changesets, auto-detect bump type (major>minor>patch), update VERSION_HISTORY (no commit). Use release:patch or release:minor to force a type. Pass -- --dry-run to preview.'
        cmds:
            - bash scripts/release.sh {{.CLI_ARGS}}

    release:patch:
        desc: 'Consume pending changesets, force PATCH bump regardless of changeset types, update VERSION_HISTORY (no commit). Then: git commit -m "chore: release vX.Y.Z" && git push.'
        cmds:
            - bash scripts/release.sh --as patch

    release:minor:
        desc: 'Consume pending changesets, force MINOR bump regardless of changeset types, update VERSION_HISTORY (no commit). Then: git commit -m "chore: release vX.Y.Z" && git push.'
        cmds:
            - bash scripts/release.sh --as minor

    package:local:
        desc: 'Alias of `task package` (which is now itself ephemeral — no bump, no git mutation, unique stamped label per build). Kept for muscle memory.'
        cmds:
            - task: package

    dev:local:
        desc: 'Run task dev with a temporarily-bumped version label so the dev build advertises a unique version and cargo''s incremental cache cannot serve stale .o files. Restores version files on Ctrl+C — no git mutation, no pushed bump commit. Usage: task dev:local (defaults to patch bump) or task dev:local -- minor.'
        cmds:
            - bash scripts/dev-local.sh {{.CLI_ARGS}}

    dev:
        desc: 'Run AgentMux in development mode (Vite hot reload). Optional: task dev TITLE="agentx: PR #1780" sets the OS window title so you can tell parallel dev sessions apart.'
        # Deliberately NOT declaring `vars: TITLE: ''` here — go-task 3.48.0
        # shadows a CLI-supplied `task dev TITLE=...` override with a task's
        # own `vars:` default for that same name (confirmed via isolated
        # repro; a declared default always wins over the CLI value, silently
        # discarding it), leaving {{.TITLE}} empty regardless of what was
        # passed. Omitting the declaration lets the CLI value flow through
        # normally (still renders empty when nothing is passed — Go
        # templates render an unset var as ""). See
        # docs/retro/retro-task-dev-title-var-shadowing-2026-08-11.md.
        cmds:
            - task: dev:serve
              vars:
                  TITLE: '{{.TITLE}}'
        deps:
            - npm:install
            - build:backend
            - copy:schema
        env:
            AGENTMUX_ENVFILE: "{{.ROOT_DIR}}/.env"
            AGENTMUX_DEV: "1"

    dev:standalone:
        desc: Run AgentMux in dev mode with the launcher BYPASSED (host invoked directly). Escape hatch for debugging the no-launcher fallback path. See docs/specs/SPEC_LAUNCHER_DEV_INTEGRATION_2026-05-13.md §5.4.
        cmds:
            - task: dev:standalone:serve
        deps:
            - npm:install
            - build:backend
            - copy:schema
        env:
            AGENTMUX_ENVFILE: "{{.ROOT_DIR}}/.env"
            AGENTMUX_DEV: "1"

    storybook:
        desc: Start the Storybook server.
        cmd: npm run storybook
        deps:
            - npm:install

    storybook:build:
        desc: Build the Storybook static site.
        cmd: npm run build-storybook
        generates:
            - storybook-static/**/*
        deps:
            - npm:install

    copy:schema:
        desc: Copy schema directory to dist
        cmds:
            - cmd: pwsh -Command "New-Item -ItemType Directory -Force -Path dist/schema | Out-Null; Copy-Item schema/* dist/schema/ -Recurse -Force"
              platforms: [windows]
            - cmd: mkdir -p dist/schema && cp -r schema/* dist/schema/
              platforms: [linux, darwin]

    package:
        desc: 'Build + package a LOCAL portable to ~/Desktop with an ephemeral, traceable label. Does NOT bump the version and does NOT touch git — the release version moves only via `task release`. Every build gets a unique stamped folder (no lock collision) and a branch-scoped data dir (your session persists across rebuilds). Pass `-- --fresh` for a throwaway data dir, or `-- <dir>` for an alternate output dir. See SPEC_LOCAL_BUILD_VERSIONING_2026_05_28.md.'
        platforms: [windows]
        cmds:
            # All build-label + channel logic lives in the orchestrator so
            # the build stamp is computed ONCE and shared between the cargo
            # builds (channel bake) and package-portable.sh (artifact name).
            # No version bump, no git mutation.
            - bash scripts/package.sh {{.CLI_ARGS}}

    package:release:
        desc: 'Like `task package` but (a) strips source maps (~28 MB) and (b) bakes the "stable" channel so the artifact opens the user''s real data dir. Guarded: refuses unless the tree is clean and HEAD is a merged `chore: release v*` commit (AGENTMUX_STABLE_OVERRIDE=1 to bypass). Local builds (`task package`) keep maps and use the branch-scoped local channel. See docs/specs/SPEC_PORTABLE_SOURCE_MAPS_2026_06_01.md.'
        platforms: [windows]
        cmds:
            - bash scripts/guard-stable-build.sh
            - bash -c 'STRIP_MAPS=1 RELEASE_CHANNEL=stable bash scripts/package.sh {{.CLI_ARGS}}'

    package:msix:
        desc: 'Build a Microsoft Store MSIX from a portable build. `-- -Sign` produces a self-signed package for local Add-AppxPackage testing. See docs/specs/SPEC_MSIX_PACKAGING_2026_05_30.md.'
        platforms: [windows]
        cmds:
            - pwsh -File scripts/package-msix.ps1 {{.CLI_ARGS}}

    package:installer:
        desc: 'Build the Windows .exe installer (Inno Setup) from a portable build → ~/Desktop/AgentMux-<ver>-x64-setup.exe. Per-user install, native CEF (replaces the Tauri-era installer). Needs Inno Setup 6 (ISCC). `-- -PortableDir <dir>` to pick a specific portable. See packaging/windows/agentmux.iss.'
        platforms: [windows]
        cmds:
            - pwsh -File scripts/package-installer.ps1 {{.CLI_ARGS}}

    package:macos:
        desc: >-
            Package the application as a signed macOS .app + .dmg (Developer ID,
            hardened runtime). Output to ~/Desktop by default. Notarization is
            attempted via the `notarytool` keychain profile and degrades to a
            signed-only DMG if it's unavailable (see scripts/package-macos.sh and
            docs/macos-signing.md). Set NOTARIZE=0 to skip notarization.
        platforms: [darwin]
        deps:
            - build:host
            - build:backend
            - build:frontend
            - copy:schema
        cmds:
            - task: bundle
            - bash scripts/package-macos.sh {{.CLI_ARGS}}

    package:linux:
        desc: 'Build + package a LOCAL portable AppImage to ~/Desktop with an ephemeral, traceable label and a per-build data-dir channel (local-<branch>-<hash>-<build-id>) so the build runs as its own AgentMux instance alongside a release install. Does NOT bump the version. Pass `-- <dir>` for an alternate output dir. See docs/specs/SPEC_LINUX_APPIMAGE_PER_BUILD_CHANNEL_2026_06_25.md.'
        platforms: [linux]
        cmds:
            - bash scripts/package-linux.sh {{.CLI_ARGS}}

    package:release:linux:
        desc: 'Like `task package:linux` but bakes the "stable" channel so the artifact opens the user''s real data dir. Guarded: refuses unless the tree is clean and HEAD is a merged `chore: release v*` commit (AGENTMUX_STABLE_OVERRIDE=1 to bypass). See docs/specs/SPEC_LINUX_APPIMAGE_PER_BUILD_CHANNEL_2026_06_25.md.'
        platforms: [linux]
        cmds:
            - bash scripts/guard-stable-build.sh
            - bash -c 'RELEASE_CHANNEL=stable bash scripts/package-linux.sh {{.CLI_ARGS}}'

    check:menu-positioning:
        desc: >-
            Grep gate — fails if computePosition() is called outside the
            sanctioned menu positioning files (SPEC_MENU_PAINTABLE_AREA_GUARD
            §6.2). Forces new menus through useMenuPosition.
        cmd: bash scripts/check-menu-positioning.sh

    check:input-handler-layout:
        desc: >-
            Grep gate — fails if a layout-read (scrollHeight, offsetTop,
            getBoundingClientRect, etc.) appears in a hot-path input file
            without a `// perf:allow-layout-read` justification. Enforces
            rule #3 from SPEC_INPUT_RESPONSIVENESS_TERMINAL_AND_AGENT_2026_05_29.
        cmd: bash tools/lint/check-input-handler-layout-reads.sh

    docs:index:
        desc: >-
            Regenerate the generated half of docs/specs/INDEX.md (grouped by
            Status). The curated subsystem sections above the marker are
            hand-written and untouched. See
            docs/specs/PLAN_DOCS_CLEANUP_EXECUTION_2026_09_01.md batch D.
        cmd: bash scripts/gen-docs-index.sh

    check:doc-status:
        desc: >-
            Gate — fails if a CHANGED doc's `**Status:**` line does not start
            with the closed enum from docs/specs/README.md, or if a
            `superseded` doc lacks a `**Superseded-by:**` pointer that
            resolves. Scoped to the diff on purpose: ~318 of 729 specs predate
            the vocabulary, and a repo-wide gate would be disabled within a day.
            See docs/specs/PLAN_DOCS_CLEANUP_EXECUTION_2026_09_01.md batch E.
        cmd: bash scripts/check-doc-status.sh

    check:spec-citations:
        desc: >-
            Gate — fails if a CHANGED file cites a `docs/specs/*.md` path that
            does not exist. Scoped to the diff for the same reason as
            check:doc-status: 90 dangling citations across 78 files exist
            today, so a repo-wide gate would fail every PR on somebody else's
            rot and be switched off. See docs/specs/PLAN_DOCS_CLEANUP_EXECUTION_2026_09_01.md.
        cmd: bash scripts/check-spec-citations.sh

    check:scrollbar-cursor:
        desc: >-
            Grep gate — fails if a scrollbar/os-scrollbar selector sets
            `cursor` to a link/text value (pointer/text or the
            --cursor-interactive/--cursor-text tokens). Scrollbar pseudo-
            elements inherit their host's cursor, so the arrow is pinned in
            app.scss; this keeps the regression from recurring. See
            docs/retro/retro-scrollbar-cursor-regression-2026-06-17.md.
        cmd: bash scripts/check-scrollbar-cursor.sh

    build:frontend:
        desc: Build the frontend (production mode).
        cmd: bash scripts/vite-build.sh --mode production --config vite.config.ts
        deps:
            - npm:install
            - check:menu-positioning
            - check:input-handler-layout
            - check:scrollbar-cursor
        env:
            VITE_PLATFORM: "{{OS}}"

    build:frontend:dev:
        desc: Build the frontend in development mode.
        cmd: bash scripts/vite-build.sh --mode dev --config vite.config.ts
        deps:
            - npm:install
        env:
            VITE_PLATFORM: "{{OS}}"

    build:backend:
        desc: Build the agentmux-srv Rust component.
        cmds:
            - task: build:backend:rust

    # ========================================
    # Rust Backend Build Tasks
    # ========================================

    build:backend:rust:
        desc: Build the agentmux-srv Rust backend binary.
        cmds:
            - task: build:backend:rust:{{OS}}

    build:backend:rust:darwin:
        internal: true
        platforms: [darwin]
        cmds:
            - bash -c 'source "$HOME/.cargo/env" 2>/dev/null; PATH="$HOME/.cargo/bin:$PATH" cargo build --release -p agentmux-srv'
            - mkdir -p dist/bin
            - cp target/release/agentmux-srv dist/bin/agentmux-srv-{{.VERSION}}-darwin.arm64
            - echo "✓ Built agentmux-srv for macOS (dist/bin/agentmux-srv-{{.VERSION}}-darwin.arm64)"

    build:backend:rust:linux:
        internal: true
        platforms: [linux]
        cmds:
            - bash -c 'source "$HOME/.cargo/env" 2>/dev/null; PATH="$HOME/.cargo/bin:$PATH" cargo build --release -p agentmux-srv'
            - mkdir -p dist/bin
            - cp target/release/agentmux-srv dist/bin/agentmux-srv-{{.VERSION}}-linux.x64
            - echo "✓ Built agentmux-srv for Linux (dist/bin/agentmux-srv-{{.VERSION}}-linux.x64)"

    build:backend:rust:windows:
        internal: true
        platforms: [windows]
        cmds:
            - cargo build --release -p agentmux-srv
            # Read the version LIVE from package.json — `{{.VERSION}}` is frozen
            # at `task` invocation start, BEFORE `task package`'s auto-bump
            # runs, so it would stamp the binary with the stale (pre-bump)
            # version while package-portable.sh resolves the version live.
            #
            # The pwsh command is SINGLE-quoted: Task runs cmds through a POSIX
            # shell, which would otherwise expand `$v` to empty before pwsh
            # sees it (naming the binary `agentmux-srv--windows.x64.exe`).
            # Single quotes pass `$v` through literally for pwsh to evaluate.
            - cmd: pwsh -Command '$v = (Get-Content -Raw package.json | ConvertFrom-Json).version; New-Item -ItemType Directory -Force -Path dist/bin | Out-Null; Copy-Item target/release/agentmux-srv.exe dist/bin/agentmux-srv-$v-windows.x64.exe -Force'

    # agentmux-wsh build tasks removed — wsh has been retired.
    # agentmux-mcp is built as part of build:host (via -p agentmux-mcp in each platform task).
    # See docs/specs/archive/SPEC_RETIRE_WSH_2026_04_12.md.

    outdated:
        desc: Check for outdated packages using npm-check-updates.
        cmd: npx npm-check-updates@latest

    version:
        desc: Get the current package version, or bump version if args are present. To pass args to `version.cjs`, add them after `--`. See `version.cjs` for usage definitions for the arguments.
        cmd: node version.cjs {{.CLI_ARGS}}

    artifacts:upload:
        desc: Uploads build artifacts to the staging bucket in S3. To add additional AWS CLI arguments, add them after `--`.
        vars:
            ORIGIN: "target/release/"
            DESTINATION: "{{.ARTIFACTS_BUCKET}}/{{.VERSION}}"
        cmd: aws s3 cp {{.ORIGIN}}/ s3://{{.DESTINATION}}/ --recursive --exclude "*/*" --exclude "builder-*.yml" {{.CLI_ARGS}}

    artifacts:download:*:
        desc: Downloads the specified artifacts version from the staging bucket. To add additional AWS CLI arguments, add them after `--`.
        vars:
            DL_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
            ORIGIN: "{{.ARTIFACTS_BUCKET}}/{{.DL_VERSION}}"
            DESTINATION: "artifacts/{{.DL_VERSION}}"
        cmds:
            - '{{.RMRF}} "{{.DESTINATION}}"'
            - aws s3 cp s3://{{.ORIGIN}}/ {{.DESTINATION}}/ --recursive {{.CLI_ARGS}}

    artifacts:publish:*:
        desc: Publishes the specified artifacts version from the staging bucket to the releases bucket. To add additional AWS CLI arguments, add them after `--`.
        vars:
            UP_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
            ORIGIN: "{{.ARTIFACTS_BUCKET}}/{{.UP_VERSION}}"
            DESTINATION: "{{.RELEASES_BUCKET}}"
        cmd: |
            OUTPUT=$(aws s3 cp s3://{{.ORIGIN}}/ s3://{{.DESTINATION}}/ --recursive {{.CLI_ARGS}})

            for line in $OUTPUT; do
                PREFIX=${line%%{{.DESTINATION}}*}
                SUFFIX=${line:${#PREFIX}}
                if [[ -n "$SUFFIX" ]]; then
                    echo "https://$SUFFIX"
                fi
            done
    artifacts:snap:publish:*:
        desc: Publishes the specified artifacts version to Snapcraft.
        vars:
            UP_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
            CHANNEL: '{{if contains "beta" .UP_VERSION}}beta{{else}}beta,stable{{end}}'
        cmd: |
            echo "Releasing to channels: [{{.CHANNEL}}]"
            for file in agentmux_{{.UP_VERSION}}_*.snap; do
                echo "Publishing $file"
                snapcraft upload --release={{.CHANNEL}} $file
                echo "Finished publishing $file"
            done

    artifacts:winget:publish:*:
        desc: Submits a version bump request to WinGet for the latest release.
        status:
            - exit {{if contains "beta" .UP_VERSION}}0{{else}}1{{end}}
        vars:
            UP_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
        cmd: |
            wingetcreate update {{.WINGET_PACKAGE}} -s -v {{.UP_VERSION}} -u "https://{{.RELEASES_BUCKET}}/{{.APP_NAME}}-win32-x64-{{.UP_VERSION}}.msi" -t {{.GITHUB_TOKEN}}

    # dev:installwsh removed — wsh has been retired.
    # See docs/specs/archive/SPEC_RETIRE_WSH_2026_04_12.md.

    dev:clearconfig:
        desc: Clear the config directory for agentmux-dev
        cmd: "{{.RMRF}} ~/.config/agentmux-dev"

    dev:cleardata:
        desc: Clear the data directory for agentmux-dev
        cmds:
            - task: dev:cleardata:windows
            - task: dev:cleardata:linux
            - task: dev:cleardata:macos

    init:
        desc: Initialize the project for development.
        cmds:
            - npm install

    dev:cleardata:windows:
        internal: true
        platforms: [windows]
        cmd: '{{.RMRF}} %LOCALAPPDATA%\agentmux-dev\Data'

    dev:cleardata:linux:
        internal: true
        platforms: [linux]
        cmd: "rm -rf ~/.local/share/agentmux-dev"

    dev:cleardata:macos:
        internal: true
        platforms: [darwin]
        cmd: 'rm -rf ~/Library/Application\ Support/agentmux-dev'

    npm:install:
        desc: Runs `npm install`
        internal: true
        generates:
            - node_modules/**/*
            - package-lock.json
        sources:
            - package-lock.json
            - package.json
        cmd: npm install

    copyfiles:*:*:
        desc: Recursively copy directory and its contents.
        internal: true
        cmd: '{{if eq OS "windows"}}pwsh -Command Copy-Item -Recurse -Force -Path {{index .MATCH 0}} -Destination {{index .MATCH 1}}{{else}}mkdir -p "$(dirname {{index .MATCH 1}})" && cp -r {{index .MATCH 0}} {{index .MATCH 1}}{{end}}'

    clean:
        desc: clean dist directories
        cmds:
            - cmd: '{{.RMRF}} "dist"'
              ignore_error: true

    tsunami:demo:todo:
        desc: Run the tsunami todo demo application
        cmd: go run demo/todo/*.go
        dir: tsunami
        env:
            TSUNAMI_LISTENADDR: "localhost:12026"

    tsunami:frontend:dev:
        desc: Run the tsunami frontend vite dev server
        cmd: npm run dev
        dir: tsunami/frontend

    tsunami:frontend:build:
        desc: Build the tsunami frontend
        cmd: npm run build
        dir: tsunami/frontend

    tsunami:frontend:devbuild:
        desc: Build the tsunami frontend in development mode (with source maps and symbols)
        cmd: npm run build:dev
        dir: tsunami/frontend

    tsunami:scaffold:
        desc: Build scaffold for tsunami frontend development
        deps:
            - tsunami:frontend:build
        cmds:
            - task: tsunami:scaffold:internal

    tsunami:devscaffold:
        desc: Build scaffold for tsunami frontend development (with source maps and symbols)
        deps:
            - tsunami:frontend:devbuild
        cmds:
            - task: tsunami:scaffold:internal

    tsunami:scaffold:packagejson:
        desc: Create package.json for tsunami scaffold using npm commands
        dir: tsunami/frontend/scaffold
        cmds:
            - cmd: "{{.RM}} package.json"
              ignore_error: true
            - npm --no-workspaces init -y --init-license Apache-2.0
            - npm pkg set name=tsunami-scaffold
            - npm pkg delete author
            - npm pkg set author.name="AgentMux Corp"
            - npm --no-workspaces install tailwindcss@4.1.13 @tailwindcss/cli@4.1.13

    tsunami:scaffold:internal:
        desc: Internal task to create scaffold directory structure
        dir: tsunami/frontend
        internal: true
        cmds:
            - cmd: "{{.RMRF}} scaffold"
              ignore_error: true
            - mkdir scaffold
            - cp ../templates/package.json.tmpl scaffold/package.json
            - cd scaffold && npm install
            - cp -r dist scaffold/
            - cp ../templates/app-main.go.tmpl scaffold/app-main.go
            - cp ../templates/tailwind.css scaffold/
            - cp ../templates/gitignore.tmpl scaffold/.gitignore

    tsunami:build:
        desc: Build the tsunami binary.
        cmds:
            - cmd: "{{.RM}} bin/tsunami*"
              ignore_error: true
            - mkdir -p bin
            - cd tsunami && go build -ldflags "-X main.BuildTime=$({{.DATE}} +'%Y%m%d%H%M') -X main.TsunamiVersion={{.VERSION}}" -o ../bin/tsunami{{exeExt}} cmd/main-tsunami.go
        sources:
            - "tsunami/**/*.go"
            - "tsunami/go.mod"
            - "tsunami/go.sum"
        generates:
            - "bin/tsunami{{exeExt}}"

    tsunami:clean:
        desc: Clean tsunami frontend build artifacts
        dir: tsunami/frontend
        cmds:
            - cmd: "{{.RMRF}} dist"
              ignore_error: true
            - cmd: "{{.RMRF}} scaffold"
              ignore_error: true

    tsunami:godoc:
        desc: Start the Go documentation server for the tsunami module
        cmd: $(go env GOPATH)/bin/pkgsite -http=:6060
        dir: tsunami


    # ========================================
    # Host Build Tasks
    # ========================================

    build:host:
        desc: Build the host binary for the current platform.
        cmds:
            - task: build:host:{{OS}}

    build:host:windows:
        internal: true
        platforms: [windows]
        cmds:
            # `download-cef`'s extraction races Windows Defender's real-time scan
            # (see docs/retro/RETRO_CEF_BUILD_RACE_2026_04_24.md). If the first
            # build lost the race, cef_windows_x86_64/ is missing libcef_dll/ +
            # include/ + Resources/. Retry once after repair before failing hard.
            - cmd: bash -c 'cargo build --release -p agentmux-cef -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp || { bash scripts/repair-cef-extract.sh && cargo build --release -p agentmux-cef -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp; }'
            # Phase 3 sandbox: bootstrap.exe presence means the sandbox feature
            # was active (cef-dll-sys only emits it when cef/sandbox is ON).
            # The cdylib agentmux_cef.dll is emitted unconditionally by
            # crate-type so it cannot be used as the sandbox discriminator.
            - cmd: pwsh -Command "
                New-Item -ItemType Directory -Force -Path dist/cef | Out-Null;
                if (Test-Path 'target/release/bootstrap.exe') {
                  Copy-Item target/release/bootstrap.exe    dist/cef/agentmux-cef.exe -Force;
                  Copy-Item target/release/agentmux_cef.dll dist/cef/agentmux-cef.dll -Force;
                  Copy-Item target/release/agentmux_cef.pdb dist/cef/agentmux-cef.pdb -Force -EA SilentlyContinue
                } else {
                  Copy-Item target/release/agentmux-cef.exe dist/cef/agentmux-cef.exe -Force
                }"
            # Stamp the AgentMux icon onto the staged host exe — bootstrap.exe
            # ships Chrome's icon under the Phase 3 sandbox; winres can't edit a
            # built PE so rcedit rewrites the resource. Idempotent on the raw bin.
            - cmd: bash scripts/inject-exe-icon.sh dist/cef/agentmux-cef.exe
            - echo "✓ Built host + launcher for Windows"

    build:host:darwin:
        internal: true
        platforms: [darwin]
        cmds:
            # Phase 1 (SPEC_LAUNCHER_MACOS_DEV_INTEGRATION_2026_05_30): the
            # launcher now drives srv + host on macOS dev too, so build it
            # alongside the host. They co-locate in dist/cef-dev/ (flat
            # layout) — see dev:serve's Unix branch.
            - bash -c 'source "$HOME/.cargo/env" 2>/dev/null; PATH="$HOME/.cargo/bin:$PATH" cargo build --release -p agentmux-cef -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp'
            - mkdir -p dist/cef
            - cp target/release/agentmux-cef dist/cef/agentmux-cef
            - cp target/release/agentmux-launcher dist/cef/agentmux-launcher
            - echo "✓ Built host + launcher + bashwrap for macOS"

    build:host:linux:
        internal: true
        platforms: [linux]
        # `--features patched-libcef` enables the call site for
        # `_cef_window_t::begin_window_drag` (used by StartWindowDragTask
        # for native left-click window drag on Wayland). The slot is now
        # part of public `cef-dll-sys-146.7.0+146.0.12` (upstreamed) and
        # the bundled libcef.so picked by `scripts/resolve-cef-runtime.sh`
        # implements it — so this flag is safe to default-on for Linux.
        # Without it, `start_window_drag` IPC compiles as a warn-and-noop
        # (PR #1131 made the gate default-off so macOS compile could land
        # before the macOS libcef story was sorted; on Linux we always had
        # the patched runtime).
        cmds:
            # Phase 1 (SPEC_LAUNCHER_MACOS_DEV_INTEGRATION_2026_05_30): build
            # the launcher alongside the host so the flat dev layout (launcher
            # + host + srv co-located in dist/cef-dev/) has it — same as
            # build:host:darwin. Without this, dev:serve's launcher-not-found
            # guard hard-fails on Linux.
            - bash -c 'source "$HOME/.cargo/env" 2>/dev/null; PATH="$HOME/.cargo/bin:$PATH" cargo build --release -p agentmux-cef --features patched-libcef && PATH="$HOME/.cargo/bin:$PATH" cargo build --release -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp'
            - mkdir -p dist/cef
            - cp target/release/agentmux-cef dist/cef/agentmux-cef
            - cp target/release/agentmux-launcher dist/cef/agentmux-launcher
            - echo "✓ Built host + launcher + bashwrap for Linux"

    bundle:
        desc: Bundle runtime binaries alongside the host executable.
        cmds:
            - task: bundle:{{OS}}

    bundle:windows:
        internal: true
        platforms: [windows]
        cmds:
            - cmd: |
                # Resolve which directory to bundle CEF runtime files FROM.
                # cefDir is set to that directory directly (never copied
                # wholesale into target/release/) — the override and
                # cef-build-default directories are raw Chromium ninja build
                # output trees (potentially dozens of GB of intermediate/
                # debug artifacts, not just runtime files), so a recursive
                # `cp -rf .../. target/release/` of one of those is extremely
                # slow and was observed to hang bundle:windows for 10+
                # minutes copying files nothing downstream needs. Every
                # downstream step in this task already does per-file `cp -f
                # "$cefDir/<name>" dist/cef/` for exactly the runtime files
                # it needs, so pointing cefDir at the source directly (no
                # staging copy) is both correct and far cheaper.
                # See docs/specs/SPEC_CEF_PROPRIETARY_CODECS_ALL_PLATFORMS_2026_07_26.md.
                #
                # cefSource tracks WHICH tier resolved the runtime, so the
                # advisory warning below can fire only when we actually landed
                # on the stock (no-codec) cargo cache — mirrors bundle:darwin's
                # verify-cef-framework-darwin.sh warning, which Windows never
                # had despite resolve-cef-runtime-windows.ps1 already
                # containing the equivalent tier/warning logic — that script
                # was written but never wired into this task, so `task dev`/
                # `task package` silently used the stock CEF with no signal.
                cefSource="cargo-cache"
                cefDir="target/release"
                cefBuildDefault="$HOME/cef-build/chromium_git/chromium/src/out/Release_GN_x64"
                if [ -n "${AGENTMUX_CEF_RUNTIME_DIR_WINDOWS:-}" ]; then
                  echo "AGENTMUX_CEF_RUNTIME_DIR_WINDOWS set — using override CEF runtime at $AGENTMUX_CEF_RUNTIME_DIR_WINDOWS"
                  if [ ! -f "$AGENTMUX_CEF_RUNTIME_DIR_WINDOWS/libcef.dll" ] || [ ! -f "$AGENTMUX_CEF_RUNTIME_DIR_WINDOWS/icudtl.dat" ]; then
                    echo "❌ AGENTMUX_CEF_RUNTIME_DIR_WINDOWS is set but missing libcef.dll + icudtl.dat" >&2
                    exit 1
                  fi
                  cefDir="$AGENTMUX_CEF_RUNTIME_DIR_WINDOWS"
                  cefSource="override"
                else
                  # Tier 2: the standard cef-build layout from
                  # docs/cef-build/build-patched-cef-windows.md, which
                  # documents this as picked up "automatically" — previously
                  # untrue, since this task never checked for it.
                  #
                  # Self-healing: if not already present, try downloading the
                  # pre-built patched runtime from the agentmuxai/cef GitHub
                  # release before falling through to the stock cargo-cache
                  # tier — the ~3-6 hour local Chromium compile in that doc
                  # only needs to happen once per CEF version, ever, on any
                  # machine (scripts/cef-build/fetch-patched-cef-windows.sh).
                  # Non-fatal: any failure here (gh missing/unauthenticated,
                  # network) just leaves cefBuildDefault empty and we fall
                  # through to tier 3 exactly as before.
                  bash scripts/cef-build/fetch-patched-cef-windows.sh "$cefBuildDefault" || true
                  if [ -f "$cefBuildDefault/libcef.dll" ] && [ -f "$cefBuildDefault/icudtl.dat" ]; then
                    echo "Found codec-enabled CEF at default cef-build location — using $cefBuildDefault"
                    cefDir="$cefBuildDefault"
                    cefSource="cef-build-default"
                  fi
                fi
                # Tier 3 (cefSource still "cargo-cache"): cargo/cef-dll-sys
                # copies the ACTIVE build's full CEF runtime (libcef.dll +
                # paks + icudtl.dat + GL dlls + en-US locale) into
                # target/release/ alongside the linked host — always matching
                # the host's CEF version. Source from there directly:
                # deterministic and version-correct. The old `find … | head
                # -1` was non-deterministic and could grab a STALE
                # cef-dll-sys build-dir copy from a previous CEF version —
                # after the 146→148 bump (#1221) it picked a 146 libcef.dll,
                # so the 148-linked host died with "unsupported CEF API
                # version 14800". (Avoids `ls -t`/`find -printf` too — task's
                # shell uses a limited Go coreutils that rejects those flags.)
                if [ "$cefSource" = "cargo-cache" ] && { [ ! -f "$cefDir/libcef.dll" ] || [ ! -f "$cefDir/icudtl.dat" ]; }; then
                  # rust-cache hit: cef-dll-sys build script didn't re-run →
                  # DLLs not staged to target/release/. The CEF SDK is still in
                  # the build OUT_DIR (rust-cache preserves
                  # target/release/build/). Find libcef.dll there and copy the
                  # full platform dir to target/release/ — same files the build
                  # script would have copied (copy_cef_runtime_files in
                  # cef-dll-sys/sys/build.rs).
                  # Glob may match multiple OUT_DIRs (e.g. stale build from a
                  # previous CEF major alongside the current one — exactly the
                  # hazard the Taskfile comment above warns about). Run
                  # verify-cef-version.sh against each candidate and take the
                  # first that passes, so a stale 146 directory is skipped when
                  # the linked crate expects 148.
                  cefOutDir=""
                  for dll in target/release/build/cef-dll-sys-*/out/*/libcef.dll; do
                    if [ -f "$dll" ]; then
                      candidate="$(dirname "$dll")"
                      if bash scripts/verify-cef-version.sh "$candidate" 2>/dev/null; then
                        cefOutDir="$candidate"
                        break
                      fi
                    fi
                  done
                  if [ -n "$cefOutDir" ]; then
                    echo "rust-cache hit: staging CEF DLLs from OUT_DIR ($cefOutDir) → $cefDir"
                    cp -rf "$cefOutDir/." "$cefDir/"
                    # Re-assert both required files are now present — an OUT_DIR
                    # that has libcef.dll but not icudtl.dat (e.g. a partial
                    # extract) would pass the version check above but still
                    # produce a broken bundle.
                    if [ ! -f "$cefDir/icudtl.dat" ]; then
                      echo "❌ OUT_DIR copy succeeded but icudtl.dat still missing in $cefDir" >&2
                      exit 1
                    fi
                  else
                    echo "❌ incomplete CEF runtime in $cefDir (need libcef.dll + icudtl.dat) — run 'task build:host' first"
                    exit 1
                  fi
                fi
                echo "Found runtime binaries in: $cefDir"
                # Guard: the bundled libcef.dll MUST match the linked `cef` crate
                # major. target/release can hold a STALE DLL from a previous CEF
                # version that an incremental build never refreshed (the 146→148
                # regression: a 148-linked host bundled a 146 libcef.dll → died at
                # startup with "unsupported CEF API version 14800", splash then no
                # window). Fail loudly here instead of shipping a broken build.
                # See docs/specs/SPEC_WINDOWS_CEF_BUNDLE_VERSION_INTEGRITY_2026_06_03.md.
                bash scripts/verify-cef-version.sh "$cefDir" || exit 1
                # Advisory-only, same posture as bundle:darwin's unpatched-
                # framework warning: don't fail `task dev`/`task package` on
                # the stock cef-dll-sys fallback (that's still a legitimate,
                # working build for everything except proprietary codecs), but
                # make it loud and actionable rather than silent — this is
                # exactly the gap that let MP4/MOV playback silently fail with
                # no signal pointing at the cause. See
                # docs/reports/REPORT_CEF_PROPRIETARY_CODEC_GAP_2026_07_26.md.
                if [ "$cefSource" = "cargo-cache" ]; then
                  echo "" >&2
                  echo "⚠️ ⚠️ ⚠️  BUNDLING THE STOCK (NO-CODEC) CEF RUNTIME  ⚠️ ⚠️ ⚠️" >&2
                  echo "    MP4/MOV/HEVC/AC3 playback will fail app-wide (DEMUXER_ERROR_NO_SUPPORTED_STREAMS)." >&2
                  echo "    To use the codec-enabled build: docs/cef-build/build-patched-cef-windows.md," >&2
                  echo "    then either place it at $cefBuildDefault or set AGENTMUX_CEF_RUNTIME_DIR_WINDOWS." >&2
                  echo "    (Dev build continues anyway — this is advisory.)" >&2
                  echo "" >&2
                fi
                mkdir -p dist/cef/locales
                # Optional-file copies below use `[ -f src ] && cp` instead of
                # `cp ... 2>/dev/null || true`: Task's shell (mvdan.cc/sh) runs
                # `cp` as a native Go builtin, not a spawned cp.exe, and on
                # Windows a missing SOURCE file surfaces as a hard
                # GetFileAttributesEx task-engine error that bypasses the
                # `2>/dev/null || true` shell-level suppression entirely —
                # confirmed live when vulkan-1.dll was absent from a codec CEF
                # runtime (docs/retro/retro-nightly-windows-cef-zip-backslash-paths-2026-07-29.md).
                # An explicit existence check (already used below for the
                # locale file) sidesteps the builtin's error path altogether.
                # Core DLLs (required)
                cp -f "$cefDir/libcef.dll" dist/cef/
                [ -f "$cefDir/chrome_elf.dll" ] && cp -f "$cefDir/chrome_elf.dll" dist/cef/
                # GPU support (required — ANGLE + D3D compiler)
                [ -f "$cefDir/libEGL.dll" ] && cp -f "$cefDir/libEGL.dll" dist/cef/
                [ -f "$cefDir/libGLESv2.dll" ] && cp -f "$cefDir/libGLESv2.dll" dist/cef/
                [ -f "$cefDir/d3dcompiler_47.dll" ] && cp -f "$cefDir/d3dcompiler_47.dll" dist/cef/
                # Software-GL fallback (SwiftShader, ~6 MB). When the HARDWARE GPU process
                # can't boot, Chromium falls back to SwiftShader for WebGL ONLY if these are
                # present AND --enable-unsafe-swiftshader is set (app.rs). Without them, the
                # software-GL fallback also fails ("crashed too many times with software GL")
                # and Chromium disables GL entirely → WebGL unavailable → xterm drops to its
                # slower DOM renderer (no scrollbar). This is the current Windows failure mode
                # (GPU process STATUS_BREAKPOINTs at init — see issue / the DCHECK-build root
                # cause). macOS/Linux bundles already ship SwiftShader; this restores parity.
                # SAFETY NET ONLY — hardware GL is still preferred when it boots.
                [ -f "$cefDir/vk_swiftshader.dll" ] && cp -f "$cefDir/vk_swiftshader.dll" dist/cef/
                [ -f "$cefDir/vulkan-1.dll" ] && cp -f "$cefDir/vulkan-1.dll" dist/cef/
                [ -f "$cefDir/vk_swiftshader_icd.json" ] && cp -f "$cefDir/vk_swiftshader_icd.json" dist/cef/
                # Data files (required)
                [ -f "$cefDir/icudtl.dat" ] && cp -f "$cefDir/icudtl.dat" dist/cef/
                [ -f "$cefDir/v8_context_snapshot.bin" ] && cp -f "$cefDir/v8_context_snapshot.bin" dist/cef/
                for pak in "$cefDir"/*.pak; do
                  [ -f "$pak" ] && cp -f "$pak" dist/cef/
                done
                # Locales — en-US only (saves ~18 MB)
                [ -f "$cefDir/locales/en-US.pak" ] && cp -f "$cefDir/locales/en-US.pak" dist/cef/locales/
                # SKIPPED (not needed):
                #   dxil.dll, dxcompiler.dll (WebGPU — not used)
                #   snapshot_blob.bin (removed in CEF 133+)
                #   49 non-English locale .pak files
                echo "✓ Bundled runtime to dist/cef/ (GPU + SwiftShader software fallback kept; WebGPU/extra locales stripped)"

    bundle:darwin:
        internal: true
        platforms: [darwin]
        cmds:
            - |
                # Resolve macOS CEF runtime via shell helper. Three-tier order:
                #   1. $AGENTMUX_CEF_RUNTIME_DIR_DARWIN (explicit override)
                #   2. ~/cef-build/darwin/<arch> (custom builds)
                #   3. cef-dll-sys cargo cache (fallback — public upstream)
                # See docs/specs/SPEC_MACOS_CEF_FRAMEWORK_BUNDLING_2026_05_28.md.
                # Fail fast on any step: a missing CEF framework, a `ditto`
                # failure, or an unreadable GL lib should fail bundle, not
                # leak through to dev:serve which would launch the host
                # straight into the cef-rs LibraryLoader panic and look
                # like a runtime bug. Matches `bundle:windows`'s explicit
                # error handling.
                set -euo pipefail
                CEF_DIR="$(bash scripts/resolve-cef-runtime-darwin.sh)"
                if [ -z "$CEF_DIR" ] || [ ! -d "$CEF_DIR/Chromium Embedded Framework.framework" ]; then
                    echo "❌ resolve-cef-runtime-darwin.sh did not yield a usable CEF framework" >&2
                    exit 1
                fi
                # Advisory BeginWindowDrag-patch check — non-fatal here so `task dev`
                # still works on the upstream cef-dll-sys fallback (no multi-hour CEF
                # build required). Must run on the UNSTRIPPED framework, before the
                # packaging strip. The hard release gate is in package-macos.sh.
                # LOUD on failure (issue #1335 trap 1: an unpatched framework used to
                # be bundled silently, wasting whole debugging sessions on features
                # the binary could not have).
                if ! bash scripts/verify-cef-framework-darwin.sh "$CEF_DIR"; then
                    echo "" >&2
                    echo "⚠️ ⚠️ ⚠️  BUNDLING AN UNPATCHED (stock upstream) CEF FRAMEWORK  ⚠️ ⚠️ ⚠️" >&2
                    echo "    Native window drag and per-pixel window transparency will silently" >&2
                    echo "    no-op in this build. To use the patched framework: stage it at" >&2
                    echo "    ~/cef-build/darwin/aarch64 or set AGENTMUX_CEF_RUNTIME_DIR_DARWIN." >&2
                    echo "    (Dev build continues anyway — this is advisory.)" >&2
                    echo "" >&2
                fi
                mkdir -p dist/Frameworks dist/cef
                rm -rf "dist/Frameworks/Chromium Embedded Framework.framework"
                # `ditto` preserves the Versions/Current symlink chain that the
                # CEF loader follows on macOS; `cp -R` flattens it and breaks
                # framework lookup. The cef-dll-sys cargo-cache framework is
                # already flat (no Versions/), so `ditto` works for both that
                # and a real cef-build framework.
                ditto "$CEF_DIR/Chromium Embedded Framework.framework" "dist/Frameworks/Chromium Embedded Framework.framework"
                # Chromium's GPU process discovers GL libraries via
                # base::PathService::Get(DIR_MODULE), which resolves to the
                # directory of the *host* executable — not the framework's
                # Libraries/ directory. Without these next to the exe the
                # GPU process exits at gl_implementation.cc:522 ("Failed to
                # load libGLESv2.dylib") and the renderer surfaces an
                # app-wide "renderer crashed" banner. Copy rather than
                # symlink because dev:serve's `cp -r dist/cef/* dist/cef-dev/`
                # would otherwise leave dangling relative links once the
                # cef-dev copy lives one level lower than dist/cef.
                # 22 MB on disk — negligible.
                libs_dir="$CEF_DIR/Chromium Embedded Framework.framework/Libraries"
                if [ ! -d "$libs_dir" ]; then
                    echo "❌ Framework Libraries/ directory missing: $libs_dir" >&2
                    exit 1
                fi
                for lib in "$libs_dir/"*.dylib; do
                    cp -f "$lib" "dist/cef/$(basename "$lib")"
                done
                cp -f "$libs_dir/vk_swiftshader_icd.json" "dist/cef/vk_swiftshader_icd.json"
                echo "✓ Bundled CEF Framework for macOS (dist/Frameworks/ + GL libs in dist/cef/)"

    bundle:linux:
        internal: true
        platforms: [linux]
        cmds:
            - |
                # Resolve CEF runtime via shell helper. Three-tier order:
                #   1. $AGENTMUX_CEF_RUNTIME_DIR (explicit override)
                #   2. ~/cef-build/chromium_git/chromium/src/out/Release_GN_x64 (default)
                #   3. cef-dll-sys cargo cache (fallback — upstream, drag broken)
                # See docs/specs/patched-libcef-bundling-2026-05-08.md.
                CEF_DIR="$(bash scripts/resolve-cef-runtime.sh)"
                echo "Using CEF runtime from: $CEF_DIR"
                # Advisory BeginWindowDrag-patch check — non-fatal here so `task dev`
                # still works on the upstream cef-dll-sys fallback (no 3-hour CEF
                # build required). The hard release gate is in build-appimage-linux.sh.
                bash scripts/verify-cef-patch.sh "$CEF_DIR" || true
                mkdir -p dist/cef/locales
                cp -f "$CEF_DIR/libcef.so" dist/cef/
                cp -f "$CEF_DIR/libEGL.so" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/libGLESv2.so" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/chrome-sandbox" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/chrome_crashpad_handler" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/icudtl.dat" dist/cef/
                cp -f "$CEF_DIR/snapshot_blob.bin" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/v8_context_snapshot.bin" dist/cef/ 2>/dev/null || true
                # CEF 148+ ships Vulkan SwiftShader as the software-rasterizer
                # fallback (replacing the GLES SwiftShader path that 146 used).
                # Chromium's GPU process loads vk_swiftshader_icd.json via
                # VK_ICD_FILENAMES → libvk_swiftshader.so, and libvulkan.so.1
                # is the loader. All three are required for the renderer/GPU
                # processes to start on machines without a system Vulkan loader;
                # missing them shows up as a renderer SIGTRAP at gpu init.
                cp -f "$CEF_DIR/libvk_swiftshader.so" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/vk_swiftshader_icd.json" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR/libvulkan.so.1" dist/cef/ 2>/dev/null || true
                cp -f "$CEF_DIR"/*.pak dist/cef/
                cp -f "$CEF_DIR/locales/en-US.pak" dist/cef/locales/ 2>/dev/null || true
                echo "✓ Bundled runtime for Linux"

    dev:serve:
        internal: true
        desc: Start Vite dev server and the app concurrently, via the launcher (launcher → srv + host on all platforms; Windows uses the runtime/ layout, macOS/Linux a flat layout).
        # No `vars: TITLE: ''` here either — see the `dev` task's comment
        # above (same go-task CLI/caller-var shadowing gotcha applies to a
        # parent task's `task: dev:serve / vars: TITLE: ...` call just as
        # much as to a CLI-supplied var).
        env:
            VITE_DEV_TITLE: '{{.TITLE}}'
        cmds:
            - task: build:host
            - task: bundle
            - cmd: |
                # Gate on successful bundle — don't launch stale binaries
                if [ ! -f dist/cef/agentmux-cef{{exeExt}} ]; then
                  echo "❌ dist/cef/agentmux-cef{{exeExt}} not found — build failed?"
                  exit 1
                fi
                if [ ! -f dist/cef/libcef.dll ] && [ "{{OS}}" = "windows" ]; then
                  echo "❌ dist/cef/libcef.dll not found — bundle failed?"
                  exit 1
                fi

                # Build the dev session dir. Two layouts:
                #
                #   Windows: production-parallel layout — launcher at root,
                #            host + DLLs + srv in runtime/. Exercises the
                #            launcher's Job Object, single-instance pipe,
                #            saga coordinator, splash, and srv-spawn paths
                #            so dev mirrors the package-portable runtime.
                #            See docs/specs/SPEC_LAUNCHER_DEV_INTEGRATION_2026-05-13.md.
                #
                #   Unix:    flat layout — launcher + host + srv co-located
                #            in DEV_DIR (no runtime/ subdir, so the host's
                #            ../Frameworks resolution + asset anchoring stay
                #            byte-identical to the legacy direct-invoke path).
                #            The launcher drives srv + host here too (Phase 1,
                #            SPEC_LAUNCHER_MACOS_DEV_INTEGRATION_2026_05_30);
                #            `task dev:standalone` is the direct-invoke hatch.
                #
                # Either way the staging dir (dist/cef/) is never locked by
                # the running process, so the next build can overwrite it.
                #
                # Windows: use a timestamp-stamped dir so a re-run never tries to
                # wipe agentmux-launcher.exe while it is still running. Windows
                # locks the EXE image for the process lifetime, so rm -rf on a
                # running dir exits non-zero and the subsequent cp fails (exit 201).
                # Old cef-dev-* dirs accumulate but are small; run `task clean:host`
                # after stopping a dev session to wipe them all. No prune loop here:
                # rm -rf on a live dir partially succeeds (unlocked files like
                # agentmux-mcp are deleted while locked DLLs/EXE survive), leaving
                # the running session with broken tool paths on the next shell call.
                # Unix keeps a fixed "dist/cef-dev" name so install-linux-desktop.sh
                # writes a stable Exec= path that survives across dev sessions.
                if [ "{{OS}}" = "windows" ]; then
                  DEV_DIR="dist/cef-dev-$(date +%s 2>/dev/null || echo dev)"
                else
                  DEV_DIR="dist/cef-dev"
                  rm -rf "$DEV_DIR" 2>/dev/null || true
                fi
                if [ "{{OS}}" = "windows" ]; then
                  mkdir -p "$DEV_DIR/runtime"
                  cp target/release/agentmux-launcher.exe "$DEV_DIR/agentmux-launcher.exe"
                  cp -r dist/cef/* "$DEV_DIR/runtime/"
                  # srv binary — launcher's resolve_srv_binary checks
                  # runtime/agentmux-srv-{ver}-windows.x64.exe first
                  # (agentmux-launcher/src/srv_spawner.rs:295-307).
                  cp dist/bin/agentmux-srv-*-windows.x64.exe "$DEV_DIR/runtime/" 2>/dev/null || true
                  # Streaming bash wrapper — agents resolve `agentmux-bashwrap`
                  # via the bundled tools/bin (agentmux-srv prepends it to the
                  # agent PATH). Without this, dev agents fall through to a
                  # STALE agentmux-bashwrap elsewhere on the system PATH and
                  # silently run a pre-fix binary (exit-130). Mirrors
                  # scripts/package-portable.sh:121. See
                  # docs/retro/RETRO_BASHWRAP_STALE_BUNDLE_2026_06_13.md.
                  mkdir -p "$DEV_DIR/runtime/tools/bin"
                  cp target/release/agentmux-bashwrap.exe "$DEV_DIR/runtime/tools/bin/"
                  # MCP server — the auto-injected .mcp.json uses the bare name
                  # "command": "agentmux-mcp", resolved via the bundled tools/bin
                  # that agentmux-srv prepends to the agent PATH (tool_store.rs:84).
                  # Without this the Shell tool is command-not-found under task dev.
                  # Built by build:host:windows (-p agentmux-mcp), like bashwrap.
                  cp target/release/agentmux-mcp.exe "$DEV_DIR/runtime/tools/bin/"
                  echo "Built $DEV_DIR with launcher layout (launcher at root, host + DLLs + srv in runtime/, bashwrap + mcp in runtime/tools/bin/)"
                else
                  # Unix flat layout (Phase 1,
                  # SPEC_LAUNCHER_MACOS_DEV_INTEGRATION_2026_05_30): launcher
                  # + host + srv all co-located in DEV_DIR. The launcher is
                  # already inside dist/cef/ (staged by build:host:darwin),
                  # so the `cp -r` below brings it across with the host. Flat
                  # — NOT runtime/ — so the host's `../Frameworks` resolution
                  # and current_exe()-based asset anchoring stay byte-identical
                  # to the legacy direct-invoke path (launcher's runtime_dir
                  # falls back to exe_dir when there's no runtime/ subdir).
                  mkdir -p "$DEV_DIR"
                  cp -r dist/cef/* "$DEV_DIR"/
                  # srv binary — launcher's resolve_srv_binary candidate 4 is
                  # launcher_exe_dir/agentmux-srv (plain name). DEV_DIR is
                  # wiped each run so the plain name can't go stale. Copy the
                  # EXACT version-matched srv (dist/bin holds older versions
                  # too — a glob would match several and break `cp`).
                  if [ "{{OS}}" = "darwin" ]; then
                    SRV_SRC="dist/bin/agentmux-srv-{{.VERSION}}-darwin.arm64"
                  else
                    SRV_SRC="dist/bin/agentmux-srv-{{.VERSION}}-linux.x64"
                  fi
                  cp "$SRV_SRC" "$DEV_DIR/agentmux-srv" 2>/dev/null || true
                  # Streaming bash wrapper — flat layout means the sidecar's
                  # bundled_tools_dir is "$DEV_DIR/tools/bin". Without this,
                  # agents resolve a stale agentmux-bashwrap off the system
                  # PATH (exit-130). See
                  # docs/retro/RETRO_BASHWRAP_STALE_BUNDLE_2026_06_13.md.
                  mkdir -p "$DEV_DIR/tools/bin"
                  # Fail loud: build:host:{darwin,linux} build -p agentmux-bashwrap,
                  # so a missing binary here is a real regression, not "optional".
                  cp target/release/agentmux-bashwrap "$DEV_DIR/tools/bin/"
                  # MCP server — the auto-injected .mcp.json uses the bare name
                  # "command": "agentmux-mcp", resolved via the bundled tools/bin
                  # that agentmux-srv prepends to the agent PATH (tool_store.rs:84).
                  # Without this the Shell tool is command-not-found under task dev.
                  # Built by build:host:{darwin,linux} (-p agentmux-mcp), like bashwrap.
                  cp target/release/agentmux-mcp "$DEV_DIR/tools/bin/"
                  if [ ! -f "$DEV_DIR/agentmux-launcher" ]; then
                    echo "❌ $DEV_DIR/agentmux-launcher not found — build:host:{{OS}} should have staged it"
                    exit 1
                  fi
                  if [ ! -f "$DEV_DIR/agentmux-srv" ]; then
                    echo "❌ $DEV_DIR/agentmux-srv not found — build:backend should have produced dist/bin/agentmux-srv-*"
                    exit 1
                  fi
                  echo "Built $DEV_DIR with flat launcher layout (launcher + host + srv co-located)"
                fi

                # Linux: register the .desktop file + hicolor icons so the
                # window manager (GNOME/KWin/sway) shows the AgentMux logo
                # in the taskbar/dock instead of a generic cog. Idempotent —
                # safe to run on every dev launch. Best-effort: a missing
                # `convert`/`gtk-update-icon-cache` doesn't fail the launch.
                if [ "{{OS}}" = "linux" ]; then
                  bash scripts/install-linux-desktop.sh "$(pwd)/$DEV_DIR/agentmux-cef" \
                    || echo "⚠ install-linux-desktop.sh failed; icon may be wrong but launch continues"
                fi

                # Per-clone Vite port — companion to RuntimeMode::Dev clone_id
                # (PR #1053). 5173 is the default for the first dev clone;
                # a second clone running `task dev` simultaneously gets a
                # different deterministic port derived from a hash of its
                # workspace root so two clones never collide. Manual override
                # via AGENTMUX_VITE_PORT=<n> always wins.
                #
                # `cksum` is in POSIX coreutils and ships with git-bash on
                # Windows + every Linux/macOS we target — no toolchain risk.
                # Range is 5173-5372 (200 ports — far more than enough).
                CLONE_ROOT="$(pwd -P 2>/dev/null || pwd)"
                if [ -z "$AGENTMUX_VITE_PORT" ]; then
                  PORT_OFFSET=$(( $(echo -n "$CLONE_ROOT" | cksum | cut -d' ' -f1) % 200 ))
                  AGENTMUX_VITE_PORT=$((5173 + PORT_OFFSET))
                  echo "Auto-selected Vite port $AGENTMUX_VITE_PORT for clone $CLONE_ROOT"
                fi
                VITE_URL="http://localhost:$AGENTMUX_VITE_PORT"
                export AGENTMUX_VITE_PORT

                # Refuse to attach the host to a foreign Vite. If our chosen
                # port is already held by another process, our spawn would
                # silently die and the curl readiness probe would still pass
                # against the *other* Vite — the host then loads that
                # workspace's source, surfacing confusing cross-tree errors.
                # Pre-check the port before spawning so a collision fails
                # fast with a clear message.
                #
                # Note: we can't use `$!` here for liveness/cleanup because
                # go-task's embedded shell (mvdan/sh) tracks background jobs
                # as goroutine IDs ("g1"), not real OS PIDs — so $! is never
                # a kill-able pid in this context.
                if curl -s --max-time 1 "$VITE_URL" > /dev/null 2>&1; then
                  # The per-clone port is held. The overwhelmingly common cause is
                  # OUR OWN Vite, orphaned by a prior dev session: the host window
                  # closed but the backgrounded Vite (unkillable here — $! is a
                  # goroutine id under go-task's shell, see note above) kept squatting
                  # the deterministic port, and --strictPort then strands every
                  # relaunch. Reap it best-effort; if the port is STILL held we treat
                  # it as a genuinely foreign process and fail as before. See
                  # docs/retro/retro-dev-instance-vite-orphan-port-2026-06-16.md.
                  echo "[dev] Port $AGENTMUX_VITE_PORT busy — reaping a stale Vite if present…"
                  if [ "{{OS}}" = "windows" ]; then
                    pid="$(netstat -ano 2>/dev/null | grep -i LISTENING | grep ":$AGENTMUX_VITE_PORT " | awk '{print $NF}' | head -1)"
                    if [ -n "$pid" ]; then
                      proc="$(tasklist /FI "PID eq $pid" /FO CSV /NH 2>/dev/null | head -1 | cut -d',' -f1 | tr -d '"')"
                      if echo "$proc" | grep -qi "node"; then
                        # Guard: only reap if the process's CommandLine references THIS clone's
                        # root. A different clone's live Vite is also node.exe on the same
                        # port (hash collision); killing it would break that still-running
                        # session. CommandLine is a real Win32_Process property (WorkingDirectory
                        # is not). Uses trailing-slash anchor to prevent superstring matches
                        # (repo vs repo-v2). Fails safe: if ownership can't be verified, errors.
                        _ps="$(command -v pwsh 2>/dev/null)"; [ -z "$_ps" ] && _ps="$(command -v powershell.exe 2>/dev/null)"
                        if [ -z "$_ps" ]; then
                          echo "❌ Cannot verify Vite ownership (no pwsh/powershell.exe found) — will not reap."
                          echo "   Override with: AGENTMUX_VITE_PORT=<free-port> task dev"
                          exit 1
                        fi
                        proc_cmd="$("$_ps" -NoProfile -Command "(Get-CimInstance Win32_Process -Filter 'ProcessId=$pid').CommandLine" 2>/dev/null | tr -d '\r\n' | tr '[:upper:]' '[:lower:]' | tr '\\' '/')"
                        our_root="$(echo "$CLONE_ROOT" | tr '[:upper:]' '[:lower:]' | tr '\\' '/' | sed 's|^/[a-z]/||' | sed 's|^[a-z]:/||')"
                        if [ -z "$proc_cmd" ] || ! echo "$proc_cmd" | grep -qF "${our_root}/"; then
                          echo "❌ Port $AGENTMUX_VITE_PORT is held by a node process whose command line does not reference this clone (${our_root}) — likely another dev instance."
                          echo "   Override with: AGENTMUX_VITE_PORT=<free-port> task dev"
                          exit 1
                        fi
                        taskkill /PID "$pid" /T /F > /dev/null 2>&1 || true
                      else
                        echo "❌ Port $AGENTMUX_VITE_PORT is held by a non-node process ($proc, pid=$pid) — will not reap."
                        echo "   Override with: AGENTMUX_VITE_PORT=<free-port> task dev"
                        exit 1
                      fi
                    fi
                  else
                    pid="$(lsof -ti ":$AGENTMUX_VITE_PORT" 2>/dev/null | head -1)"
                    if [ -n "$pid" ]; then
                      proc="$(ps -p "$pid" -o comm= 2>/dev/null)"
                      if echo "$proc" | grep -qi "node"; then
                        # Guard: only reap if it's OUR orphaned Vite (same CWD).
                        # Another clone's live Vite on the same port (hash collision)
                        # must not be killed.
                        if command -v pwdx >/dev/null 2>&1; then
                          proc_wd="$(pwdx "$pid" 2>/dev/null | cut -d: -f2- | sed 's/^[[:space:]]*//' | tr -d '\n')"
                        else
                          proc_wd="$(lsof -p "$pid" -a -d cwd -F n 2>/dev/null | grep '^n' | cut -c2-)"
                        fi
                        if [ -n "$proc_wd" ] && [ "$proc_wd" = "$CLONE_ROOT" ]; then
                          kill -9 "$pid" 2>/dev/null || true
                        else
                          echo "❌ Port $AGENTMUX_VITE_PORT is held by a node process whose working dir ($proc_wd) does not match this clone ($CLONE_ROOT) — likely another dev instance."
                          echo "   Override with: AGENTMUX_VITE_PORT=<free-port> task dev"
                          exit 1
                        fi
                      else
                        echo "❌ Port $AGENTMUX_VITE_PORT is held by a non-node process ($proc, pid=$pid) — will not reap."
                        echo "   Override with: AGENTMUX_VITE_PORT=<free-port> task dev"
                        exit 1
                      fi
                    fi
                  fi
                  sleep 1
                  if curl -s --max-time 1 "$VITE_URL" > /dev/null 2>&1; then
                    echo "❌ Port $AGENTMUX_VITE_PORT is still in use after reaping (foreign process)."
                    echo "   The per-clone derivation collided, or a non-dev process holds it. Override with:"
                    echo "   AGENTMUX_VITE_PORT=<free-port> task dev"
                    exit 1
                  fi
                  echo "[dev] Reaped stale Vite — port $AGENTMUX_VITE_PORT is free."
                fi

                # Don't `rm -rf $DEV_DIR` on exit — install-linux-desktop.sh
                # writes Exec=$DEV_DIR/agentmux-cef into the user's
                # ~/.local/share/applications/agentmux.desktop, and that path
                # has to stay valid between dev sessions for dock-clicks to
                # work. Unix: each `dev:serve` start wipes + recreates the
                # fixed $DEV_DIR, so leaving it around is safe (no stale
                # binaries leak across versions). Windows: each run creates a
                # fresh dist/cef-dev-<epoch> dir and never wipes it; old dirs
                # accumulate until `task clean:host` removes them.
                #
                # --strictPort closes the TOCTOU window: if something binds
                # our port between the pre-check and Vite startup, Vite
                # errors out instead of silently rebinding to the next free
                # port (which would let the readiness loop succeed against
                # the foreign Vite we're trying to avoid attaching to).
                # Reagent P1 on #866.
                AGENTMUX_VITE_PORT="$AGENTMUX_VITE_PORT" npx vite --config vite.config.ts --port "$AGENTMUX_VITE_PORT" --strictPort &

                echo "Waiting for Vite on port $AGENTMUX_VITE_PORT..."
                for i in $(seq 1 30); do
                  curl -s "$VITE_URL" > /dev/null 2>&1 && break
                  sleep 1
                done
                if ! curl -s "$VITE_URL" > /dev/null 2>&1; then
                  echo "❌ Vite failed to start within 30 seconds"
                  exit 1
                fi
                echo "Vite ready at $VITE_URL."
                # macOS/Linux: auto-prune any stale Chromium SingletonLock
                # whose target PID is dead. Without this, a crashed host
                # leaves a `<cache>/SingletonLock` symlink pointing at a
                # non-existent PID; the next `task dev` reads it, hands off
                # via process_singleton, and exits with code 24 — the user
                # sees "AgentMux failed to start" with no obvious recovery.
                # On macOS 26 Tahoe this used to happen after every drag-
                # induced crash (see #1138 / SPEC_MACOS_TEAROFF_STABILITY).
                # Scoped to ~/.agentmux/dev/* so portable/installed locks
                # are never touched; only flags actually-dead PIDs.
                if [ "{{OS}}" != "windows" ]; then
                  for lock in "$HOME/.agentmux/dev/"*/*/cef-cache/SingletonLock; do
                    [ -L "$lock" ] || continue
                    target=$(readlink "$lock") || continue
                    pid="${target##*-}"
                    [ -n "$pid" ] || continue
                    if ! kill -0 "$pid" 2>/dev/null; then
                      cache_dir=$(dirname "$lock")
                      echo "[singleton] Pruning stale lock at $cache_dir (pid $pid is gone)"
                      rm -f "$cache_dir/SingletonLock" \
                            "$cache_dir/SingletonCookie" \
                            "$cache_dir/SingletonSocket" \
                            "$cache_dir/ipc-port"
                    fi
                  done
                fi
                # Inline AGENTMUX_DEV=1 on the launch: go-task's top-level
                # env: block (on the `dev` task) doesn't propagate into
                # cmd: shell subprocesses invoked via `task:` on Windows,
                # so the launched binary would start without the flag and
                # skip the authkey.dev write (docs/specs/SPEC_TEST_API_ACCESS.md §6).
                # The launcher inherits AGENTMUX_DEV and the host inherits
                # it transitively through tokio::process::Command::spawn.
                if [ "{{OS}}" = "windows" ]; then
                  cd "$DEV_DIR" && AGENTMUX_DEV=1 ./agentmux-launcher.exe --url="$VITE_URL"
                else
                  # Phase 1: launch via the launcher (it spawns srv, hands the
                  # host its endpoints, and supervises both). LD_LIBRARY_PATH=.
                  # so the launcher-spawned host finds libcef next to it (Linux);
                  # the host inherits it through tokio's spawn. The launcher +
                  # host + srv share the terminal's process group, so Ctrl+C
                  # reaches all three. `task dev:standalone` keeps the direct
                  # host-invoke escape hatch.
                  cd "$DEV_DIR" && LD_LIBRARY_PATH=. AGENTMUX_DEV=1 ./agentmux-launcher{{exeExt}} --url="$VITE_URL"
                fi

    dev:standalone:serve:
        internal: true
        desc: Dev escape hatch — flat layout, host invoked directly, launcher bypassed on all OSes.
        cmds:
            - task: build:host
            - task: bundle
            - cmd: |
                if [ ! -f dist/cef/agentmux-cef{{exeExt}} ]; then
                  echo "❌ dist/cef/agentmux-cef{{exeExt}} not found — build failed?"
                  exit 1
                fi
                if [ ! -f dist/cef/libcef.dll ] && [ "{{OS}}" = "windows" ]; then
                  echo "❌ dist/cef/libcef.dll not found — bundle failed?"
                  exit 1
                fi

                echo "⚠ dev:standalone — launcher bypassed. Phase B features (Job Object, IPC, sagas, splash) UNEXERCISED. Use 'task dev' for production-parallel behavior."

                DEV_DIR="dist/cef-dev"
                rm -rf "$DEV_DIR" 2>/dev/null || true
                mkdir -p "$DEV_DIR"
                cp -r dist/cef/* "$DEV_DIR"/

                if [ "{{OS}}" = "linux" ]; then
                  bash scripts/install-linux-desktop.sh "$(pwd)/$DEV_DIR/agentmux-cef" \
                    || echo "⚠ install-linux-desktop.sh failed; icon may be wrong but launch continues"
                fi

                # Mirror dev:serve's pre-check + strictPort pattern + per-clone
                # port derivation. The previous `kill -0 "$VITE_PID"` check was
                # broken under go-task's mvdan/sh shell — $! returns a goroutine
                # ID ("g1"), not a real OS PID, so `kill -0 g1` exits non-zero
                # immediately and the loop reported a false "Vite exited" on
                # every run. Reagent P1 on #866.
                if [ -z "$AGENTMUX_VITE_PORT" ]; then
                  CLONE_ROOT="$(pwd)"
                  PORT_OFFSET=$(( $(echo -n "$CLONE_ROOT" | cksum | cut -d' ' -f1) % 200 ))
                  AGENTMUX_VITE_PORT=$((5173 + PORT_OFFSET))
                  echo "Auto-selected Vite port $AGENTMUX_VITE_PORT for clone $CLONE_ROOT"
                fi
                VITE_URL="http://localhost:$AGENTMUX_VITE_PORT"
                export AGENTMUX_VITE_PORT
                if curl -s --max-time 1 "$VITE_URL" > /dev/null 2>&1; then
                  echo "❌ Port $AGENTMUX_VITE_PORT is already in use."
                  echo "   Override with AGENTMUX_VITE_PORT=<free-port> task dev:standalone"
                  exit 1
                fi
                AGENTMUX_VITE_PORT="$AGENTMUX_VITE_PORT" npx vite --config vite.config.ts --port "$AGENTMUX_VITE_PORT" --strictPort &
                echo "Waiting for Vite on port $AGENTMUX_VITE_PORT..."
                for i in $(seq 1 30); do
                  curl -s "$VITE_URL" > /dev/null 2>&1 && break
                  sleep 1
                done
                if ! curl -s "$VITE_URL" > /dev/null 2>&1; then
                  echo "❌ Vite failed to start within 30 seconds"
                  exit 1
                fi
                echo "Vite ready at $VITE_URL."
                # `LD_LIBRARY_PATH` is a Unix-only convention; on Windows
                # it has no effect but is inconsistent with the `dev:serve`
                # OS gate above. Mirror that gate here.
                if [ "{{OS}}" = "windows" ]; then
                  cd "$DEV_DIR" && AGENTMUX_DEV=1 ./agentmux-cef{{exeExt}} --url="$VITE_URL"
                else
                  cd "$DEV_DIR" && LD_LIBRARY_PATH=. AGENTMUX_DEV=1 ./agentmux-cef{{exeExt}} --url="$VITE_URL"
                fi

    run:
        desc: Run the host (must be built and bundled first).
        cmds:
            - task: run:{{OS}}

    run:windows:
        internal: true
        platforms: [windows]
        cmd: cmd /c "cd dist\\cef && agentmux-cef.exe --url=http://localhost:5173"

    run:darwin:
        internal: true
        platforms: [darwin]
        cmd: cd dist/cef && ./agentmux-cef --url=http://localhost:5173

    run:linux:
        internal: true
        platforms: [linux]
        cmd: cd dist/cef && LD_LIBRARY_PATH=. ./agentmux-cef --url=http://localhost:5173

    clean:host:
        desc: Clean host build artifacts.
        cmds:
            - cmd: '{{.RMRF}} "dist/cef"'
              ignore_error: true
            - cmd: '{{.RMRF}} "dist/cef-dev"'
              ignore_error: true
            - cmd: bash -c 'rm -rf dist/cef-dev-* 2>/dev/null || true'
              ignore_error: true

    clean:cef:
        desc: >-
            Remove the extracted/bundled CEF runtime so the next build
            re-materializes one matching the linked `cef` crate. Use after a CEF
            version bump if target/release holds a stale libcef (see
            SPEC_WINDOWS_CEF_BUNDLE_VERSION_INTEGRITY_2026_06_03.md).
        cmds:
            # ROOT CAUSE of the 148-host/146-runtime skew: the `cef` crate's
            # build-util stages a pinned CEF SDK here and REUSES it across crate
            # version bumps (the staging is NOT version-keyed), so a 146→148 crate
            # bump kept serving the old 146 libcef. Remove it so the next build
            # re-downloads the CEF matching the linked crate.
            - cmd: '{{.RMRF}} "target/cef-sdk"'
              ignore_error: true
            # Drop cef-dll-sys build dirs so cargo re-runs its build script and
            # re-copies the correct CEF runtime into target/ on the next build.
            # Use `bash -c` so the globs expand on EVERY OS: {{.RMRF}} double-
            # quotes its path, and POSIX `rm -rf` does not glob inside quotes
            # (only Windows PowerShell Remove-Item expands a quoted wildcard),
            # so a quoted glob would silently leave the cef-dll-sys-<hash> dirs
            # behind off-Windows. bash is already a build dependency everywhere
            # (build:host:linux/windows, package, scripts/* all shell out to it).
            - cmd: bash -c 'rm -rf target/release/build/cef-dll-sys-* target/fast-release/build/cef-dll-sys-* target/debug/build/cef-dll-sys-*'
              ignore_error: true
            # Drop the top-level runtime copies that bundle:* reads from.
            - cmd: '{{.RMRF}} "target/release/libcef.dll"'
              ignore_error: true
            - cmd: '{{.RMRF}} "target/release/libcef.so"'
              ignore_error: true
            - cmd: '{{.RMRF}} "target/release/icudtl.dat"'
              ignore_error: true
            - cmd: '{{.RMRF}} "target/release/v8_context_snapshot.bin"'
              ignore_error: true
            - cmd: '{{.RMRF}} "target/release/locales"'
              ignore_error: true
            - echo "✓ Cleared CEF runtime artifacts — next 'task build:host' will re-materialize CEF"

    # ========================================
    # End Host Tasks
    # ========================================

