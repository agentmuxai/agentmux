[package]
name = "agentmux-srv"
version.workspace = true
license = "Apache-2.0"
edition = "2021"
description = "AgentMux Rust backend server: the server layer, the binaries"

[[bin]]
name = "agentmux-srv"
path = "src/main.rs"

# The command that runs and manages the server (SPEC_HEADLESS_SERVER_PACKAGE_AND_LOCAL_WEB_UI §4.1).
# Its own program, with none of the server's modules.
[[bin]]
name = "agentmux"
path = "src/agentmux_cli/main.rs"

# What the Windows logon task runs: a program of the graphical subsystem, so no console window shows at sign-in. It
# starts `agentmux run` from its own folder and waits for it.
[[bin]]
name = "agentmuxw"
path = "src/agentmuxw.rs"

[dependencies]
# The server's core: storage, registry, identity, agents, the event bus (crates/srv-core).
agentmux-srv-core = { path = "../srv-core" }
agentmux-common = { path = "../common", features = ["ts", "tls-provider"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# WHATWG origin serialization for headless --allowed-origin (already in the tree via reqwest).
url = "2"
tower = { version = "0.5" }
serde = { version = "1", features = ["derive"] }
# raw_value: a capture finds the exact text a JSON path matched, to clean it out of the output.
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# The `log` -> `tracing` bridge (bootstrap/logging.rs). `mdns-sd`, and every other
# dependency that logs through the `log` crate, was SILENT in our logs because no
# bridge was installed. All three are already in the tree, so this adds nothing new.
tracing-log = "0.2"
log = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rusqlite = { version = "0.41", features = ["bundled", "backup", "blob"] }
# TypeScript type generation for the RPC bindings (backend/rpc/schema.rs, and
# the export_bindings_rpc_schema test that feeds scripts/gen-rpc-stubs.mjs).
# serde-json-impl gives serde_json::Value a TS impl (JsonValue), which
# register_typed needs for the commands that take or return raw JSON.
# Derive-only: ts-rs emits a .ts declaration per #[derive(TS)] type when the
# export test runs, and contributes nothing at runtime. The serde-compat
# feature makes it honour the rename_all / default / skip_serializing_if
# attributes these structs already carry, so the emitted type matches the
# wire shape serde actually produces rather than the Rust field names.
# See docs/specs/SPEC_RPC_BINDINGS_CODEGEN_2026_09_07.md.
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
base64 = "0.22"
thiserror = "1"
dirs = "5"
libc = "0.2"
whoami = "1"
async-stream = "0.3"
portable-pty = "0.9"
sysinfo = "0.35"
parking_lot = "0.12"
# "stream" is needed by backend/dev_proxy.rs's request/response body
# streaming (`Body::wrap_stream` / `Response::bytes_stream`) — the native
# reverse proxy forwards a dev server's traffic without buffering it whole
# in memory. See docs/specs/SPEC_NATIVE_CONTAINER_DEV_PROXY_2026_09_19.md.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form", "multipart", "stream"] }
# Zero plaintext secret buffers on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
# `Terminal` `run`'s capture rules find a value in a command's output with a regex
# (SPEC_VAULT_GENERATE_CAPTURE_AND_BROWSER_SIGNINS_2026_10_28.md §4.2).
regex = "1"
which = "7"
# The durable-session protocol, shared with the helper (crates/remote).
agentmux-remote = { path = "../remote" }
agentmux-procstats = { path = "../procstats" }
flate2 = "1"
sha2 = "0.10"
# Image attachments in the agent composer: decode, orient, downscale, re-encode
# (SPEC_AGENT_PANE_IMAGE_ATTACHMENTS_2026_09_26.md §6.4). Same 0.25 line the
# workspace already locks for agentmux-mcp.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
hex = "0.4"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
# HMAC-SHA256 for the WhatsApp Cloud API webhook signature check
# (X-Hub-Signature-256). `Mac::verify_slice` is constant-time internally
# (backed by `subtle`, already present transitively). See
# messaging/whatsapp/webhook.rs.
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
bollard = { version = "0.18", features = ["chrono", "ssl"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Cron expression parsing for the persistent cron scheduler
cron = "0.12"
# IANA time zones for a job's cron trigger (backend/cron/schedule.rs): `cron`
# itself evaluates in one fixed offset, so daylight-saving changes are handled
# there, against this crate's zone data.
chrono-tz = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# ECDSA P-256 checks of a paired device's send signature (backend/viewer/signing),
# from the ring already under rustls: no new crate.
ring = { version = "0.17", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
# Out-of-process crash dump capture via VEH + named-pipe IPC.
# Catches AV, heap corruption, and non-__fastfail aborts.
# __fastfail (0xC0000409) is handled separately by WER LocalDumps.
crash-handler = "0.7"
minidumper = "0.9"
# Win32 Job Objects for the agent process tracker. Wraps every agent
# CLI in a job so `CreateProcess` descendants can be enumerated and
# killed as a tree. See `backend::process_tracker`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    # Asking another AgentMux an agent started to close its windows at a quit
    # (backend/background_work.rs).
    "Win32_UI_WindowsAndMessaging",
    # Win32_System_Registry dropped: its only caller (the PagingFiles
    # registry read) moved to crates/common/src/pagefile.rs, which
    # declares its own windows-sys dependency with that feature —
    # SPEC_RAM_PAGEFILE_PRESSURE_SPLIT_2026_08_07 §4.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # Who holds UDP 5353 (backend/lan/mdns_diag.rs): GetExtendedUdpTable.
    "Win32_NetworkManagement_IpHelper",
    # Interface byte counters without sysinfo's per-refresh address lookups (backend/net_counters.rs).
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
# The server layer's tests build the core with its test-only helpers.
agentmux-srv-core = { path = "../srv-core", features = ["test-support"] }
# Installs the ring TLS provider once per test binary (tls_test_init.rs): reqwest 0.13 builds no client without one.
ctor = "1"
# A paused, auto-advancing clock for tests that only wait on tokio time
# (`#[tokio::test(start_paused = true)]`). Dev-only: never in a release build.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
libc = "0.2"
# `blocking` feature enabled for the integration test target only —
# `tests/integration_test.rs` spawns the srv as a subprocess and
# wants synchronous HTTP from a non-tokio test fn. Production code
# stays on the async client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "blocking"] }

# `cargo machete` (CI gate, ci-pr.yml) can't see build.rs-only use: winres
# embeds the Windows icon/version resource from build.rs.
[package.metadata.cargo-machete]
ignored = ["winres"]
