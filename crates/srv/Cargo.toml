[package]
name = "agentmux-srv"
version.workspace = true
edition = "2021"
description = "AgentMux Rust backend server"

[[bin]]
name = "agentmux-srv"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# WHATWG origin serialization for headless --allowed-origin (already in the tree via reqwest).
url = "2"
tower = { version = "0.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
json_comments = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# The `log` -> `tracing` bridge (bootstrap/logging.rs). `mdns-sd`, and every other
# dependency that logs through the `log` crate, was SILENT in our logs because no
# bridge was installed. All three are already in the tree, so this adds nothing new.
tracing-log = "0.2"
log = "0.4"
# One-shot UDP 5353 diagnosis (backend/lan_mdns_diag.rs), the same crate `mdns-sd`
# sets its sockets up with.
socket2 = { version = "0.5.5", features = ["all"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# TypeScript type generation for the RPC bindings (backend/rpc/schema.rs +
# tests/rpc_bindings.rs). Derive-only: ts-rs emits a .ts declaration per
# #[derive(TS)] type when the export test runs, and contributes nothing at
# runtime. The serde-compat feature makes it honour the rename_all /
# default / skip_serializing_if attributes these structs already carry, so
# the emitted type matches the wire shape serde actually produces rather
# than the Rust field names.
# See docs/specs/SPEC_RPC_BINDINGS_CODEGEN_2026_09_07.md.
ts-rs = { version = "10", features = ["serde-compat"] }
base64 = "0.22"
thiserror = "1"
dirs = "5"
libc = "0.2"
whoami = "1"
async-stream = "0.3"
portable-pty = "0.9"
sysinfo = "0.35"
parking_lot = "0.12"
notify = "7"
# "stream" is needed by backend/dev_proxy.rs's request/response body
# streaming (`Body::wrap_stream` / `Response::bytes_stream`) — the native
# reverse proxy forwards a dev server's traffic without buffering it whole
# in memory. See docs/specs/SPEC_NATIVE_CONTAINER_DEV_PROXY_2026_09_19.md.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
# OS-native secret storage (macOS Keychain / Windows Credential Manager /
# Linux Secret Service) for Armory API keys. See
# docs/specs/archive/SPEC_TRUST_CENTER_2026_06_15.md §7/§12.2.
keyring = "2"
# Zero plaintext secret buffers on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
mdns-sd = "0.12"
# Interface enumeration for LAN listener bind addresses (backend/lan_listeners.rs).
# Already in the tree transitively via mdns-sd, so declaring it directly adds no
# new supply-chain surface — it just makes the dependency honest.
if-addrs = "0.13"
which = "7"
# The durable-session protocol, shared with the helper (crates/remote).
agentmux-remote = { path = "../remote" }
agentmux-procstats = { path = "../procstats" }
# Text encoding detection + transcoding for the editor (SPEC_EDITOR_FILE_ENCODINGS).
encoding_rs = "0.8"
chardetng = "0.1"
flate2 = "1"
sha2 = "0.10"
# Image attachments in the agent composer: decode, orient, downscale, re-encode
# (SPEC_AGENT_PANE_IMAGE_ATTACHMENTS_2026_09_26.md §6.4). Same 0.25 line the
# workspace already locks for agentmux-mcp.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Any-file attachments (SPEC_AGENT_PANE_FILE_ATTACHMENTS_2026_09_26.md §6):
# text from DOCX/PPTX/ODT (quick-xml over the zip parts), spreadsheets
# (calamine), PDF page count (lopdf). All pure Rust.
quick-xml = "0.39"
calamine = { version = "0.36", default-features = false }
lopdf = { version = "0.45", default-features = false }
hex = "0.4"
# HMAC-SHA256 for the WhatsApp Cloud API webhook signature check
# (X-Hub-Signature-256). `Mac::verify_slice` is constant-time internally
# (backed by `subtle`, already present transitively). See
# messaging/whatsapp/webhook.rs.
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
tempfile = "3"
bollard = { version = "0.18", features = ["chrono"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Cron expression parsing for the persistent cron scheduler
cron = "0.12"
# Move to the OS Trash / Recycle Bin, and restore from it, for the Files
# pane's `fs.trash` / `fs.restore` (backend/fs_ops/trash_worker.rs). Called
# from one dedicated thread only (its docs warn of UB from several threads
# on Linux/FreeBSD), and set to NSFileManager on macOS so it never scripts
# Finder. See docs/specs/SPEC_FILE_BROWSER_PANE_2026_10_01.md §7.3, §9.1.5.
trash = "5.2"
# The viewer listener: TLS with a self-signed certificate a paired device pins
# by fingerprint, serving the read-only feed (backend/viewer). rustls and
# tokio-rustls are already in the tree through reqwest, on ring; these keep
# ring (no aws-lc build) and add rcgen to make the certificate. hyper and
# hyper-util (already under axum) serve the router over the TLS stream.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Agent process tracking (process_tracker::cgroup_linux): ask the systemd user
# manager for srv's delegated scope. Same zbus 5 the launcher already uses.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Trash through NSFileManager ourselves, to learn where each item went, so
# undo can put it back (backend/fs_ops/trash_worker.rs). Already in the tree at
# these versions via the trash crate, so they add no new supply-chain surface.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Read-only COM access to Windows Defender Firewall and the network list, to
# tell whether LAN peers can reach us (backend/lan_firewall_windows.rs,
# SPEC_LAN_FIREWALL_SETUP_2026_10_01.md 4.2). Already in the tree at this
# version via sysinfo, so declaring it adds no new supply-chain surface.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_NetworkListManager",
] }
# Out-of-process crash dump capture via VEH + named-pipe IPC.
# Catches AV, heap corruption, and non-__fastfail aborts.
# __fastfail (0xC0000409) is handled separately by WER LocalDumps.
crash-handler = "0.7"
minidumper = "0.9"
# Win32 Job Objects for the agent process tracker. Wraps every agent
# CLI in a job so `CreateProcess` descendants can be enumerated and
# killed as a tree. See `backend::process_tracker`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    # Win32_System_Registry dropped: its only caller (the PagingFiles
    # registry read) moved to crates/common/src/pagefile.rs, which
    # declares its own windows-sys dependency with that feature —
    # SPEC_RAM_PAGEFILE_PRESSURE_SPLIT_2026_08_07 §4.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # Who holds UDP 5353 (backend/lan_mdns_diag.rs): GetExtendedUdpTable.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
# A paused, auto-advancing clock for tests that only wait on tokio time
# (`#[tokio::test(start_paused = true)]`). Dev-only: never in a release build.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
libc = "0.2"
# Phase E.7 — property-based testing for reducer arm invariants.
# `default-features = false` to avoid the timeout-fork machinery
# that doesn't play nicely with our existing test runner; we only
# need the strategy combinators + `proptest!` macro.
proptest = { version = "1", default-features = false, features = ["std"] }
# `blocking` feature enabled for the integration test target only —
# `tests/integration_test.rs` spawns the srv as a subprocess and
# wants synchronous HTTP from a non-tokio test fn. Production code
# stays on the async client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
