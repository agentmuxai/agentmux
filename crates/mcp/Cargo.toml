[package]
name = "agentmux-mcp"
version.workspace = true
edition = "2021"
description = "AgentMux MCP server — exposes Shell and other agent tools to Claude"
authors = ["AgentMux Corp"]
license = "Apache-2.0"

[[bin]]
name = "agentmux-mcp"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../common", features = ["tls-provider", "local-http"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "fs", "sync"] }
# Talks only to srv at AGENTMUX_LOCAL_URL (http://127.0.0.1:<port>). The client comes from agentmux_common::local_http, which reads
# no certificates: a build together with agentmux-srv (the server package, the desktop) turns TLS on for reqwest here too, and
# on a Linux machine with no system certificates reqwest then refuses to build a client (#4207 kept TLS off; it cannot be kept off there).
# `stream`: SendMessage streams files to srv's attachment upload route.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Cross-platform (Windows/macOS/Linux) window enumeration + capture for the
# CaptureWindow tool — deliberately not hand-rolled per-platform GDI/
# CoreGraphics/X11 FFI.
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
# Process-tree walking so CaptureWindow can exclude the caller's own
# AgentMux instance (see main.rs's own_instance_pids() doc comment).
# Version matches agentmux-srv's own pin — 0.34.2 had a real Windows
# handle leak (STATUS_SRV_SECTION_HANDLE_LEAK_2026_08_08.md), fixed in 0.35+.
sysinfo = "0.35"
# Content hash recorded in the capture audit trail, so a leaked screenshot can
# be traced back to the call that produced it (SPEC_AGENT_UNRESTRICTED_CAPTURE_
# WITH_ACCOUNTABILITY_2026_08_30.md §6). Same pin as crates/common/srv.
sha2 = "0.10"
base64 = "0.22"
# Terminal: `wait` with until "pattern" (already in the workspace lockfile).
regex = "1"

[dev-dependencies]
# Installs the ring TLS provider once per test binary (tls_test_init.rs): reqwest 0.13 builds no client without one.
ctor = "1"
tempfile = "3"

# Desktop: SendInput, window geometry and focus (desktop_input.rs). The same
# windows-sys 0.59 srv already depends on, so the lockfile gains no package.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows icon + version info (build.rs).
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# `cargo machete` (CI gate, ci-pr.yml) can't see build.rs-only use: winres
# embeds the Windows icon/version resource from build.rs.
[package.metadata.cargo-machete]
ignored = ["winres"]
