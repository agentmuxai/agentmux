[package]
name = "agentmux-mcp"
version.workspace = true
edition = "2021"
description = "AgentMux MCP server — exposes Shell and other agent tools to Claude"
authors = ["AgentMux Corp"]
license = "Apache-2.0"

[[bin]]
name = "agentmux-mcp"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Cross-platform (Windows/macOS/Linux) window enumeration + capture for the
# CaptureWindow tool — deliberately not hand-rolled per-platform GDI/
# CoreGraphics/X11 FFI.
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
# Process-tree walking so CaptureWindow can exclude the caller's own
# AgentMux instance (see main.rs's own_instance_pids() doc comment).
# Version matches agentmux-srv's own pin — 0.34.2 had a real Windows
# handle leak (STATUS_SRV_SECTION_HANDLE_LEAK_2026_08_08.md), fixed in 0.35+.
sysinfo = "0.35"
# Content hash recorded in the capture audit trail, so a leaked screenshot can
# be traced back to the call that produced it (SPEC_AGENT_UNRESTRICTED_CAPTURE_
# WITH_ACCOUNTABILITY_2026_08_30.md §6). Same pin as agentmux-common/srv.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
