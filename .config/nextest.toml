# cargo-nextest settings (https://nexte.st).
#
# nextest runs every test in its own process. Tests that share process-global
# state (the in-memory FileStore, env vars, static locks) therefore no longer
# collide, which is what kept `cargo test` on `--test-threads=1`, and the
# suite can use every core.
# docs/specs/PLAN_CI_TEST_SPEED_AND_DRY_FOLLOWUPS_2026_10_09.md step 4.

[profile.default]
# A hung test is reported after 60 s, and killed after 5 minutes.
slow-timeout = { period = "60s", terminate-after = 5 }

# Process isolation covers state inside a process. Tests that share state
# outside it, and were kept apart by an in-process lock or by running
# serially, run one at a time in a group of their own.
[test-groups]
# The OS's free ports: these bind and release ports to learn which are free,
# and a parallel test can take one meanwhile (PORT_TESTS in lan_ports.rs).
lan-ports = { max-threads = 1 }
# systemd and the cgroup tree: each test process starts a transient scope,
# and under parallel load the reaping a test waits for outlasts its wait.
cgroups = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(agentmux-srv) & test(/^backend::lan_ports::/)'
test-group = 'lan-ports'

[[profile.default.overrides]]
filter = 'package(agentmux-srv) & test(/^backend::process_tracker::cgroup_linux::/)'
test-group = 'cgroups'

# The PR lane (`cargo nextest run --profile ci`).
[profile.ci]
# One retry: a test that then passes is reported FLAKY in the summary instead
# of failing the PR. That is a report, not a fix: every FLAKY gets an issue.
retries = 1
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# The merge queue's run (`cargo nextest run --profile queue`): only the tests that read the
# source tree, or the files generated from it. A merge race breaks exactly these: one PR adds a
# guard that scans `src`, another moves a file into the scanned tree, each passes alone (#6193
# and #6196 left main red for 3 hours). Everything else ran on each PR and runs again on the push
# to main. A test that scans the source tree belongs on this list; add it by name.
# docs/specs/SPEC_CI_MERGE_QUEUE_AND_FAST_GATES_2026_10_19.md §5 Phase 7.
[profile.queue]
retries = 0
fail-fast = false
failure-output = "immediate-final"
default-filter = '''
    binary_id(agentmux-common::spawn_no_window_inventory)
  | test(~nothing_but_the_adapter_compares_a_mode_to_container)
  | test(~nothing_else_asks_for_the_first_workspaces_tab)
  | test(~only_the_listed_files_read_an_agents_state_directly)
  | test(~the_word_finder_matches_a_call_and_nothing_else)
  | test(~the_spawn_surface_matches_the_inventory_exactly)
  | test(~every_inventory_row_is_classified_and_justified)
  | test(~nothing_else_stops_an_agent)
  | test(~only_known_code_reads_the_part_table_directly)
  | test(~every_advertised_tool_has_exactly_one_handler)
  | test(~every_route_an_agent_opens_through_applies_it)
  | test(~the_slots_are_the_ones_the_host_names)
  | test(~every_refused_route_is_one_srv_serves)
  | test(~export_bindings)
'''
