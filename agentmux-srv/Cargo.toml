[package]
name = "agentmux-srv"
version = "0.33.190"
edition = "2021"
description = "AgentMux Rust backend server"

[[bin]]
name = "agentmux-srv"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json_comments = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio-util = { version = "0.7" }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
subtle = "2"
thiserror = "1"
dirs = "5"
libc = "0.2"
whoami = "1"
async-stream = "0.3"
portable-pty = "0.9"
sysinfo = "0.34"
parking_lot = "0.12"
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
mdns-sd = "0.12"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"

[target.'cfg(windows)'.dependencies]
# Out-of-process crash dump capture via VEH + named-pipe IPC.
# Catches AV, heap corruption, and non-__fastfail aborts.
# __fastfail (0xC0000409) is handled separately by WER LocalDumps.
crash-handler = "0.7"
minidumper = "0.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
