[package]
name = "agentmux-srv"
version.workspace = true
edition = "2021"
description = "AgentMux Rust backend server"

[[bin]]
name = "agentmux-srv"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json_comments = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
thiserror = "1"
dirs = "5"
libc = "0.2"
whoami = "1"
async-stream = "0.3"
portable-pty = "0.9"
sysinfo = "0.35"
parking_lot = "0.12"
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
# OS-native secret storage (macOS Keychain / Windows Credential Manager /
# Linux Secret Service) for Armory API keys. See
# docs/specs/archive/SPEC_TRUST_CENTER_2026_06_15.md §7/§12.2.
keyring = "2"
# Zero plaintext secret buffers on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
mdns-sd = "0.12"
# Interface enumeration for LAN listener bind addresses (backend/lan_listeners.rs).
# Already in the tree transitively via mdns-sd, so declaring it directly adds no
# new supply-chain surface — it just makes the dependency honest.
if-addrs = "0.13"
which = "7"
# Text encoding detection + transcoding for the editor (SPEC_EDITOR_FILE_ENCODINGS).
encoding_rs = "0.8"
chardetng = "0.1"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
# HMAC-SHA256 for the WhatsApp Cloud API webhook signature check
# (X-Hub-Signature-256). `Mac::verify_slice` is constant-time internally
# (backed by `subtle`, already present transitively). See
# messaging/whatsapp/webhook.rs.
hmac = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
tempfile = "3"
bollard = { version = "0.18", features = ["chrono"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Cron expression parsing for the persistent cron scheduler
cron = "0.12"

[target.'cfg(windows)'.dependencies]
# Out-of-process crash dump capture via VEH + named-pipe IPC.
# Catches AV, heap corruption, and non-__fastfail aborts.
# __fastfail (0xC0000409) is handled separately by WER LocalDumps.
crash-handler = "0.7"
minidumper = "0.9"
# Win32 Job Objects for the agent process tracker. Wraps every agent
# CLI in a job so `CreateProcess` descendants can be enumerated and
# killed as a tree. See `backend::process_tracker`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    # Win32_System_Registry dropped: its only caller (the PagingFiles
    # registry read) moved to agentmux-common/src/pagefile.rs, which
    # declares its own windows-sys dependency with that feature —
    # SPEC_RAM_PAGEFILE_PRESSURE_SPLIT_2026_08_07 §4.
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
libc = "0.2"
# Phase E.7 — property-based testing for reducer arm invariants.
# `default-features = false` to avoid the timeout-fork machinery
# that doesn't play nicely with our existing test runner; we only
# need the strategy combinators + `proptest!` macro.
proptest = { version = "1", default-features = false, features = ["std"] }
# `blocking` feature enabled for the integration test target only —
# `tests/integration_test.rs` spawns the srv as a subprocess and
# wants synchronous HTTP from a non-tokio test fn. Production code
# stays on the async client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
