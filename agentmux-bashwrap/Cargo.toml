[package]
name = "agentmux-bashwrap"
version.workspace = true
edition = "2021"
description = "AgentMux streaming bash wrapper + PreToolUse hook helper"
authors = ["AgentMux Corp"]
license = "Apache-2.0"

[[bin]]
name = "agentmux-bashwrap"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
which = "6"
anyhow = "1"
# RFC3339 timestamps for the `PreCompact` hook's compaction_started
# payload (`precompact.rs`). Matches the version already pinned by
# agentmux-srv/agentmux-cef.
chrono = "0.4"
# PTY-backed bash invocation — required so external commands (grep, npm,
# cargo, ...) see isatty=1 on stdout and stay line-buffered. Plain pipes
# trigger glibc's block-buffer mode (4 KB) for these programs and chunks
# arrive in a single burst at the end of the run. See
# docs/specs/SPEC_LIVE_LOG_PTY_REWORK_2026_05_16.md.
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(unix)'.dependencies]
# setsid() for declared-background invocations — see bash_wrap.rs's
# `detach_declared_background_session` and
# docs/specs/SPEC_BACKGROUND_TASK_TEARDOWN_SURVIVAL_2026_08_20.md.
libc = "0.2"
