<!doctype html>
<meta charset="utf-8">
<title>Fake forms</title>
<!-- Copyright 2026, AgentMux Corp. SPDX-License-Identifier: Apache-2.0 -->
<p>Controls for pressing Enter and Space (README.md). Every submit is caught, not sent: <code>window.__submits</code>.</p>

<form id="search"><label>Search <input id="q" name="q"></label> <button id="go">Search</button></form>
<form id="pay"><label>Card holder <input id="holder" name="holder"></label> <button>Pay now</button></form>
<form id="login"><label>User <input id="user" name="user"></label> <label>Password <input id="pw" name="pw" type="password"></label> <button>Sign in</button></form>
<form id="nobutton"><label>Lonely <input id="lonely" name="lonely"></label></form>
<form id="listening"><label>Own keys <input id="own" name="own"></label> <button>Send it</button></form>
<form id="notes"><label>Notes <textarea id="note" name="note"></textarea></label> <button>Save notes</button></form>

<p><label>Outside a form <input id="loose"></label></p>
<p><button id="plain" type="button">Plain</button> <label><input id="agree" type="checkbox"> I agree</label> <a id="lnk" href="#clicked">A link</a></p>
<p><div id="widget" role="button" tabindex="0">Custom widget</div></p>

<script>
  window.__submits = [];
  window.__clicks = [];
  for (const f of document.forms) {
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      window.__submits.push({ form: f.id, fields: Object.fromEntries(new FormData(f)) });
    });
  }
  document.getElementById("plain").addEventListener("click", () => window.__clicks.push("plain"));
  document.getElementById("widget").addEventListener("keydown", (e) => window.__clicks.push("widget:" + e.key));
  // A field that reads its own keys: what Enter means here is the page's, not the form's.
  document.getElementById("own").addEventListener("keydown", (e) => window.__clicks.push("own:" + e.key));
</script>
