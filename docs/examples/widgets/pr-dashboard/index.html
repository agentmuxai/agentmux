<!--
  PR dashboard: a sandboxed widget that reads a public repository's open pull
  requests from GitHub's API with `net.fetch`
  (docs/specs/SPEC_USER_WIDGETS_AND_WIDGET_API_2026_10_09.md §6.3).

  Its one permission, `net:https://api.github.com`, lets it reach that origin
  and nothing else. Each pane keeps its own repository in its meta. It sends
  no token, so GitHub allows 60 requests an hour from this computer.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/agentmux/widget-sdk/am-widget.css" />
    <style>
      form { display: flex; gap: 8px; margin-bottom: 12px; }
      form input { flex: 1; }
      li a { font-weight: 600; }
    </style>
  </head>
  <body>
    <form id="pick">
      <input id="repo" placeholder="owner/repo" spellcheck="false" />
      <button type="submit">Show</button>
    </form>
    <p id="status" class="muted">Loading…</p>
    <ul id="prs" class="list"></ul>
    <script type="module" src="app.js"></script>
  </body>
</html>
