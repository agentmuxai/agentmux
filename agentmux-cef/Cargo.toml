[package]
name = "agentmux-cef"
version = "0.33.869"
description = "AgentMux Host — Desktop app with bundled Chromium"
authors = ["AgentMux Corp"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "agentmux-cef"
path = "src/main.rs"

[features]
default = []
# Enable sandbox mode (requires bootstrap.exe on Windows)
sandbox = ["cef/sandbox"]
# Opt-in for dev_authfile unit tests that touch the filesystem and Win32 ACL APIs
test-authfile = []

[package.metadata.cef.bundle]
# No helper needed without sandbox
resources_path = "resources"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
cef = { version = "146", default-features = false, features = ["build-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
parking_lot = "0.12"
# Phase 2: IPC bridge
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }
whoami = "1"
json_comments = "0.2"
# Browser DOM API (SPEC_BROWSER_DOM_API.md): CDP WebSocket client + /json probe
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Phase B.9.1 (WRR) — SetWinEventHook / UnhookWinEvent /
    # HWINEVENTHOOK live under Accessibility (they originated as
    # MSAA hooks; later events like EVENT_OBJECT_LOCATIONCHANGE
    # piggyback on the same infrastructure).
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[dev-dependencies]
# Property tests for the shadow projection (master spec §8.14
# subscriber idempotency contract). Mirrors agentmux-launcher's
# proptest setup.
proptest = { version = "1", default-features = false, features = ["std"] }
