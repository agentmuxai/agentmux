[package]
name = "agentmux-cef"
version.workspace = true
description = "AgentMux Host — Desktop app with bundled Chromium"
authors = ["AgentMux Corp"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "agentmux-cef"
path = "src/main.rs"

[lib]
name = "agentmux_cef"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Sandbox ON by default on all platforms:
#   macOS  — Seatbelt via libcef_sandbox.dylib (Phases 1+2)
#   Linux  — kernel namespace isolation (Phases 1+2)
#   Windows — bootstrap.exe DLL wrapper pattern (Phase 3, issue #1374)
# Disable at runtime with AGENTMUX_UNSAFE_NOSANDBOX=1.
default = ["sandbox"]
sandbox = ["cef/sandbox"]
# Opt-in for dev_authfile unit tests that touch the filesystem and Win32 ACL APIs
test-authfile = []
# Enables call sites that depend on the AgentMux libcef fork
# (https://github.com/a5af/cef, branch agentmux/7680-drag-rightclick-and-transparency).
# Specifically: `_cef_window_t::begin_window_drag` (used by StartWindowDragTask).
# Requires a matching patched cef-dll-sys via [patch.crates-io] in the workspace
# Cargo.toml. Default OFF so unpatched checkouts compile — native left-click
# window drag is a no-op without the patch.
patched-libcef = []

[package.metadata.cef.bundle]
resources_path = "resources"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
cef = { version = "148", default-features = false, features = ["build-util"] }
# Native "pick a file" dialog for the Media pane (SPEC_MEDIA_PANE_2026_07_26.md).
# Default features pick the right native backend per platform (Win32
# IFileDialog / macOS NSOpenPanel / Linux GTK3).
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
parking_lot = "0.12"
# Phase 2: IPC bridge
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }
whoami = "1"
# PTY-backed CLI login flow — needed for providers that strictly require
# an interactive TTY for their OAuth subcommand (currently OpenClaw's
# `openclaw models auth login --provider <id>`). Other providers (Claude,
# Codex, Gemini, etc.) still go through the plain-pipes path inside
# run_cli_login. See SPEC_OPENCLAW_AGENT_2026_05_17.md §6.
portable-pty = "0.9"
json_comments = "0.2"
# Browser DOM API (SPEC_BROWSER_DOM_API.md): CDP WebSocket client + /json probe
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Phase B.9.1 (WRR) — SetWinEventHook / UnhookWinEvent /
    # HWINEVENTHOOK live under Accessibility (they originated as
    # MSAA hooks; later events like EVENT_OBJECT_LOCATIONCHANGE
    # piggyback on the same infrastructure).
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[target.'cfg(unix)'.dependencies]
# Used by `cancel_cli_login` to send SIGTERM to a PTY child by PID
# when `auth.cancel` fires (the portable_pty child sits inside a
# `spawn_blocking` task that doesn't unwind on outer-task abort).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# CGEventTap / CFRunLoop / CFMachPort / CGWindowList plumbing for the macOS
# tab-redock cross-window cursor-tracking hook
# (SPEC_MACOS_TAB_REDOCK_PARITY_2026_07_24 §2.5) — scoped narrowly to that
# new surface. Existing macOS AppKit call sites (ui_tasks/drag.rs,
# macos_compat.rs, ui_tasks/platform_macos.rs) stay on the established raw
# extern "C" / objc_msgSend idiom unchanged; these crates wrap the
# lower-level Core Foundation / Core Graphics C APIs specifically, where
# hand-rolled retain/release and CFDictionary/CFArray traversal is a real
# correctness risk in a long-lived background thread.
core-foundation = "0.9"
core-graphics = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# Vulkan device enumeration for the startup GPU-tier probe (hardware Vulkan →
# hardware GL → software precedence). Used only to read physical-device types;
# the host already bundles libvulkan.so.1. See app.rs `has_hardware_vulkan` and
# docs/specs/SPEC_LINUX_GPU_BACKEND_PRECEDENCE_2026_06_13.md.
ash = "0.38"
# EWMH `_NET_WM_WINDOW_OPACITY` for Track 1 uniform window alpha
# (SPEC_TRANSPARENCY_MACOS_LINUX_2026_07_01, Linux arm). Same crate the
# launcher's splash already uses.
x11rb = "0.13"

[dev-dependencies]
# Property tests for the shadow projection (master spec §8.14
# subscriber idempotency contract). Mirrors agentmux-launcher's
# proptest setup.
proptest = { version = "1", default-features = false, features = ["std"] }
# Issue #2977 WS4: the background audit log is file-backed (it must survive a
# host restart), so its tests need a real temp directory rather than a mock.
tempfile = "3"
