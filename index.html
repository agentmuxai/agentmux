<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color scheme" content="light dark" />
    <title>AgentMux</title>
    <style>
      /* Prevent color flashing during startup.
         html gets opaque bg (cleared by AppSettingsUpdater when transparency is enabled).
         body is transparent so app.scss can control it with --window-opacity. */
      html {
        background: rgb(34, 34, 34);
      }
      html, body {
        margin: 0;
        padding: 0;
        color: #f7f7f7;
      }
      #startup-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgb(34, 34, 34);
        /* Stay visible even when wave.ts hides body during Solid.js render.
           Without this the spinner disappears for ~200ms during the FOUC guard. */
        visibility: visible !important;
        opacity: 1 !important;
        z-index: 99999; /* --z-splash, Z_SPLASH: no stylesheet has loaded yet */
      }
      /* Cross-fade the splash out once the content-reveal gate decides the
         window has settled (frontend/app/init/startup-splash.ts adds .fading).
         Higher specificity than the `opacity: 1 !important` above so it wins.
         Keep the duration in sync with FADE_MS in startup-splash.ts. */
      #startup-loading.fading {
        opacity: 0 !important;
        transition: opacity 200ms ease-out;
        pointer-events: none;
      }
      #startup-loading svg {
        width: 96px;
        height: 96px;
        opacity: 0.9;
        animation: startup-pulse 1.8s ease-in-out infinite;
        /* Composite the pulse on the GPU. Without a dedicated layer Chromium
           can re-rasterize the SVG every animation frame (the old brain mark,
           1200×1200 and many gradients, did), which reads as a blink/flicker
           instead of a smooth pulse. `will-change` promotes it to its own
           layer; the keyframes keep a translateZ so the layer persists at the
           scale(1) endpoints (a 2D-only transform would drop the layer). */
        will-change: transform, opacity;
      }
      /* A pre-warmed pool window (frontend/app/init/pool.ts markPoolWaiting)
         is hidden for as long as it waits, which can be hours, but Chromium
         still counts its page as visible, so a running pulse kept the GPU
         process compositing frames for nobody: about 15% of a core with three
         pool windows, measured on Windows (Posa, 2026-10-19). Paused while it
         waits; promotion clears the attribute, so the pulse runs again the
         moment the window is shown. */
      html[data-pool-window] #startup-loading svg {
        animation-play-state: paused;
      }
      @keyframes startup-pulse {
        0%, 100% { opacity: 0.9; transform: scale(1) translateZ(0); }
        50%       { opacity: 0.65; transform: scale(0.97) translateZ(0); }
      }
      /* SPEC_PILLAR1_STEP4 Phase 4 — hidden by default; the inline script
         below shows it only when the host appended ?restoring=1 (a
         reprojected window, not a cold-start one). Cheap, frontend-only —
         same `?restoring=1`-driven-headline design as the launcher's
         native pre-splash (Phase 4's other half, crates/launcher/src/splash.rs). */
      #startup-loading-headline {
        display: none;
        font-size: 14px;
        color: #b8b8c0;
        letter-spacing: 0.02em;
      }
    </style>
    <link rel="stylesheet" href="/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/brands.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/regular.min.css" />
    <link rel="stylesheet" href="/fontawesome/css/pro-icon-aliases.css" />
    <link rel="stylesheet" href="/fontawesome/css/custom-icons.min.css" />
    <!-- Classic and synchronous, so it runs before first paint; a file of its own so a page that refuses inline script (the headless web UI) still runs it. -->
    <script src="/early-boot.js"></script>
    <script type="module" src="frontend/bootstrap.ts"></script>
  </head>
  <body class="init" data-colorscheme="dark">
    <div id="startup-loading"><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 512 512" shape-rendering="crispEdges"><rect x="64" y="64" width="384" height="64" fill="#6b82de"/><rect x="64" y="192" width="160" height="256" fill="#6b82de"/><rect x="288" y="192" width="160" height="96" fill="#6b82de"/><rect x="288" y="352" width="160" height="96" fill="#6b82de"/></svg><div id="startup-loading-headline">Restoring session&hellip;</div></div>
    <div id="main"></div>
  </body>
</html>
