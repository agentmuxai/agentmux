name: Install script check

# scripts/install/install.sh is what `curl -fsSL https://agentmux.ai/install.sh | sh` runs, and each release ships it as an asset
# under the signed manifest. This runs its tests (dry runs for each platform, the refusals, and the download checks against a
# release signed here with a throwaway key), dry runs through a pipe as users run it, and a real download of the latest release
# checked against its signed manifest with --require-signature. scripts/install/install.ps1 (Windows) has the same three kinds of check,
# run on a Windows runner. It runs on pull requests that touch the scripts or the pinned key.
# docs/specs/SPEC_ONE_COMMAND_INSTALL_ALL_PLATFORMS_2026_11_01.md

on:
  pull_request:
    paths:
      - 'scripts/install/**'
      - 'crates/common/update-keys.json'
      - '.github/workflows/install-script-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-script:
    name: install.sh tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: bash scripts/install/install.test.sh
      - name: Dry runs through a pipe, as users run it
        run: |
          cat scripts/install/install.sh | AGENTMUX_INSTALL_ROOT=/nonexistent sh -s -- --dry-run --no-launch
          cat scripts/install/install.sh | AGENTMUX_INSTALL_ROOT=/nonexistent AGENTMUX_INSTALL_PM=none sh -s -- --dry-run --method download
      - name: Real download of the latest release, checked against its signed manifest
        run: |
          AGENTMUX_INSTALL_ROOT=/nonexistent AGENTMUX_INSTALL_PM=none HOME="$RUNNER_TEMP/h" sh scripts/install/install.sh --method download --no-launch --require-signature
          test -x "$RUNNER_TEMP/h/.local/share/agentmux/AgentMux/agentmux.sh"

  install-ps1:
    name: install.ps1 tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tests (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          # OpenSSL comes with Git for Windows; appended, so that Windows' own tools stay first on the path.
          $env:PATH += ";C:\Program Files\Git\mingw64\bin"
          pwsh -NoProfile -File scripts/install/install.test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Dry runs through a pipe, as users run it
        shell: pwsh
        run: |
          $env:AGENTMUX_INSTALL_INSTALLED = "none"
          $env:AGENTMUX_INSTALL_WINGET = "none"
          & ([scriptblock]::Create((Get-Content scripts/install/install.ps1 -Raw))) -DryRun -NoLaunch -Version 0.60.14
          powershell -NoProfile -Command "& ([scriptblock]::Create((Get-Content scripts/install/install.ps1 -Raw))) -DryRun -NoLaunch -Version 0.60.14"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Real download of the latest release, checked against its signed manifest (the installer is not run)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files\Git\mingw64\bin"
          $env:AGENTMUX_INSTALL_INSTALLED = "none"
          $env:AGENTMUX_INSTALL_WINGET = "none"
          $env:AGENTMUX_INSTALL_NO_RUN_SETUP = "1"
          pwsh -NoProfile -File scripts/install/install.ps1 -Method download -NoLaunch -RequireSignature
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # And the way users run it: through a pipe, with no options
          Get-Content scripts/install/install.ps1 -Raw | Invoke-Expression
