name: tmp vite-port runner proof (removed before merge)
on:
  pull_request:
    paths:
      - .github/workflows/tmp-vite-port-proof.yml
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which runner, which mkdir
        run: |
          grep PRETTY_NAME /etc/os-release
          mkdir --version | head -1
          ls -l "$(command -v mkdir)"
          nproc
      - name: mkdir under contention (12 callers on one path, 200 rounds)
        run: |
          d=$(mktemp -d); multi=0
          for r in $(seq 1 200); do
            rm -rf "$d/x" "$d"/w.*
            for i in $(seq 1 12); do ( mkdir "$d/x" 2>/dev/null && echo win >> "$d/w.$r" ) & done
            wait
            n=$(cat "$d/w.$r" 2>/dev/null | wc -l)
            [ "$n" -gt 1 ] && multi=$((multi+1))
          done
          echo "rounds where more than one mkdir won: $multi of 200"
      - name: 12 simultaneous picks, before (origin/main script) and after (this branch), 100 rounds each
        run: |
          base=$(git merge-base origin/main HEAD)
          mkdir -p /tmp/old && git show "$base:scripts/vite-port.sh" > /tmp/old/vite-port.sh
          round() { # <script>
            C=$(mktemp -d); P=$(mktemp -d)
            for i in $(seq 1 12); do AGENTMUX_DEV_PORT_CLAIMS="$C" AGENTMUX_DEV_PORT_OWNER="clone$i" bash "$1" pick 5400 > "$P/$i" 2>/dev/null & done
            wait
            n=$(cat "$P"/* | sort -u | wc -l); e=$(find "$P" -empty | wc -l)
            rm -rf "$C" "$P"
            echo "$n $e"
          }
          for which in old new; do
            s=/tmp/old/vite-port.sh; [ $which = new ] && s=scripts/vite-port.sh
            bad=0; empties=0; hist=""
            for r in $(seq 1 100); do
              set -- $(round "$s"); [ "$1" != 12 ] && { bad=$((bad+1)); hist="$hist $1"; }; empties=$((empties+$2))
            done
            echo "$which script: $bad of 100 rounds gave fewer than 12 different ports (counts:$hist); empty outputs: $empties"
          done
      - name: The real test file, before and after
        run: |
          base=$(git merge-base origin/main HEAD)
          mkdir -p /tmp/oldtest && git show "$base:scripts/vite-port.sh" > /tmp/oldtest/vite-port.sh && git show "$base:scripts/vite-port.test.sh" > /tmp/oldtest/vite-port.test.sh && cp scripts/dev-vite-wait.sh /tmp/oldtest/
          for n in 1 2 3 4 5; do echo "old script + old test, run $n: $(bash /tmp/oldtest/vite-port.test.sh 2>&1 | tail -2 | tr '\n' ' ')"; done
          for n in 1 2 3 4 5; do echo "new script + new test, run $n: $(bash scripts/vite-port.test.sh 2>&1 | tail -2 | tr '\n' ' ')"; done
