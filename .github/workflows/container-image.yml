name: Container Agent Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      claude_version:
        # Keep in sync with the Claude pin in agentmux-srv/src/backend/providers.rs,
        # agentmux-cef/src/commands/providers.rs, and
        # frontend/app/view/agent/providers/index.ts — enforced by
        # frontend/app/view/agent/providers/pin-consistency.test.ts.
        description: 'Claude Code version to pin (empty = latest)'
        required: false
        default: '2.1.274'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agentmuxai/agent-claude

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node 24
        # Pins the Node version used to run `npm view` below — previously
        # unpinned and drifting with whatever ubuntu-latest happened to ship.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up QEMU (arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Was A5AF_PACKAGES_TOKEN, which is the shared a5af admin PAT (21
          # scopes, no expiry, includes delete_repo). Pushing this repo's own
          # image to its own org's registry needs none of that: the job
          # already declares `permissions: packages: write` above, so the
          # built-in GITHUB_TOKEN is sufficient and expires with the job.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # publish :latest on every version-tag push (github.ref is always
            # refs/tags/vX.Y.Z here; the previous refs/heads/main check was
            # never true in this workflow and suppressed :latest entirely)
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # workflow_dispatch does not push a semver tag so type=semver emits nothing;
            # produce a dispatch-<sha> tag so manual runs actually push an image.
            type=raw,value=dispatch-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve Claude Code version
        id: claude_ver
        # Bind the workflow_dispatch input to an env var before the shell sees it
        # to prevent shell injection — direct ${{ }} expansion happens before the
        # shell runs, so an attacker-controlled value like `"; cmd; echo "` would
        # execute arbitrary code.  Using env: isolates it as a plain variable.
        env:
          CLAUDE_VERSION_INPUT: ${{ github.event.inputs.claude_version }}
        run: |
          if [ -n "$CLAUDE_VERSION_INPUT" ] && [ "$CLAUDE_VERSION_INPUT" != "latest" ]; then
            echo "version=$CLAUDE_VERSION_INPUT" >> $GITHUB_OUTPUT
          else
            echo "version=$(npm view @anthropic-ai/claude-code version)" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Repo root, not docker/ — the mcp-builder stage in
          # Dockerfile.agent-agentmux needs the whole Cargo workspace to
          # build agentmux-mcp/agentmux-bashwrap (#2939 workstream 1). The
          # root .dockerignore keeps the actual context small (excludes
          # target/, dist/, node_modules/, .git/, docs/, etc.).
          context: .
          file: docker/Dockerfile.agent-agentmux
          push: true
          # amd64 + arm64: native performance on Apple Silicon (OrbStack/Colima/Docker Desktop)
          # without arm64 the image runs under qemu on M-series Macs.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDE_VERSION=${{ steps.claude_ver.outputs.version }}
