name: Container Agent Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      claude_version:
        description: 'Claude Code version to pin (empty = latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agentmuxai/agent-claude

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Resolve Claude Code version
        id: claude_ver
        run: |
          INPUT="${{ github.event.inputs.claude_version }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "latest" ]; then
            echo "version=$INPUT" >> $GITHUB_OUTPUT
          else
            echo "version=$(npm view @anthropic-ai/claude-code version)" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/
          file: docker/Dockerfile.agent-agentmux
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDE_VERSION=${{ steps.claude_ver.outputs.version }}
