name: Container Agent Image

# Builds the PUBLIC base image container agents run in (ghcr.io/agentmuxai/agent-base).
# It carries no provider CLI: AgentMux installs the pinned Claude Code from npm on the
# user's machine the first time an agent's container starts. Redistributing Claude
# Code in an image is not cleared, which is also why the old agent-claude package is
# no longer built here.
#
# AgentMux pulls the image without credentials, so the package must be public. A new
# GHCR package is private by default and only an organization owner can change that,
# in the GitHub UI. The last step fails, naming that step, until it is done.
#
# docs/specs/SPEC_CONTAINER_AGENTS_WORK_FOR_EVERYONE_2026_10_07.md
#
# A second job builds the developer variant (docker/Dockerfile.agent-developer) FROM the digest the first
# job pushed, as <version>-developer in the same package: a tag in an existing public package needs no new
# visibility step. docs/specs/SPEC_CONTAINER_AGENT_DEVELOPER_IMAGE_2026_10_29.md section 3.

# When it runs: as a job of release-core.yml, after the release gate, for each release;
# and by hand from main. It used to run on any pushed `v*` tag with the tag's own copy of
# this file, so a stray or forged tag published the image (and :latest). Now the tag trigger
# is gone, the file that runs is main's (release-core.yml calls it as
# `container-image.yml@main`), and its first job re-runs the release gate
# (scripts/release-gate.mjs: the commit must be the `chore: release` commit on main for that
# tag) from GitHub's own context for the run, so a workflow that calls this file directly
# with a tag of its choosing is refused too. The image is built from that commit, not from
# the tag name.
#
# What this does NOT do: stop a branch workflow from pushing to the package. GITHUB_TOKEN with
# `packages: write` reaches the package from any workflow in this repository; GHCR has no
# per-workflow or per-environment access. The package's "Manage Actions access" setting is the
# only knob (repository-wide). The gate: docs/specs/SPEC_SIGNED_UPDATE_CHECKSUMS_2026_10_25.md §4.1.

on:
  workflow_call:
    outputs:
      digest:
        description: 'The digest of the multi-arch index just pushed (sha256:<64 hex>). release-core.yml puts it in the signed manifest.'
        value: ${{ jobs.build-and-push.outputs.digest }}
      developer_digest:
        description: 'The digest of the developer image index just pushed (empty when that job did not run or failed). release-core.yml puts it in the signed manifest next to the base image.'
        value: ${{ jobs.developer-manifest.outputs.digest }}
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Also publish :latest (a release does so on its own). Run from main.'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agentmuxai/agent-base

# Read-only by default; a job that needs more says so itself (job-level permissions replace this
# block). A job added later gets nothing it did not ask for.
permissions:
  contents: read

jobs:
  # For any run on a tag: a release, or a rerun of one (gh workflow run release.yml --ref <tag>).
  # A manual run of this file is on a branch and must be main (see build-and-push). The
  # caller's event name is not used: in a called workflow it is the caller's event.
  gate:
    name: Release gate (a release commit on main)
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/release-gate.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the tag and its commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: node scripts/release-gate.mjs --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$SHA" --repo "$REPO" --github-output "$GITHUB_OUTPUT"

  build-and-push:
    # A release (the gate passed), or a manual run from main.
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit the run was created for (the gated release commit; main's tip for a
          # manual run), never the tag name.
          ref: ${{ github.sha }}

      - name: Set up QEMU (arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Was A5AF_PACKAGES_TOKEN, which is the shared a5af admin PAT (21
          # scopes, no expiry, includes delete_repo). Pushing this repo's own
          # image to its own org's registry needs none of that: the job
          # already declares `permissions: packages: write` above, so the
          # built-in GITHUB_TOKEN is sufficient and expires with the job.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ github.sha }}
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$VERSION" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION%.*}"
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
            else
              echo "${REGISTRY}/${IMAGE_NAME}:dispatch-${SHA::7}"
              if [ "$TAG_LATEST" = "true" ]; then echo "${REGISTRY}/${IMAGE_NAME}:latest"; fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          # Repo root, not docker/ — the mcp-builder stage in
          # Dockerfile.agent-agentmux needs the whole Cargo workspace to
          # build agentmux-mcp/agentmux-bashwrap (#2939 workstream 1). The
          # root .dockerignore keeps the actual context small (excludes
          # target/, dist/, node_modules/, .git/, docs/, etc.).
          context: .
          file: docker/Dockerfile.agent-agentmux
          push: true
          # amd64 + arm64: native performance on Apple Silicon (OrbStack/Colima/Docker Desktop)
          # without arm64 the image runs under qemu on M-series Macs.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version || format('dispatch-{0}', github.sha) }}

      # The digest of what was just pushed is what the signed manifest names, so it must
      # be there and be the index digest (the one reference that selects the platform).
      - name: The pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::the push did not report an image digest ('$DIGEST')"
            exit 1
          fi
          echo "pushed $REGISTRY/$IMAGE_NAME@$DIGEST"

      # Anonymous, like the daemon's own pull: no login in this step. Fails with
      # the exact UI step when the package is still private. Checks the first tag
      # this run pushed.
      - name: Anonymous pull must work (the package must be public)
        env:
          PUSHED_TAGS: ${{ steps.tags.outputs.list }}
        run: |
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
          image="$(printf '%s\n' "$PUSHED_TAGS" | head -n 1)"
          bash scripts/check-anonymous-pull.sh "$image" \
            "https://github.com/orgs/agentmuxai/packages/container/package/agent-base"

  # The developer variant: the base image plus a C toolchain, Rust, go-task, cargo-nextest, a headless
  # display and the CEF libraries. Built on the base image's own digest, so it cannot sit on a different
  # base than the one this release signs. Each architecture builds on a native runner (a Rust toolchain
  # layer under QEMU is slow) and is pushed by digest; developer-manifest then joins the two into one
  # tagged multi-arch image. Both jobs are optional: a failure leaves the release without a developer image
  # (the manifest names none) and never blocks the release or the base image.
  # A rerun of an older release builds from that release's own commit with this file from main, and a commit before
  # the developer image has no Dockerfile for it: those runs skip the two jobs below instead of failing them.
  developer-source:
    name: Developer image source
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: docker/Dockerfile.agent-developer
          sparse-checkout-cone-mode: false
      - name: Is there a developer Dockerfile at this commit
        id: check
        run: |
          if [ -f docker/Dockerfile.agent-developer ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::this commit has no docker/Dockerfile.agent-developer (it predates the developer image): no developer image is built"
          fi

  developer-image:
    name: Developer image (${{ matrix.arch }})
    needs: [gate, build-and-push, developer-source]
    if: ${{ always() && needs.build-and-push.result == 'success' && needs.developer-source.outputs.present == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository's pinned toolchain when it has one (rust-toolchain.toml), else the Dockerfile's own default.
      - name: Rust version
        id: rust
        run: |
          v=""
          if [ -f rust-toolchain.toml ]; then
            v="$(sed -n 's/^channel *= *"\([0-9][0-9.]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.agent-developer
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
            ${{ steps.rust.outputs.version != '' && format('RUST_VERSION={0}', steps.rust.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version || format('dispatch-{0}', github.sha) }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::the push did not report an image digest ('$DIGEST')"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: developer-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  developer-manifest:
    name: Developer image (multi-arch tags)
    needs: [gate, developer-source, developer-image]
    if: ${{ always() && needs.gate.result != 'cancelled' && needs.developer-source.outputs.present == 'true' && needs.developer-image.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}

    steps:
      - name: Checkout (for the anonymous-pull script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/check-anonymous-pull.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: developer-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ github.sha }}
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$VERSION" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}-developer"
              echo "${REGISTRY}/${IMAGE_NAME}:${VERSION%.*}-developer"
              echo "${REGISTRY}/${IMAGE_NAME}:developer"
            else
              echo "${REGISTRY}/${IMAGE_NAME}:dispatch-${SHA::7}-developer"
              if [ "$TAG_LATEST" = "true" ]; then echo "${REGISTRY}/${IMAGE_NAME}:developer"; fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Both architectures or nothing: one tag that is only half an image would break the other half's users.
      - name: Join the two architectures under the tags
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          if [ "$(ls | wc -l)" -ne 2 ]; then
            echo "::error::expected a digest for amd64 and for arm64, found: $(ls | tr '\n' ' ')"
            exit 1
          fi
          tag_args=()
          while IFS= read -r t; do [ -n "$t" ] && tag_args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      # The digest of the index just tagged: the one reference that selects the platform, and what the signed manifest names.
      - name: The pushed index digest
        id: index
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          first="$(printf '%s\n' "$TAGS" | head -n 1)"
          digest="$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::no index digest for $first ('$digest')"
            exit 1
          fi
          echo "pushed $REGISTRY/$IMAGE_NAME@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Anonymous pull must work (the package must be public)
        env:
          PUSHED_TAGS: ${{ steps.tags.outputs.list }}
        run: |
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
          image="$(printf '%s\n' "$PUSHED_TAGS" | head -n 1)"
          bash scripts/check-anonymous-pull.sh "$image" \
            "https://github.com/orgs/agentmuxai/packages/container/package/agent-base"
