name: No Co-Authored-By trailers

# Duplicated (not a workflow_call reference) because this repo is owned by
# `agentmuxai`, and the canonical copy lives in `a5af/shared-infrastructure`
# (a private repo under a different, non-enterprise-linked account) —
# GitHub's reusable-workflow access control has no cross-owner allowlist for
# a private repo short of making it public. See
# a5af/shared-infrastructure docs/specs/SPEC_COAUTHOR_TRAILER_SERVER_SIDE_CHECK_2026_09_20.md
# for the source of truth; keep this file in sync with that repo's
# reusable-no-coauthor-trailers.yml by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      # Shared by both steps so the self-test actually exercises the same
      # pattern the real check uses, not an independent hardcoded copy that
      # could silently drift and keep passing after PATTERN regresses.
      PATTERN: '(?m)^Co-authored-by:\s*.+<.+@.+>\s*$'
    steps:
      - name: Self-test (negative control — must run before the real check)
        run: |
          # A regex that ever regresses to matching nothing must fail loudly,
          # not report green forever.
          echo '{"commit":{"message":"fix: x\n\nCo-authored-by: Bad <bad@example.com>"}}' \
            | jq -e '.commit.message | test(env.PATTERN; "i")' >/dev/null \
            || { echo "::error::self-test failed: known-bad trailer was NOT matched"; exit 1; }
          echo '{"commit":{"message":"docs: explain why Co-authored-by trailers are rejected"}}' \
            | jq -e '.commit.message | test(env.PATTERN; "i") | not' >/dev/null \
            || { echo "::error::self-test failed: prose mention was incorrectly matched"; exit 1; }

      - name: Check commits and PR description for Co-Authored-By trailers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Without -e, a failed gh api call (rate limit, network, auth)
          # leaves the command substitution empty and the script proceeds
          # as if the PR were clean -- fail-open on an API error instead of
          # failing loudly. -e turns that into a hard job failure.
          # gh api's --jq takes a single expression string, not jq's own
          # --arg — the pattern is passed via env instead and read with
          # jq's env.PATTERN, not shell-interpolated into the expression.
          commit_violations=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | select(.commit.message | test(env.PATTERN; "i")) | .sha')

          body_violation=$(gh api "repos/$REPO/pulls/$PR" \
            --jq 'select(.body != null) | select(.body | test(env.PATTERN; "i")) | "PR body"')

          if [ -n "$commit_violations" ] || [ -n "$body_violation" ]; then
            echo "::error::Co-Authored-By trailer found."
            [ -n "$commit_violations" ] && echo "Commits: $commit_violations — amend/rebase and force-push."
            [ -n "$body_violation" ] && echo "PR description contains a trailer — edit the PR body to remove it."
            exit 1
          fi
