name: Release

# The trigger for a release; the release itself is release-core.yml.
#
# Pushing a semver tag (v0.50.0) runs this file, and so does a workflow_dispatch
# for an emergency rerun. This file is the tag's own copy, so it can say anything
# on a tag someone made: that is why it holds no logic. It calls
# release-core.yml on MAIN, and the signing role trusts only a job of that file at
# refs/heads/main. Whoever makes a tag, the core refuses (before building or asking
# for a signature) any commit that is not a `chore: release vX.Y.Z` commit on main
# for that tag. See release-core.yml for the gate and the signing.
#
# The core reads the tag and commit from GitHub's own context for the run, not from
# an input: an emergency rerun is `gh workflow run release.yml --ref <tag>` (the
# run's ref must be the tag; the `tag` input is kept so that an old command line
# still works, and is not used). A tag older than this change has its own old
# release.yml and cannot sign; a new release replaces it.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Not used (kept for old command lines). Run this workflow from the tag to rebuild: gh workflow run release.yml --ref <tag>'
        required: false

# Read-only by default; a job that needs more says so itself (job-level permissions replace this
# block). A job added later gets nothing it did not ask for.
permissions:
  contents: read

jobs:
  release:
    name: Release
    # The core's jobs get at most what is granted here: contents for the builds
    # and the publish, id-token for the signing job, packages for the container image.
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: agentmuxai/agentmux/.github/workflows/release-core.yml@main
    secrets: inherit
