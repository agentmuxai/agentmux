name: Release

# Triggered by pushing a semver tag (v0.50.0) or via workflow_dispatch for
# emergency reruns. Verifies version consistency, builds all three platform
# artifacts, publishes a GitHub Release (the single source of truth for
# distribution), and triggers the landing page deploy. Asset mirroring to
# agentmux.ai is done by the landing page itself (fetch-release.mjs) — this
# workflow never touches S3/AWS.
#
# WinGet/Microsoft Store submission jobs are disabled (see "Phase 4" below,
# commented out, 2026-08-12) — MS Store is uploaded manually. WinGet's
# automated job never actually worked: `wingetcreate update` requires an
# existing manifest in microsoft/winget-pkgs, which was never bootstrapped
# via a first-time `wingetcreate new` submission, so every release back
# through at least v0.54.14 failed this job identically
# ("repos/microsoft/winget-pkgs/.../AgentMux was not found"). Re-enable once
# a manifest actually exists there (or bootstrap one and switch back to
# `update`).
#
# See docs/specs/SPEC_UNIFIED_RELEASE_CICD_2026_06_29.md and the correction
# docs/specs/SPEC_RELEASE_CICD_CORRECTION_2026_06_30.md for the full design.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.50.0) — must already exist'
        required: true

jobs:
  # ── Phase 1: Version consistency guard ───────────────────────────────────
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      # Guards the CEF pinning fix below, per codex's review of that change
      # (PR #3087): a workflow_dispatch run's OWN DEFINITION — including the
      # cef-runtime-tag literals a few jobs down — is read from whatever ref
      # GitHub resolved this run FROM (github.ref_name), which for a manual
      # dispatch is normally main, the default branch. `inputs.tag` only
      # controls what SOURCE gets checked out inside each job (the `ref:`
      # lines below and in build-windows/linux/macos.yml) — it does NOT
      # change which copy of this workflow file runs. So an emergency
      # workflow_dispatch rebuild of an OLD tag, launched from main, would
      # silently rebuild that release's SOURCE with WHATEVER CEF pins are
      # on main today — reintroducing the exact "same tag, different
      # Chromium runtime depending on when you happened to run it" gap the
      # pinning fix exists to close, just moved from "any time" to "any time
      # you forget to dispatch from the right ref."
      #
      # Fails loudly instead: workflow_dispatch must be launched FROM the
      # tag being rebuilt (`gh workflow run release.yml --ref <tag> -f
      # tag=<tag>`), so this run's own release.yml — and its CEF pins — are
      # read from that tag's own commit, matching what it originally shipped
      # with. The push-tag trigger is unaffected: github.ref_name already
      # equals the pushed tag there, so this condition is trivially satisfied
      # and no inputs.tag exists to compare against.
      - name: Guard — workflow_dispatch must run from the tag being rebuilt
        if: github.event_name == 'workflow_dispatch'
        env:
          # codex P2 (round 2): git ref/tag names permit backticks, $(), quotes
          # and ; — git-check-ref-format does NOT exclude shell metacharacters,
          # only things like spaces and control chars — so github.ref_name is
          # NOT safe to treat as inert just because it's "GitHub-controlled."
          # Raw ${{ }} interpolation is substituted into this YAML string
          # BEFORE bash ever parses it, so an attacker-crafted ref name could
          # inject arbitrary shell commands here, running with this job's own
          # permissions. Both values go through env: now — REF_NAME added
          # alongside the TAG hardening from round 1 — and are referenced only
          # as quoted shell variables from here on.
          TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "$TAG" ]; then
            echo "::error::This run's own workflow definition (including the CEF runtime pins a few jobs down) comes from '$REF_NAME' — the ref you dispatched from — not from the 'tag' input ('$TAG'). Rebuilding an old release from any ref other than that release's own tag risks shipping it with today's (possibly newer) CEF pins instead of what it originally shipped with. Re-run with: gh workflow run release.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check version consistency
        id: check
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/".*//')
          VH_VER=$(grep -m1 '^## ' VERSION_HISTORY.md | awk '{print $2}')
          # Cargo.lock: workspace member version (e.g. agentmux-cef)
          LOCK_VER=$(awk '/^name = "agentmux-cef"/{found=1} found && /^version =/{gsub(/[" ]*/,"",$NF); print $NF; exit}' Cargo.lock)
          # package-lock.json: root "version" field
          PKGLOCK_VER=$(node -p "require('./package-lock.json').version")
          echo "tag=$VER  pkg=$PKG_VER  cargo=$CARGO_VER  vh=$VH_VER  lock=$LOCK_VER  pkglock=$PKGLOCK_VER"
          MISMATCH=0
          for v in "$PKG_VER" "$CARGO_VER" "$VH_VER" "$LOCK_VER" "$PKGLOCK_VER"; do
            if [ "$v" != "$VER" ]; then MISMATCH=1; fi
          done
          if [ "$MISMATCH" = "1" ]; then
            echo "❌ Version mismatch — all five locations must agree before release"
            echo "   tag=$VER  package.json=$PKG_VER  Cargo.toml=$CARGO_VER  VERSION_HISTORY=$VH_VER  Cargo.lock=$LOCK_VER  package-lock.json=$PKGLOCK_VER"
            exit 1
          fi
          echo "✓ Version $VER consistent across all locations"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  # ── Phase 1b: Single source of truth for the three pinned CEF runtime tags ──
  # PR #3086 pinned each build-*.yml call's cef-runtime-tag to a literal
  # string, fixing release-to-release reproducibility: a blank tag used to
  # resolve to "latest published release for that platform" at build time, so
  # two builds of the identical commit — or the same tagged release rebuilt
  # later — could silently ship different Chromium versions. That fix has one
  # gap: the three pins lived in three separate places (one per build-* call
  # below), so a human bumping one platform's pin (e.g. Windows to CEF 152)
  # and forgetting the other two reproduces the exact failure #3086 exists to
  # prevent — via a stale manual edit instead of a live "latest" race. Nothing
  # caught that.
  #
  # This job is now the ONE place the three pins are declared — build-windows/
  # linux/macos below reference its outputs, not a literal string of their
  # own — and it fails the release if they don't agree on Chromium MILESTONE
  # before any build starts. Milestone, not full version equality: the three
  # platforms don't even share a version-string format. Confirmed against the
  # tags PR #3086 pinned: windows=148.0.7778.180, linux=148.0.7778.180-codecs
  # (both Chromium's own major.minor.branch.patch), macos=148.23.23-codecs (an
  # unrelated local build-counter scheme — 148.23.23 is not a Chromium build
  # number). All three do keep the milestone as the leading dot-separated
  # segment regardless of scheme, so that's the one component a comparison
  # can mean something for.
  #
  # No GitHub API calls, no secrets: this only parses the three literal
  # strings declared right here, so it's a fast, offline, always-reproducible
  # check — not a live "resolve latest" query, which would silently undo
  # #3086's reproducibility fix.
  #
  # To bump a pin: update the matching value below (this is now the only
  # place to do it) in the same PR as the consumer-side CEF upgrade change,
  # exactly as #3086's original guidance said — just centralized to one site
  # instead of three, so there's no longer a second and third place to forget.
  cef-runtime-pins:
    name: CEF runtime tags (single source of truth + milestone check)
    needs: check-macos
    runs-on: ubuntu-latest
    outputs:
      windows-tag: ${{ steps.pins.outputs.windows-tag }}
      linux-tag: ${{ steps.pins.outputs.linux-tag }}
      macos-tag: ${{ steps.pins.outputs.macos-tag }}
    steps:
      - name: Declare pins and check milestone agreement
        id: pins
        env:
          MACOS_AVAILABLE: ${{ needs.check-macos.outputs.available }}
        run: |
          WIN_TAG="cef-windows-x86_64-148.0.7778.180"
          LINUX_TAG="cef-linux-x86_64-148.0.7778.180-codecs"
          MACOS_TAG="cef-macos-arm64-148.23.23-codecs"

          # Chromium milestone = the leading dot-separated numeric segment
          # after the cef-<platform>-<arch>- prefix. Works across both
          # version schemes above because both keep the milestone number
          # first — it's the one component the three schemes agree on the
          # meaning of.
          milestone() {
            echo "$1" | sed -E 's/^cef-[a-z0-9_]+-[a-z0-9_]+-//' | cut -d. -f1
          }
          WIN_MS=$(milestone "$WIN_TAG")
          LINUX_MS=$(milestone "$LINUX_TAG")
          MACOS_MS=$(milestone "$MACOS_TAG")
          echo "Pinned CEF runtime tags: windows=$WIN_TAG (m$WIN_MS) linux=$LINUX_TAG (m$LINUX_MS) macos=$MACOS_TAG (m$MACOS_MS) macos-available=$MACOS_AVAILABLE"

          # Cross-check windows/linux unconditionally — both always build.
          # Only cross-check macos when it's actually going to build
          # (APPLE_CEF_AVAILABLE set): a stale macOS pin that build-macos's
          # own `if:` is going to skip anyway ships nothing this run, so
          # hard-failing on it would block an otherwise-fine Windows/Linux
          # release for a mismatch with no real consequence. Deferring the
          # check to whenever macOS is actually available means it still
          # fires the moment the stale pin WOULD matter.
          MISMATCH=""
          if [ "$WIN_MS" != "$LINUX_MS" ]; then
            MISMATCH="windows ($WIN_TAG, m$WIN_MS) vs linux ($LINUX_TAG, m$LINUX_MS)"
          elif [ "$MACOS_AVAILABLE" = "true" ] && [ "$WIN_MS" != "$MACOS_MS" ]; then
            MISMATCH="windows/linux (m$WIN_MS) vs macos ($MACOS_TAG, m$MACOS_MS)"
          fi
          if [ -n "$MISMATCH" ]; then
            echo "ERROR: CEF Chromium milestone mismatch across the pinned tags — refusing to build a release from mismatched runtimes."
            echo "  $MISMATCH"
            echo "  One platform's pin was bumped without the others — update all three together, in the same PR."
            exit 1
          fi

          echo "windows-tag=$WIN_TAG" >> "$GITHUB_OUTPUT"
          echo "linux-tag=$LINUX_TAG" >> "$GITHUB_OUTPUT"
          echo "macos-tag=$MACOS_TAG" >> "$GITHUB_OUTPUT"

  # ── Phase 2: Build all platforms (parallel) ───────────────────────────────
  # Reuses build-windows.yml's own job instead of inlining a second copy of
  # the CEF-provisioning + packaging steps — same pattern as build-linux/
  # build-macos below. release-tag is left blank: the release doesn't exist
  # yet at this point in the pipeline (publish creates it after all three
  # platforms finish) — the reused workflow's own actions/upload-artifact
  # steps (windows-portable/windows-installer/windows-msix) are what
  # `publish` downloads below, exactly as when this was inlined.
  # See docs/specs/SPEC_CEF_PROPRIETARY_CODECS_ALL_PLATFORMS_2026_07_26.md.
  #
  # cef-runtime-tag comes from cef-runtime-pins above, the one place all
  # three platforms' pins are declared and cross-checked — see that job's
  # comment for the full history (PR #3086 pinned per-build-job literals
  # fixing reproducibility; this closes the gap that left open: nothing
  # caught one platform's pin drifting from the other two).
  build-windows:
    name: Build — Windows portable + installer + MSIX
    needs: [verify, cef-runtime-pins]
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      release-tag: ""
      cef-runtime-tag: ${{ needs.cef-runtime-pins.outputs.windows-tag }}
    secrets: inherit

  # Reuses build-linux.yml's own job instead of inlining a second copy of the
  # CEF-provisioning steps (previously ~100 lines duplicated verbatim — see
  # docs/analysis/ANALYSIS_CI_WORKFLOW_CATALOG_2026_07_18.md §2.2). release-tag
  # is left blank: the release doesn't exist yet at this point in the pipeline
  # (publish creates it after all three platforms finish) — the reused
  # workflow's own `actions/upload-artifact` step (name: linux-appimage) is
  # what `publish` downloads below, exactly as when this was inlined.
  build-linux:
    name: Build — Linux AppImage
    needs: [verify, cef-runtime-pins]
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      release-tag: ""
      cef-runtime-tag: ${{ needs.cef-runtime-pins.outputs.linux-tag }}
    secrets: inherit

  # check-macos probes the APPLE_CEF_AVAILABLE secret and exposes it as a job
  # output, because the `secrets` context is not available in job-level `if`
  # expressions (only github, needs, vars, inputs, and status functions are).
  check-macos:
    name: Check macOS build availability
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          APPLE_CEF_AVAILABLE: ${{ secrets.APPLE_CEF_AVAILABLE }}
        run: |
          if [ -n "$APPLE_CEF_AVAILABLE" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

  # Reuses build-macos.yml's own job instead of inlining a second copy of the
  # CEF-provisioning + signing/notarization steps (previously ~135 lines
  # duplicated verbatim — see docs/analysis/ANALYSIS_CI_WORKFLOW_CATALOG_2026_07_18.md
  # §2.2). release-tag is left blank: the release doesn't exist yet at this
  # point (publish creates it after all three platforms finish) — the reused
  # workflow's own `actions/upload-artifact` step (name: macos-dmg) is what
  # `publish` downloads below, exactly as when this was inlined.
  build-macos:
    name: Build — macOS arm64 DMG
    needs: [verify, check-macos, cef-runtime-pins]
    if: needs.check-macos.outputs.available == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      release-tag: ""
      cef-runtime-tag: ${{ needs.cef-runtime-pins.outputs.macos-tag }}
    secrets: inherit

  # ── Phase 3: Publish GitHub Release ───────────────────────────────────────
  # GitHub Releases is the single source of truth for distribution. The landing
  # page (agentmux-landing/scripts/fetch-release.mjs) reads this release, mirrors
  # the assets into its OWN bucket (agentmux-landing-prod), and serves them from
  # agentmux.ai — so this job must NOT touch S3 or AWS. Its only handoff is the
  # GitHub Release plus a repository_dispatch to redeploy the landing page.
  #
  # `if: !failure() && !cancelled()` rather than plain `success()` is
  # deliberate: build-macos is legitimately SKIPPED (not failed) whenever
  # APPLE_CEF_AVAILABLE isn't set, and `success()` would treat that skip as
  # not-a-success and block publish even though a Windows/Linux-only release
  # is fine. `failure()`/`cancelled()` only inspect jobs THIS job directly
  # `needs` — they do not look at the whole transitive graph (GitHub Actions'
  # documented behaviour: an `if:` that references one of these functions
  # gets no implicit "all needs succeeded" check at all, unlike a plain
  # output-only `if:` such as build-macos's own) — so cef-runtime-pins MUST
  # be listed here explicitly, or its failure (a milestone mismatch) would
  # cascade to skip every build job (invisible to failure()) while publish's
  # condition stayed true, ran anyway, downloaded zero artifacts, and failed
  # confusingly later instead of being cleanly blocked at the real point of
  # failure.
  publish:
    name: Publish release
    needs: [verify, check-macos, cef-runtime-pins, build-windows, build-linux, build-macos]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p dist-flat
          find release-artifacts -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.msix" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} dist-flat/ \;
          echo "--- Release artifacts ---"
          ls -lh dist-flat/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # extract-changelog.sh exits non-zero on a missing entry, so an
          # empty-NOTES fallback here is dead code — the step would already
          # have failed under set -e before reaching it.
          NOTES=$(bash scripts/extract-changelog.sh "$VERSION")
          # Write to file to safely pass multiline content to gh release create
          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes:"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "AgentMux v${VERSION}" \
              --notes-file /tmp/release-notes.md \
              dist-flat/*
          else
            echo "Release v${VERSION} already exists -- uploading/overwriting artifacts only"
            gh release upload "v${VERSION}" dist-flat/* --clobber
          fi

      - name: Trigger landing page deploy
        env:
          GH_TOKEN: ${{ secrets.LANDING_DEPLOY_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/agentmuxai/agentmux-landing/dispatches \
            -f event_type=release \
            -F client_payload[version]="${VERSION}"

