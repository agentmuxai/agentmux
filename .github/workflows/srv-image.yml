name: Headless srv image

# Builds docker/Dockerfile.srv and smoke-tests the container
# (docs/specs/SPEC_SRV_HEADLESS_MODE_2026_09_26.md, slice 2). Build only; no
# image is published.
#
# Not a required check, so workflow-level `paths:` is fine here (ci-pr.yml bans
# it only for required workflows, which would sit Pending forever). It runs when
# anything the image is built from changes: the crates it compiles (and
# agentmux-common, which they share), the workspace manifests, lockfile and Cargo
# config, the repo-root files srv embeds, and the Docker inputs. Plus on demand.

on:
  pull_request:
    paths:
      - 'docker/Dockerfile.srv'
      - '.dockerignore'
      - '.github/workflows/srv-image.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '*/Cargo.toml'
      - 'crates/srv/**'
      - 'crates/common/**'
      - 'crates/remote/**'
      - 'crates/procstats/**'
      - 'crates/mcp/**'
      - 'crates/bashwrap/**'
      - 'schema/**'
      - 'settings-template.jsonc'
      - 'templates/jobs/**'
      - 'sdk/widget-sdk/**'
      - 'scripts/build-slot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release PR touches Cargo.toml and Cargo.lock, which the paths above
  # match, but only moves the version: nothing the image is built from. The
  # same classifier ci-pr.yml uses proves that from the diff (R7 in
  # scripts/ci-classify-changes.mjs) and skips the image build. Anything it
  # can't prove, including an API or classifier failure, builds.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version_only: ${{ steps.classify.outputs.version_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci-classify-changes.mjs
            scripts/lib/is-main.mjs
          sparse-checkout-cone-mode: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh's status on its own (see ci-pr.yml): a pipeline would report
          # jq's, so a failed later page could leave a partial list.
          FILES=""
          if RAW="$(gh api \
               "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
               --paginate --jq '.[] | {filename, patch}' 2>/dev/null)"; then
            FILES="$(printf '%s' "$RAW" | jq -s '.')" || FILES=""
          fi
          if printf '%s\n' "$FILES" | node scripts/ci-classify-changes.mjs >/tmp/classify.out 2>/tmp/classify.err; then
            grep '^version_only=' /tmp/classify.out >> "$GITHUB_OUTPUT"
            echo "::notice::$(cat /tmp/classify.err)"
          else
            echo "version_only=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-smoke:
    needs: changes
    # Runs unless the PR is proven version-only; on workflow_dispatch `changes`
    # is skipped, and this still runs.
    if: ${{ !cancelled() && needs.changes.outputs.version_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # linux/arm64 is cross-compiled on this x86 runner (see Dockerfile.srv) and
        # smoke-tested under QEMU, so a change that breaks the arm64 image is seen here.
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (runs the arm64 image)
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.srv
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: agentmux-srv:ci
          cache-from: type=gha,scope=srv-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=srv-${{ matrix.platform }}

      - name: Smoke test
        env:
          PLATFORM: ${{ matrix.platform }}
          # Two seconds a try: 90 s natively, 120 s under QEMU.
          TRIES: ${{ matrix.platform == 'linux/arm64' && 60 || 45 }}
        run: |
          set -euo pipefail
          docker run -d --name srv --platform "$PLATFORM" agentmux-srv:ci
          trap 'docker logs srv 2>&1 | tail -40; docker rm -f srv >/dev/null' EXIT

          # Healthy = the image's own HEALTHCHECK (GET /health on loopback) passed.
          for i in $(seq 1 "$TRIES"); do
            status=$(docker inspect -f '{{.State.Health.Status}}' srv)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' srv)" = true ] || { echo "srv exited"; exit 1; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]

          # srv reports where it wrote the generated key; the key itself is never printed.
          # Captured first: `docker logs | grep -q` would SIGPIPE docker under pipefail.
          logs=$(docker logs srv 2>&1)
          grep 'auth key written to' <<<"$logs"
          key_file=$(docker exec srv sh -c 'find "$HOME/.agentmux" -name srv-auth-key')
          echo "key file: $key_file"
          [ "$(docker exec srv stat -c %a "$key_file")" = 600 ]

          # The key is required; loopback only.
          code() { docker exec srv curl -s -o /dev/null -w '%{http_code}' "$@"; }
          key=$(docker exec srv cat "$key_file")
          [ "$(code -H "X-AuthKey: $key" http://127.0.0.1:8190/agentmux/discovery)" = 200 ]
          [ "$(code http://127.0.0.1:8190/agentmux/discovery)" = 401 ]
          # Every listening socket is 127.0.0.1 (tcp) or ::1 (tcp6). An explicit
          # `if`, since `set -e` ignores a failing `! cmd`.
          docker exec srv cat /proc/net/tcp /proc/net/tcp6 \
            | awk '$4 == "0A" {print $2}' | tee /tmp/listen
          [ -s /tmp/listen ]
          if grep -Ev '^(0100007F|00000000000000000000000001000000):' /tmp/listen; then
            echo "srv listens beyond loopback"; exit 1
          fi

          # Runs as the unprivileged user; agents' helpers are on PATH.
          [ "$(docker exec srv id -un)" = agentmux ]
          docker exec srv sh -c 'command -v agentmux-mcp && command -v agentmux-bashwrap && command -v node && command -v git'

          # SIGTERM through tini stops srv cleanly.
          docker stop -t 20 srv
          [ "$(docker inspect -f '{{.State.ExitCode}}' srv)" = 0 ]
