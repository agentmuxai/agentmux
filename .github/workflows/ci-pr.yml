name: CI (PR) — compile tests + run

# The nightly (ci-nightly-build.yml) compiles + tests all three platforms, but
# only on a `schedule` — so a broken TEST build or a stale test assertion merges
# UNNOTICED until the next 07:00 UTC run. That is how both #1823 (a Windows-only
# `cfg` break in agentmux-cef) and #1876 (JEKT `InjectionRequest` gained fields
# its `reactive/tests.rs` constructors never got, plus 3 tests left asserting the
# pre-JEKT message format) reached `main`: the release build workflows are
# manual `workflow_dispatch` and never compile `#[cfg(test)]` code, and reviewers
# (incl. reagent) read diffs — they do not compile or run the suite. Nothing ran
# on the PR.
#
# This runs a compile-and-test gate on EVERY PR, so the break is caught at
# merge time — but scoped to the CEF-free crates only (SPEC_CI_PR_NIGHTLY_
# BALANCE_2026_09_12.md), not the full workspace. Between 2026-07-01 (PR #1885
# added `cargo check --workspace --tests` + `cargo test --workspace` here) and
# 2026-09, this job's Windows leg increasingly spent its ENTIRE 20-minute
# budget just compiling agentmux-cef (the CEF C++ build via cef-dll-sys's
# build.rs) before any test even ran — direct measurement on 2026-09-15 showed
# compile alone taking ~19 of the 20 minutes. That's not the runner-pool
# flakiness INCIDENT_2026_09_10_CI_PR_WINDOWS_RUNNER_HANG_BACKLOG.md
# documents (which this job's timeout-minutes and this file's concurrency group
# already mitigate) — it's this job duplicating the nightly workflow's full
# CEF-inclusive build on every PR, on a budget too small to finish it. The
# fix is the lane split the spec above lays out: PR gets fast CEF-free
# coverage, nightly (ci-nightly-build.yml, already running
# `cargo build --release --workspace` + `cargo test --workspace` daily) keeps
# the full CEF-inclusive safety net.
#
# Scope: `cargo check --tests` (+ `cargo test`) against agentmux-common,
# agentmux-srv, agentmux-launcher, agentmux-bashwrap, and agentmux-mcp —
# every workspace member EXCEPT agentmux-cef. The first four still catch a
# missing-field / cfg-gated test break the same way the old workspace-wide
# check did (#1823 was a Windows `cfg` break in agentmux-cef specifically,
# which nightly now owns catching); agentmux-bashwrap and agentmux-mcp are
# independent workspace members not pulled in transitively by the other
# three, so they need their own explicit `-p` or they'd get no PR-lane gate
# at all. Windows is the REQUIRED leg (primary platform); ubuntu is
# non-blocking (continue-on-error) until greened. Standard GitHub-hosted
# runners only (free on public repos).
#
# NOTE: adding this workflow makes the checks RUN on PRs; to ENFORCE them, add
# "check --tests + test (windows-latest)" and "vitest" as required status checks
# in branch protection. Job/check names are unchanged from before this split
# specifically so an existing branch-protection rule referencing them by name
# keeps working — renaming to something like "PR fast: ..." (SPEC_CI_PR_
# NIGHTLY_BALANCE_2026_09_12.md §6's SHOULD) would silently orphan that rule
# until someone with admin access updates it, which isn't verifiable from a
# code change alone.
#
# --test-threads=1 mirrors the nightly (process-shared in-memory FileStore + a
# focus-flag global flake under parallel runs; serial is deterministic).

on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run for the same PR/branch instead of letting it run to
# completion alongside the new one. Without this, every push to a PR spawns a
# full new run that keeps burning windows-latest/ubuntu-latest runner minutes
# even after it's obsolete — observed directly on 2026-09-11: several PRs had
# 3-4 near-duplicate runs in flight within minutes of each other from quick
# successive pushes, none cancelling the ones before it. That's wasted load
# on a runner pool this repo's CI volume already puts real pressure on (88
# ci-pr.yml runs in a 21-hour window from concurrent agents, sampled the same
# day) — cutting the wasted volume doesn't fix GitHub-hosted-runner-side
# flakiness on its own, but it reduces how often any one PR is exposed to it.
# Codex P1 on #3198: keying on github.head_ref alone is wrong — for a
# pull_request event it's just the source BRANCH NAME, with no owner/fork
# qualifier. Two unrelated PRs (different forks, or even two agents in this
# same repo) using a common branch name like "main" or "fix-typo" would
# collide on the same group, and a push to one would cancel the OTHER PR's
# required CI run — silent, cross-PR, and only noticed when someone's merge
# is unexpectedly blocked. github.event.pull_request.number is unique per
# PR regardless of branch naming; use that instead. It's only set for
# pull_request events, so this still falls through to github.ref for `push`
# (not a PR) — main pushes get their own group, keyed differently than PR
# runs, same as before.
concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: check --tests + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    # PR-lane budget (SPEC_CI_PR_NIGHTLY_BALANCE_2026_09_12.md §3.3): target
    # under 10 min, soft ceiling 15 min. This job no longer builds
    # agentmux-cef (see the workflow header comment), so the previous ~13-20
    # min CEF-inclusive baseline (docs/incident/
    # INCIDENT_2026_09_10_CI_PR_WINDOWS_RUNNER_HANG_BACKLOG.md) no longer
    # applies here — 15 min still bounds a genuine runner-pool hang (that
    # incident's root cause, separate from the CEF-scope issue this split
    # fixes) to a fraction of GitHub's 360-minute default rather than hours.
    # Revisit if representative runs land close to this ceiling.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (Linux — launcher Wayland toolkit + agentmux-mcp's xcap)
        if: matrix.os == 'ubuntu-latest'
        # The runner image ships a google-chrome apt source we do not use — none
        # of the packages below come from it. When Google serves a corrupt index
        # (`Hash Sum mismatch`, as on 2026-09-09) `apt-get update` exits 100 and
        # takes the whole Linux leg down, on every branch including main.
        #
        # Two layers, because removing the source alone was not enough: the
        # first attempt deleted `google-chrome.list` and the index was STILL
        # fetched, since ubuntu-24.04 declares it in deb822 `.sources` form. The
        # glob covers both spellings, and the `|| true` means a refresh failure
        # on any OTHER third-party source cannot block us either. This does not
        # weaken the gate: everything installed here comes from the Ubuntu
        # archive, and `apt-get install` below still fails loudly if a package
        # cannot be found.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || echo "apt-get update reported errors; continuing (install is the real gate)"
          # libwayland-dev/libxkbcommon-dev: agentmux-launcher's Linux splash
          # (smithay-client-toolkit). libdbus-1-dev/pkg-config: agentmux-mcp's
          # xcap (screen capture) needs dbus-1.pc on Linux — previously
          # satisfied as an incidental side effect of installing libgtk-3-dev
          # (a CEF-only need, dropped with this split), not because anything
          # here actually needs GTK.
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      # CEF-free crates only — see the workflow header comment for why
      # agentmux-cef is excluded. Still compiles `#[cfg(test)]` code for
      # everything it does cover, the same gate that would have caught #1876
      # (missing fields); #1823 was a Windows `cfg` break in agentmux-cef
      # itself, which nightly (ci-nightly-build.yml) now owns catching.
      - name: cargo check --tests (CEF-free crates)
        run: cargo check --tests -p agentmux-common -p agentmux-srv -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp

      # Catches stale-assertion breaks (e.g. #1876's pre-JEKT expectations)
      # in the same CEF-free scope.
      - name: cargo test (CEF-free crates)
        run: cargo test -p agentmux-common -p agentmux-srv -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp -- --test-threads=1

      # frontend/types/rpc/*.ts is generated from the Rust request/response
      # types by ts-rs. This turns the audit's "keep in sync with the
      # agentmux-srv RPC" comments into a build failure, for the commands
      # migrated to register_typed so far (the set grows as the migration
      # proceeds; the gate does not change with it).
      #
      # Lives in THIS job, not the docs job: it needs a Rust toolchain and a
      # built agentmux-srv, both of which the steps above already provide, so
      # regenerating costs almost nothing here. Safe on the Windows leg
      # because .gitattributes normalizes every text file to LF, so the
      # generated files cannot differ by line ending between platforms.
      # See scripts/check-rpc-bindings.sh.
      - name: RPC bindings are current
        run: bash scripts/check-rpc-bindings.sh

  docs:
    name: doc status + grep gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The doc gate diffs against the PR base, so it needs history rather
          # than a single-commit shallow clone.
          fetch-depth: 0

      - name: Doc Status vocabulary (changed docs only)
        run: bash scripts/check-doc-status.sh

      # Blocking, and safe to be: INDEX.md's committed form no longer carries
      # any derived count, so two spec-adding branches three-way-merge to the
      # correct union instead of to a silently-wrong file. A failure here now
      # means real drift — a spec added without regenerating — which is the
      # author's to fix and takes one command. See the history note at the top
      # of scripts/gen-docs-index.sh for why it used to fail for everyone.
      # Scoped to PRs that actually touch docs/specs (issue #3059) — an
      # unscoped assertion failed every open PR whenever main went stale,
      # including PRs with no docs in them at all. Same posture as the two
      # gates either side of it.
      - name: Specs index is current (changed specs only)
        run: bash scripts/gen-docs-index.sh --check

      - name: Spec citations resolve (changed files only)
        run: bash scripts/check-spec-citations.sh

      # The three gates below already existed as Taskfile `check:*` tasks but
      # were wired into nothing — defined, documented, and never run. Each
      # encodes a regression that already happened once (see the spec/retro in
      # each script's own header). All three pass on main today, so running them
      # costs nothing and turns three pieces of decoration into enforcement.
      - name: Menu positioning gate
        run: bash scripts/check-menu-positioning.sh

      - name: Scrollbar cursor gate
        run: bash scripts/check-scrollbar-cursor.sh

      # scripts/cef-verify.sh is the carry-set gate for the CEF fork
      # (docs/cef-build/CEF_FORK_MAINTENANCE.md §5). It runs against a CEF
      # checkout, which CI does not have -- so what runs here is its TEST SUITE,
      # against synthetic fixtures. That is the point: four bugs in the previous
      # markdown version of these checks made them incapable of failing (or, in
      # one case, made them overwrite the build output they were verifying), and
      # none were visible by reading. This is the run that would have caught all
      # four.
      - name: cef-verify self-test
        run: bash scripts/cef-verify.test.sh

      - name: Input-handler layout-read gate
        run: bash tools/lint/check-input-handler-layout-reads.sh

      # Same rationale as the three above — encodes a regression that already
      # happened (PR #3023 P0: tier-4 cloud relay read credentials from the
      # wrong store and silently never fired). Not unit-testable: test_state()
      # backs wstore/id_store/identity_store with one Store, so a runtime test
      # cannot tell them apart.
      - name: muxbus credential store gate
        run: bash scripts/check-muxbus-credential-store.sh

  frontend:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runs BEFORE vitest, and is not redundant with it: vitest transpiles
      # per-file without typechecking, so a type error compiles away and the
      # suite goes green. Two reached main this way (a `#[ts(optional)]`-shaped
      # mistake, and a test passing fields the action type does not declare —
      # ignored at runtime, so the test was still valid and still passed while
      # not compiling). Neither was catchable by any gate that existed.
      #
      # Cheap: no build, just the checker, on an install the next step needs
      # anyway.
      #
      # tsconfig.citypecheck.json, not tsconfig.json: the build config includes
      # only frontend/**, while vitest below also runs test/contract/* and
      # test/e2e/*. Checking the narrower set would have left the same hole in
      # a different directory (reagent P2 on #3166).
      #
      # IF YOU ARE HERE BECAUSE THIS STEP FAILED AND YOU BELIEVE YOU RAN IT
      # LOCALLY: check how you read the result, not just that you ran it. Both
      # errors this gate was built for got past a local run that LOOKED clean.
      #   - `npx tsc ... | head -5` / `| tail -5` hides errors outside the
      #     window you printed. tsc lists every error; a truncated view is not
      #     a verdict.
      #   - `npx tsc ... | tail -4; echo $?` reports TAIL's exit status, not
      #     tsc's. A pipeline exits with its LAST command. That reads as a
      #     confident green while the checker was failing.
      # Run it bare and read the exit code:  npx tsc --noEmit -p tsconfig.citypecheck.json; echo $?
      - name: tsc --noEmit
        run: npx tsc --noEmit -p tsconfig.citypecheck.json
      - name: vitest run
        run: npx vitest run
