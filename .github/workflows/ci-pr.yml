name: CI (PR) — compile tests + run

# The nightly (ci-nightly-build.yml) compiles + tests all three platforms, but
# only on a `schedule` — so a broken TEST build or a stale test assertion merges
# UNNOTICED until the next 07:00 UTC run. That is how both #1823 (a Windows-only
# `cfg` break in agentmux-cef) and #1876 (JEKT `InjectionRequest` gained fields
# its `reactive/tests.rs` constructors never got, plus 3 tests left asserting the
# pre-JEKT message format) reached `main`: the release build workflows are
# manual `workflow_dispatch` and never compile `#[cfg(test)]` code, and reviewers
# (incl. reagent) read diffs — they do not compile or run the suite. Nothing ran
# on the PR.
#
# This runs a compile-and-test gate on EVERY PR, so the break is caught at
# merge time — but scoped to the CEF-free crates only, not the full
# workspace. Between 2026-07-01 (PR #1885 added `cargo check --workspace
# --tests` + `cargo test --workspace` here) and 2026-09, this job's Windows
# leg increasingly spent its ENTIRE 20-minute budget just compiling
# agentmux-cef (the CEF C++ build via cef-dll-sys's build.rs) before any test
# even ran — direct measurement on 2026-09-15 (a fresh checkout of a PR
# touching only a one-line version bump, no CEF-relevant code) showed compile
# alone taking ~19 of the 20 minutes, confirmed to recur across an entire
# open PR stack unrelated to this change. That's not the runner-pool
# flakiness INCIDENT_2026_09_10_CI_PR_WINDOWS_RUNNER_HANG_BACKLOG.md
# documents (which this job's timeout-minutes and this file's concurrency
# group already mitigate) — it's this job duplicating the nightly workflow's
# full CEF-inclusive build on every PR, on a budget too small to finish it.
# The fix: PR gets fast CEF-free coverage below; nightly (ci-nightly-
# build.yml, already running `cargo build --release --workspace` + `cargo
# test --workspace` daily) keeps the full CEF-inclusive safety net — no
# coverage is lost, it just moves to the lane where a long run doesn't block
# every PR in the repo.
#
# Scope: `cargo check --tests` (+ `cargo test`) against agentmux-common,
# agentmux-srv, agentmux-launcher, agentmux-bashwrap, and agentmux-mcp —
# every workspace member EXCEPT agentmux-cef. The first four still catch a
# missing-field / cfg-gated test break the same way the old workspace-wide
# check did (#1823 was a Windows `cfg` break in agentmux-cef specifically,
# which nightly now owns catching); agentmux-bashwrap and agentmux-mcp are
# independent workspace members not pulled in transitively by the other
# three, so they need their own explicit `-p` or they'd get no PR-lane gate
# at all. Windows is the REQUIRED leg (primary platform); ubuntu is
# non-blocking (continue-on-error) until greened. Standard GitHub-hosted
# runners only (free on public repos).
#
# NOTE: adding this workflow makes the checks RUN on PRs; to ENFORCE them, add
# "check --tests + test (windows-latest)" and "vitest" as required status checks
# in branch protection. Job/check names are unchanged from before this split
# specifically so an existing branch-protection rule referencing them by name
# keeps working — renaming to identify the lane in the name (e.g. "PR fast: ...")
# would silently orphan that rule until someone with admin access updates it,
# which isn't verifiable from a code change alone.
#
# --test-threads=1 mirrors the nightly (process-shared in-memory FileStore + a
# focus-flag global flake under parallel runs; serial is deterministic).

on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run for the same PR/branch instead of letting it run to
# completion alongside the new one. Without this, every push to a PR spawns a
# full new run that keeps burning windows-latest/ubuntu-latest runner minutes
# even after it's obsolete — observed directly on 2026-09-11: several PRs had
# 3-4 near-duplicate runs in flight within minutes of each other from quick
# successive pushes, none cancelling the ones before it. That's wasted load
# on a runner pool this repo's CI volume already puts real pressure on (88
# ci-pr.yml runs in a 21-hour window from concurrent agents, sampled the same
# day) — cutting the wasted volume doesn't fix GitHub-hosted-runner-side
# flakiness on its own, but it reduces how often any one PR is exposed to it.
# Codex P1 on #3198: keying on github.head_ref alone is wrong — for a
# pull_request event it's just the source BRANCH NAME, with no owner/fork
# qualifier. Two unrelated PRs (different forks, or even two agents in this
# same repo) using a common branch name like "main" or "fix-typo" would
# collide on the same group, and a push to one would cancel the OTHER PR's
# required CI run — silent, cross-PR, and only noticed when someone's merge
# is unexpectedly blocked. github.event.pull_request.number is unique per
# PR regardless of branch naming; use that instead.
#
# github.event.pull_request.number is only set for pull_request events, so
# this falls through to the second operand for `push` (not a PR — a merge
# landing on main). That second operand used to be github.ref — WRONG, this
# file's own earlier comment here claimed "main pushes get their own group,
# keyed differently than PR runs" as if that meant per-push, but github.ref
# is the literal constant string "refs/heads/main" for every single push to
# main — every post-merge run shared ONE group, so cancel-in-progress killed
# whichever merge's post-merge run was still in flight the instant the next
# merge landed. Confirmed directly: 10 of 13 push-triggered runs cancelled
# in a 45-minute window of ordinary merge activity on 2026-09-16, none of it
# a real test failure — see
# docs/analysis/ANALYSIS_MAIN_CI_CANCELLED_RUNS_COMMIT_HISTORY_2026_09_16.md.
# github.sha is unique per push (the very commit that triggered it), giving
# push events the same per-trigger isolation pull_request events already
# have via the PR number — a second push can never land on the same SHA, so
# this loses no real cancellation behavior, only the spurious cross-merge
# kind.
concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: check --tests + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Both legs block, per SPEC_CI_CHECK_PLACEMENT_PROTOCOL_2026_09_21.md R2.
    # Ubuntu used to be `continue-on-error` — it spent ~6 min on every PR and
    # could not fail one, while Windows (14-15 min, the slowest leg) was the
    # only gate. Measured over 32 consecutive runs, Windows produced ZERO
    # failures Ubuntu did not also produce; its only distinct contribution was
    # three cancellations. Ubuntu is now the real test gate and Windows is a
    # compile-only gate (see `cargo test`'s own `if:` below).
    # PR-lane budget: target under 10 min once caches are warm, generous
    # room for a cold one. This job no longer builds agentmux-cef (see the
    # workflow header comment), so the previous ~13-20 min CEF-inclusive
    # baseline (docs/incident/INCIDENT_2026_09_10_CI_PR_WINDOWS_RUNNER_HANG_
    # BACKLOG.md) no longer applies here. Locally, a cold `target/` but WARM
    # `~/.cargo/registry` (dependencies already downloaded from earlier work
    # in this same session) measured ~4 min. The first real CI run under
    # this job (2026-09-15, genuinely cold on both — no rust-cache hit at
    # all) needed ~11 min for compile+test, then `check-rpc-bindings.sh`'s
    # own separate `cargo test -p agentmux-srv export_bindings` invocation
    # (a second relink of an already-large test binary) pushed it past 15
    # min before finishing — that redundant-relink cost wasn't part of the
    # local measurement above. 20 min leaves real headroom for a cold run
    # while still bounding a genuine runner-pool hang (this incident's root
    # cause, separate from the CEF-scope issue this split fixes) to well
    # under GitHub's 360-minute default. Subsequent runs should be much
    # faster once Swatinem/rust-cache has an actual hit to restore — revisit
    # if warm-cache runs still land close to this ceiling.
    #
    # 2026-09-18: revisited, on exactly that condition. Warm-cache runs drifted
    # from 9-15 min (morning) to 18-19 min (afternoon) and started hitting the
    # ceiling: two PRs were cancelled at exactly 20m0s and became unmergeable,
    # because a timed-out job reports `cancelled`, a required check that never
    # reports leaves branch protection unsatisfied, and nothing retries it.
    #
    # Measured across 30 runs before changing this, because the fix differs by
    # cause: the slow runs were on THREE different agents unrelated branches
    # (composer UI, env isolation, docs), so this is runner-pool variance, not
    # one PR regressing the suite. Raising the ceiling is the right response to
    # that; it would be the wrong response to a suite that is genuinely getting
    # slower, so re-measure before assuming this line is still correct.
    #
    # 35 keeps the original intent — bound a genuine runner-pool hang well
    # under GitHub s 360-minute default — while leaving ~80% headroom over the
    # slowest observed healthy run rather than 5%.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Kept byte-for-byte in sync with the identical step in
      # ci-nightly-build.yml — the nightly has had this since it was added;
      # these PR checks never did, while running the same cargo work on the
      # same runner image. Defender scanning every intermediate .o/.rlib/.pdb
      # as rustc writes it is the leading explanation for this leg taking
      # ~2.5x Ubuntu on identical steps. Placed before rust-cache restore and
      # any cargo invocation so the exclusions are live for all of them.
      - name: Exclude build paths + toolchain processes from Windows Defender
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          function Add-ExclusionSafe {
            param([scriptblock]$Body, [string]$Desc)
            try {
              & $Body
            } catch {
              Write-Warning "Defender exclusion failed ($Desc): $_"
            }
          }

          foreach ($exe in @("node.exe", "cargo.exe", "rustc.exe")) {
            $resolved = Get-Command $exe -ErrorAction SilentlyContinue
            if ($resolved) {
              Add-ExclusionSafe { Add-MpPreference -ExclusionPath $resolved.Source -ErrorAction Stop } "$exe path ($($resolved.Source))"
            } else {
              Write-Warning "Defender exclusion: could not resolve a path for $exe via Get-Command"
            }
            Add-ExclusionSafe { Add-MpPreference -ExclusionProcess $exe -ErrorAction Stop } "$exe process"
          }

          # link.exe (MSVC linker) isn't on PATH outside a Developer Command
          # Prompt, so Get-Command can't resolve it here. Exclude the whole
          # Visual Studio install root instead — this is an ephemeral,
          # single-purpose CI runner, so a broad exclusion here carries no
          # meaningful risk, unlike on a persistent/shared machine.
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "C:\Program Files\Microsoft Visual Studio" -ErrorAction Stop } "VS install root (Program Files)"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction Stop } "VS install root (Program Files x86)"
          Add-ExclusionSafe { Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction Stop } "link.exe process"

          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop } "workspace path"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction Stop } "runner temp path"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction Stop } "cargo home path"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup" -ErrorAction Stop } "rustup toolchains path"

      - name: Install build deps (Linux — launcher Wayland toolkit + agentmux-mcp's xcap)
        if: matrix.os == 'ubuntu-latest'
        # The runner image ships a google-chrome apt source we do not use — none
        # of the packages below come from it. When Google serves a corrupt index
        # (`Hash Sum mismatch`, as on 2026-09-09) `apt-get update` exits 100 and
        # takes the whole Linux leg down, on every branch including main.
        #
        # Two layers, because removing the source alone was not enough: the
        # first attempt deleted `google-chrome.list` and the index was STILL
        # fetched, since ubuntu-24.04 declares it in deb822 `.sources` form. The
        # glob covers both spellings, and the `|| true` means a refresh failure
        # on any OTHER third-party source cannot block us either. This does not
        # weaken the gate: everything installed here comes from the Ubuntu
        # archive, and `apt-get install` below still fails loudly if a package
        # cannot be found.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || echo "apt-get update reported errors; continuing (install is the real gate)"
          # libwayland-dev/libxkbcommon-dev: agentmux-launcher's Linux splash
          # (smithay-client-toolkit). libdbus-1-dev/pkg-config/libxcb1-dev:
          # agentmux-mcp's xcap (screen capture) needs dbus-1.pc AND -lxcb on
          # Linux ("rust-lld: error: unable to find library -lxcb" without
          # the latter) — previously satisfied as an incidental side effect
          # of installing libgtk-3-dev (a CEF-only need, dropped with this
          # split; GTK pulls in the X11/xcb stack transitively), not because
          # anything here actually needs GTK itself.
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libdbus-1-dev pkg-config libxcb1-dev

      - uses: Swatinem/rust-cache@v2

      # CEF-free crates only — see the workflow header comment for why
      # agentmux-cef is excluded. Still compiles `#[cfg(test)]` code for
      # everything it does cover, the same gate that would have caught #1876
      # (missing fields); #1823 was a Windows `cfg` break in agentmux-cef
      # itself, which nightly (ci-nightly-build.yml) now owns catching.
      - name: cargo check --tests (CEF-free crates)
        run: cargo check --tests -p agentmux-common -p agentmux-srv -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp

      # Catches stale-assertion breaks (e.g. #1876's pre-JEKT expectations)
      # in the same CEF-free scope.
      #
      # Ubuntu only, per SPEC_CI_CHECK_PLACEMENT_PROTOCOL_2026_09_21.md R4:
      # Windows keeps the `cargo check --tests` compile gate above (which is
      # what catches platform-conditional code failing to BUILD — cfg'd
      # branches, platform APIs, path types) but no longer executes the suite.
      # Windows test EXECUTION is what made this job 14-15 min, and the
      # nightly already runs `cargo test --workspace` on windows-latest.
      #
      # The trade, stated so it can be re-evaluated: a Windows-only RUNTIME
      # regression now lands on main and surfaces at 07:00 UTC instead of
      # pre-merge. That risk is real here — `normalize_working_dir` folds case
      # on Windows only (NTFS is case-insensitive, Linux is not), so it
      # compiles identically on both and is meaningfully exercised on one. If
      # such regressions start reaching main, restore a TARGETED Windows
      # subset (the path-sensitive crates), not this full invocation.
      - name: cargo test (CEF-free crates)
        if: matrix.os != 'windows-latest'
        run: cargo test -p agentmux-common -p agentmux-srv -p agentmux-launcher -p agentmux-bashwrap -p agentmux-mcp -- --test-threads=1

      # frontend/types/rpc/*.ts is generated from the Rust request/response
      # types by ts-rs. This turns the audit's "keep in sync with the
      # agentmux-srv RPC" comments into a build failure, for the commands
      # migrated to register_typed so far (the set grows as the migration
      # proceeds; the gate does not change with it).
      #
      # Lives in THIS job, not the docs job: it needs a Rust toolchain and a
      # built agentmux-srv, both of which the steps above already provide, so
      # regenerating costs almost nothing here.
      #
      # Ubuntu only. The output is platform-independent (.gitattributes
      # normalizes every text file to LF, so generated files cannot differ by
      # line ending between platforms), so running it on both legs duplicated
      # the work — and on Windows it was not almost-free: this script runs its
      # OWN `cargo test -p agentmux-srv export_bindings`, a second relink of an
      # already-large test binary, which this job's own timeout comment blames
      # for pushing the first cold run past 15 minutes. Now that Windows no
      # longer runs the suite, keeping this here would have reintroduced test
      # execution on the leg we just removed it from.
      # See scripts/check-rpc-bindings.sh.
      - name: RPC bindings are current
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-rpc-bindings.sh

      # Four checks the gate above CANNOT make: it verifies a generated file
      # exists per type and is current with the Rust, which a file can be while
      # still describing a wire format nobody speaks. Each of these was written
      # after the same defect got past review more than once. Pure node, no
      # extra toolchain, runs in under a second.
      # See scripts/check-rpc-codegen-hygiene.mjs.
      # Ubuntu only — pure node over generated files, platform-independent, so
      # a second run on Windows adds nothing but time.
      - name: RPC codegen hygiene
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-rpc-codegen-hygiene.mjs

  docs:
    name: doc status + grep gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The doc gate diffs against the PR base, so it needs history rather
          # than a single-commit shallow clone.
          fetch-depth: 0

      - name: Doc Status vocabulary (changed docs only)
        run: bash scripts/check-doc-status.sh

      # The ratchet half of the same rule set. check-doc-status.sh is scoped to
      # CHANGED FILES on purpose (a repo-wide gate would fail every PR on the
      # ~40% of the corpus that predates the vocabulary, and would be switched
      # off within a day -- three earlier attempts died exactly that way). That
      # stops the debt growing but applies no pressure to shrink it, which is
      # why the backlog sat flat at ~357 for a month.
      #
      # This never asks you to fix debt you did not create. It only fails a
      # change that ADDS to it. See scripts/check-docs-lifecycle.mjs.
      - name: docs lifecycle ratchet
        run: node scripts/check-docs-lifecycle.mjs

      # Blocking, and safe to be: INDEX.md's committed form no longer carries
      # any derived count, so two spec-adding branches three-way-merge to the
      # correct union instead of to a silently-wrong file. A failure here now
      # means real drift — a spec added without regenerating — which is the
      # author's to fix and takes one command. See the history note at the top
      # of scripts/gen-docs-index.sh for why it used to fail for everyone.
      # Scoped to PRs that actually touch docs/specs (issue #3059) — an
      # unscoped assertion failed every open PR whenever main went stale,
      # including PRs with no docs in them at all. Same posture as the two
      # gates either side of it.
      - name: Specs index is current (changed specs only)
        run: bash scripts/gen-docs-index.sh --check

      - name: Spec citations resolve (changed files only)
        run: bash scripts/check-spec-citations.sh

      # The repo-level CLAUDE.md was removed (#3403); its content moved to
      # README/BUILD/CONTRIBUTING and the specs. This gate stops a living doc
      # from pointing back at it. Dated records (analysis/retro/reports/status
      # and *_YYYY_MM_DD.md) are deliberately exempt — their references were
      # correct when written. Whole-tree, not changed-files: it runs in <1s.
      - name: No living doc references the removed CLAUDE.md
        run: bash scripts/check-claude-md-references.sh

      # The other half of "a broken pointer is worse than none":
      # check-spec-citations.sh catches a cited path naming docs/specs/<x>.md
      # from anywhere; this catches a Markdown link that is wrong RELATIVE to
      # the file it was written in. A link like `](specs/archive/Y.md)` in
      # docs/reports/ contains no "docs/specs/" substring, so the citation gate
      # cannot see it -- it has been dead since the top-level specs/ tree was
      # folded in (#2920). First whole-tree run: 45 broken links in 27 files.
      # Same changed-files scoping as every gate above, for the same reason.
      - name: Doc links resolve (changed files only)
        run: node scripts/check-doc-links.mjs

      # docs/README.md is the map -- it is what tells a reader where a kind of
      # doc belongs. A wrong map is worse than none, and this one has gone stale
      # twice: the 2026-08-03 audit found it stale (the note is still in the
      # file, about itself), and docs/handoff/ was deleted by a docs cleanup
      # sweep (#2407) that did not update the table, so the map advertised a
      # directory that had not existed for six weeks.
      #
      # Deliberately NOT changed-files-scoped, unlike the gates above: it reads
      # one file and its backlog was exactly two, both fixed in the commit that
      # added it -- so it can be absolute without failing anyone else's PR.
      - name: docs/ directory map is accurate
        run: node scripts/check-docs-dir-map.mjs

      # Prevention for the thing the §5.6 reverse check keeps finding after the
      # fact. Triaging 64 of its candidates by hand (#3384, #3385, #3386) found
      # one cause behind most of them: the spec shipped INSIDE its own
      # implementing PR, carrying a Status written before that PR merged.
      #
      # Fires only when this PR ADDS a doc AND source files in the same PR cite
      # that doc by name -- not merely "adds a doc and touches source", which
      # has real false positives (SPEC_DECISION_PROMPT rode in on an unrelated
      # statusbar PR and `Draft` was the honest status). Replay against the
      # historical commits is in the script's header.
      - name: A new spec implemented by its own PR does not say it is unbuilt
        run: node scripts/check-new-spec-status.mjs

      # The three gates below already existed as Taskfile `check:*` tasks but
      # were wired into nothing — defined, documented, and never run. Each
      # encodes a regression that already happened once (see the spec/retro in
      # each script's own header). All three pass on main today, so running them
      # costs nothing and turns three pieces of decoration into enforcement.
      - name: Menu positioning gate
        run: bash scripts/check-menu-positioning.sh

      - name: Scrollbar cursor gate
        run: bash scripts/check-scrollbar-cursor.sh

      # Same posture as the two gates above: encodes a regression that already
      # happened (PR #3247). Deleting the bundled woff2 alone does not hold —
      # a stack that still NAMES a ligature font resolves against a
      # system-installed copy and reintroduces the CEF 152 blank-glyph bug.
      - name: Ligature font gate
        run: bash scripts/check-ligature-fonts.sh

      # scripts/cef-verify.sh is the carry-set gate for the CEF fork
      # (docs/cef-build/CEF_FORK_MAINTENANCE.md §5). It runs against a CEF
      # checkout, which CI does not have -- so what runs here is its TEST SUITE,
      # against synthetic fixtures. That is the point: four bugs in the previous
      # markdown version of these checks made them incapable of failing (or, in
      # one case, made them overwrite the build output they were verifying), and
      # none were visible by reading. This is the run that would have caught all
      # four.
      - name: cef-verify self-test
        run: bash scripts/cef-verify.test.sh

      - name: Input-handler layout-read gate
        run: bash tools/lint/check-input-handler-layout-reads.sh

      # Same rationale as the three above — encodes a regression that already
      # happened (PR #3023 P0: tier-4 cloud relay read credentials from the
      # wrong store and silently never fired). Not unit-testable: test_state()
      # backs mstore/id_store/identity_store with one Store, so a runtime test
      # cannot tell them apart.
      - name: muxbus credential store gate
        run: bash scripts/check-muxbus-credential-store.sh

  frontend:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runs BEFORE vitest, and is not redundant with it: vitest transpiles
      # per-file without typechecking, so a type error compiles away and the
      # suite goes green. Two reached main this way (a `#[ts(optional)]`-shaped
      # mistake, and a test passing fields the action type does not declare —
      # ignored at runtime, so the test was still valid and still passed while
      # not compiling). Neither was catchable by any gate that existed.
      #
      # Cheap: no build, just the checker, on an install the next step needs
      # anyway.
      #
      # tsconfig.citypecheck.json, not tsconfig.json: the build config includes
      # only frontend/**, while vitest below also runs test/contract/* and
      # test/e2e/*. Checking the narrower set would have left the same hole in
      # a different directory (reagent P2 on #3166).
      #
      # IF YOU ARE HERE BECAUSE THIS STEP FAILED AND YOU BELIEVE YOU RAN IT
      # LOCALLY: check how you read the result, not just that you ran it. Both
      # errors this gate was built for got past a local run that LOOKED clean.
      #   - `npx tsc ... | head -5` / `| tail -5` hides errors outside the
      #     window you printed. tsc lists every error; a truncated view is not
      #     a verdict.
      #   - `npx tsc ... | tail -4; echo $?` reports TAIL's exit status, not
      #     tsc's. A pipeline exits with its LAST command. That reads as a
      #     confident green while the checker was failing.
      # Run it bare and read the exit code:  npx tsc --noEmit -p tsconfig.citypecheck.json; echo $?
      - name: tsc --noEmit
        run: npx tsc --noEmit -p tsconfig.citypecheck.json
      # Standalone, narrow config (eslint.theme-colors.config.js) --
      # deliberately NOT eslint.config.js's general ruleset, which has
      # 1200+ pre-existing violations unrelated to this and would make this
      # gate meaningless noise. Catches a real, shipped bug class: a raw
      # Tailwind palette color (text-white, bg-gray-800, hover:text-white)
      # ignores the app's [data-theme] system entirely and silently breaks
      # on whichever theme polarity the author wasn't looking at -- see
      # docs/specs/SPEC_COLOR_THEME_TOKEN_HARDENING_2026_09_21.md.
      - name: Theme-aware color lint (no hardcoded Tailwind palette colors)
        run: npm run lint:theme-colors
      - name: vitest run
        run: npx vitest run
