name: build-macos

# macOS release pipeline for AgentMux.
# Builds a signed + notarized Developer ID DMG (arm64) and uploads it to the
# corresponding GitHub release.
#
# The Apple signing secrets (Developer ID certificate and its password, the Apple ID
# and app-specific password for notarytool, the team id) are not repository secrets.
# They are one AWS secret that a role hands out only to a job of THIS file at
# refs/heads/main, for a run on main or for a gated release tag. A workflow on any
# other branch, or a tag's own copy of a workflow, cannot get them. The two checks
# below run before the code or the credentials are used:
#   - the code that gets built and signed is main's (or the gated release commit);
#   - the identity token this job holds names build-macos.yml on main.
# (release upload uses GITHUB_TOKEN with contents:write — no extra PAT needed)
#
# See docs/specs/SPEC_BUILDER_MACOS_LINUX_CI_2026_06_24.md for full design notes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentmux ref to build (tag / branch / SHA)"
        required: true
        default: main
      release-tag:
        description: "GitHub release tag to upload the DMG to (blank = skip upload)"
        required: false
        default: ""
      cef-runtime-tag:
        description: "agentmuxai/cef release tag for patched framework (blank = the pin in scripts/cef-build/cef-runtime-pins.sh)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-macos]
    # client_payload: { ref: "vX.Y.Z", release_tag: "vX.Y.Z", cef_runtime_tag: "" }
  workflow_call:
    # Lets release-core.yml invoke this as a reusable workflow instead of inlining
    # a second copy of the CEF-provisioning + signing/notarization steps.
    # `inputs.*` below is populated from the caller's `with:` block exactly
    # like workflow_dispatch — the "Resolve inputs" step needs no changes.
    inputs:
      ref:
        description: "agentmux ref to build (tag / branch / SHA)"
        required: true
        type: string
      release-tag:
        description: "GitHub release tag to upload the DMG to (blank = skip upload)"
        required: false
        type: string
        default: ""
      cef-runtime-tag:
        description: "agentmuxai/cef release tag for patched framework (blank = the pin in scripts/cef-build/cef-runtime-pins.sh)"
        required: false
        type: string
        default: ""

permissions:
  contents: write   # needed to upload release assets via GITHUB_TOKEN
  id-token: write   # the OIDC token the role for the Apple secrets accepts

jobs:
  build:
    name: macOS arm64 — sign + notarize DMG
    runs-on: macos-latest   # Apple Silicon arm64 (M-series)
    # A warm build takes 30–50 min; a cold one (no Rust cache) reached signing
    # at 73 min in v0.59.37. Fail long before GitHub's 6-hour limit, which
    # once held a release while codesign waited on a locked keychain.
    timeout-minutes: 150
    env:
      OUT: ${{ github.workspace }}/artifacts
      CEF_RUNTIME_DIR_DARWIN: ${{ github.workspace }}/cef-runtime-darwin

    steps:
      # Replaces CEF_RUNTIME_TOKEN, a long-lived PAT, with an installation
      # token that expires in an hour. Scoped to agentmuxai/cef only -- the
      # private key can mint broader tokens, but this job only reads one
      # repo's releases, so that is all it gets.
      # Proven equivalent before this swap by ci-app-token-smoke.yml (since removed).
      - name: Mint a short-lived token for agentmuxai/cef
        id: cef_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: agentmuxai
          repositories: cef

      # The inputs reach the shell through env, never interpolated into the script, and are
      # checked for shape: a dispatch input (or a repository_dispatch payload) is text anyone
      # who can dispatch controls, and this job can ask for the identity token the Apple
      # signing role accepts.
      - name: Resolve inputs
        id: in
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          P_REF: ${{ github.event.client_payload.ref }}
          P_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          P_CEF_TAG: ${{ github.event.client_payload.cef_runtime_tag }}
          I_REF: ${{ inputs.ref }}
          I_RELEASE_TAG: ${{ inputs.release-tag }}
          I_CEF_TAG: ${{ inputs.cef-runtime-tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "repository_dispatch" ]; then
            REF="$P_REF"; RELEASE_TAG="$P_RELEASE_TAG"; CEF_TAG="$P_CEF_TAG"
          else
            REF="$I_REF"; RELEASE_TAG="$I_RELEASE_TAG"; CEF_TAG="$I_CEF_TAG"
          fi
          for v in "$REF" "$RELEASE_TAG" "$CEF_TAG"; do
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._/+-]*$'; then
              echo "::error::an input has characters a ref or tag does not"; exit 1
            fi
          done
          printf 'ref=%s\nrelease_tag=%s\ncef_tag=%s\n' "$REF" "$RELEASE_TAG" "$CEF_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout agentmux source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.in.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Before any step runs code from the checkout (npm scripts, build scripts): they
      # could ask for this job's identity token and so for the Apple secrets. Only main's
      # code, or the gated release commit of a tag run, gets this far. A `workflow_dispatch`
      # or `repository_dispatch` can name any ref to build, and a tag's own workflow can
      # call this file on main with a tag of its own making: neither is main's code.
      - name: The code to be signed is main's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          STATUS="$(gh api "repos/${REPO}/compare/main...${HEAD_SHA}" --jq .status)"
          case "$STATUS" in
            identical|behind) ;;
            *) echo "::error::the commit to build ($HEAD_SHA) is not on main (compare main...sha says '$STATUS'): not signing it with the Apple certificate"; exit 1 ;;
          esac
          if [ "$REF_TYPE" = "tag" ]; then
            # A release: the same gate release-core.yml runs, from main's copy of the script, and the
            # checkout must be the tagged commit itself.
            gate="$RUNNER_TEMP/release-gate.mjs"
            gh api -H "Accept: application/vnd.github.raw+json" "repos/${REPO}/contents/scripts/release-gate.mjs?ref=main" > "$gate"
            node "$gate" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$RUN_SHA" --repo "$REPO"
            if [ "$HEAD_SHA" != "$RUN_SHA" ]; then
              echo "::error::the checkout ($HEAD_SHA) is not the tagged commit ($RUN_SHA)"; exit 1
            fi
          else
            case "$EVENT" in
              schedule|workflow_dispatch|repository_dispatch) ;;
              *) echo "::error::event '$EVENT' does not get the Apple secrets"; exit 1 ;;
            esac
            if [ "$RUN_REF" != "refs/heads/main" ]; then
              echo "::error::a run on '$RUN_REF' does not get the Apple secrets: only main and release tags do"; exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Install go-task
        run: brew install go-task

      # ── Patched CEF framework ─────────────────────────────────────────────
      # The upstream cef-dll-sys framework lacks CefWindow::BeginWindowDrag, so
      # native window drag / floating-pane resize silently no-ops on macOS. We
      # download a pre-built PATCHED framework (agentmuxai/cef release) and point
      # AGENTMUX_CEF_RUNTIME_DIR_DARWIN at it — the macOS analogue of build-linux's
      # patched-libcef.so download. The package-macos.sh patch gate then verifies
      # the framework carries BeginWindowDrag before signing.
      # See docs/specs/SPEC_PATCHED_MACOS_CEF_FRAMEWORK_RELEASE_2026_06_29.md.
      - name: Resolve patched CEF framework tag
        id: cef
        env:
          GH_TOKEN: ${{ steps.cef_token.outputs.token }}
          CEF_TAG_INPUT: ${{ steps.in.outputs.cef_tag }}
        run: |
          TAG="$CEF_TAG_INPUT"
          if [ -z "$TAG" ]; then
            # Blank = this ref's committed pin, never "latest published":
            # a nightly or a direct dispatch must not pair a newly published
            # runtime with this ref's binding
            # (SPEC_CEF_MILESTONE_UPGRADE_152_TO_154_2026_09_27.md §4). A
            # deliberate non-pinned build names its cef-runtime-tag explicitly.
            # shellcheck source=/dev/null
            source scripts/cef-build/cef-runtime-pins.sh
            TAG="$CEF_MACOS_RUNTIME_TAG"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "❌ no macOS CEF runtime tag (input blank and no pin in cef-runtime-pins.sh)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved patched CEF framework tag: $TAG"

      - name: Cache patched CEF framework
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_RUNTIME_DIR_DARWIN }}
          key: cef-runtime-darwin-${{ steps.cef.outputs.tag }}

      - name: Download patched CEF framework
        if: steps.cef-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ steps.cef_token.outputs.token }}
          CEF_TAG: ${{ steps.cef.outputs.tag }}
        run: |
          mkdir -p /tmp/cef-extract "$CEF_RUNTIME_DIR_DARWIN"
          gh release download "$CEF_TAG" \
            --repo agentmuxai/cef \
            --pattern "*.tar.gz" \
            --dir /tmp/cef-extract \
            --clobber
          tar -xzf /tmp/cef-extract/*.tar.gz -C /tmp/cef-extract
          # Find the .framework regardless of whether the tarball has a top-level dir
          FW=$(find /tmp/cef-extract -maxdepth 3 -name "Chromium Embedded Framework.framework" -type d | head -1)
          if [ -z "$FW" ]; then echo "❌ framework not found in tarball"; exit 1; fi
          # ditto preserves the Versions/Current symlink chain the CEF loader follows.
          ditto "$FW" "$CEF_RUNTIME_DIR_DARWIN/Chromium Embedded Framework.framework"
          rm -rf /tmp/cef-extract

      - name: Set AGENTMUX_CEF_RUNTIME_DIR_DARWIN
        run: echo "AGENTMUX_CEF_RUNTIME_DIR_DARWIN=$CEF_RUNTIME_DIR_DARWIN" >> "$GITHUB_ENV"

      # ── Apple Developer ID codesigning setup ──────────────────────────────
      # Creates a short-lived keychain that is torn down in the cleanup step.
      # Keeps the signing identity off the default login keychain so it
      # doesn't persist between runs.
      # The identity token names this file on main, checked here with a clear message
      # before AWS is asked (the role checks the same and refuses anything else).
      - name: The identity token names build-macos.yml on main
        shell: bash
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          CLAIMS=$(echo "$TOKEN" | jq -R 'split(".")[1] | @base64d | fromjson')
          echo "$CLAIMS" | jq '{sub, job_workflow_ref, job_workflow_sha, workflow_ref, ref, event_name}'
          WANT="${GITHUB_REPOSITORY}/.github/workflows/build-macos.yml@refs/heads/main"
          GOT=$(echo "$CLAIMS" | jq -r .job_workflow_ref)
          SUB=$(echo "$CLAIMS" | jq -r .sub)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the identity token's job_workflow_ref is '$GOT', not '$WANT'; the Apple signing role accepts only the latter. Is the caller using build-macos.yml@main?"
            exit 1
          fi
          case "$SUB" in
            "repo:${GITHUB_REPOSITORY}:ref:refs/heads/main"|"repo:${GITHUB_REPOSITORY}:ref:refs/tags/v"*) ;;
            *) echo "::error::the identity token's sub is '$SUB': the Apple signing role accepts only main and v* tags"; exit 1 ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLE_SIGNING_ROLE }}
          aws-region: us-east-1
          # Explicit: this repository's logs are public. The account id stays masked.
          mask-aws-account-id: true
          role-session-name: apple-signing-${{ github.run_id }}
          role-duration-seconds: 900

      # The secret goes to a file only the next two steps read, and is deleted in the
      # cleanup step: it is not put in the environment of the build, which runs the
      # repository's own scripts.
      - name: Fetch the Apple signing secrets
        shell: bash
        env:
          # A repository variable, like the role: where the secret lives is not published here.
          SECRET_ID: ${{ vars.APPLE_SIGNING_SECRET_ID }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/apple-signing.json"
          umask 077
          aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text > "$FILE"
          for k in certificate certificate_password apple_id app_password team_id; do
            v="$(jq -r --arg k "$k" '.[$k] // empty' "$FILE")"
            if [ -z "$v" ]; then echo "::error::the Apple signing secret has no '$k'"; exit 1; fi
            case "$v" in *$'\n'*) echo "::error::'$k' in the Apple signing secret has a line break"; exit 1 ;; esac
            echo "::add-mask::$v"
          done
          echo "APPLE_SIGNING_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate into temp keychain
        run: |
          APPLE_CERTIFICATE="$(jq -r .certificate "$APPLE_SIGNING_FILE")"
          APPLE_CERTIFICATE_PASSWORD="$(jq -r .certificate_password "$APPLE_SIGNING_FILE")"
          # Use a full absolute path so security(1) and notarytool agree on the
          # file location — passing just a name causes a -db suffix mismatch on
          # modern macOS (the file lands at ~/Library/Keychains/<name>-db but
          # notarytool --keychain looks for the literal name).
          KEYCHAIN_PATH="$RUNNER_TEMP/build-${{ github.run_id }}.keychain"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          # Auto-lock after 6 hours, the longest a job can run: a cold build
          # can take over an hour to reach signing (v0.59.37 did, and codesign
          # then waited forever for a password). It is unlocked again right
          # before signing too.
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f /tmp/cert.p12

          # Allow codesign to access the key without interactive prompts
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      # Store notarization credentials under the temp keychain so notarytool
      # can submit without interactive prompts. package-macos.sh defaults to
      # NOTARY_PROFILE=notarytool.
      - name: Store notarytool credentials
        run: |
          APPLE_ID="$(jq -r .apple_id "$APPLE_SIGNING_FILE")"
          APPLE_PASSWORD="$(jq -r .app_password "$APPLE_SIGNING_FILE")"
          APPLE_TEAM_ID="$(jq -r .team_id "$APPLE_SIGNING_FILE")"
          # --no-validate skips the live Apple credential check so a pending
          # Developer Program agreement doesn't block credential storage.
          # package-macos.sh handles a 403 from notarytool submit gracefully
          # and emits a signed-but-un-notarized DMG with a warning.
          xcrun notarytool store-credentials "notarytool" \
            --apple-id   "$APPLE_ID" \
            --password   "$APPLE_PASSWORD" \
            --team-id    "$APPLE_TEAM_ID" \
            --keychain   "$KEYCHAIN_PATH" \
            --no-validate

      # ── Remote helpers ─────────────────────────────────────────────────────
      # Every package carries agentmux-remote for all four SSH host platforms
      # (scripts/build-remote-helpers.sh, called by the packager; spec
      # SPEC_REMOTE_TERMINALS_AND_DURABLE_SESSIONS_2026_10_02.md §9.1).
      # cargo-zigbuild cross-builds all four from this runner; setup-python gives
      # a pip that installs zig without touching the system Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild (remote helpers)
        shell: bash
        run: |
          python -m pip install ziglang==0.16.0
          cargo install cargo-zigbuild --locked --version 0.23.4
          # Rosetta runs the Intel helper in check-remote-helpers.sh.
          softwareupdate --install-rosetta --agree-to-license || true

      # ── Build + sign + notarize ────────────────────────────────────────────
      # RELEASE_CHANNEL=stable is REQUIRED here as of
      # docs/specs/SPEC_MACOS_DMG_PER_BUILD_CHANNEL_2026_08_24.md: `task
      # package:macos` (no override) now bakes a per-build LOCAL channel, same
      # as Windows/Linux. Without this, every release DMG would ship isolated
      # from the user's real (stable) data dir. Matches build-linux.yml, which
      # calls its script directly with the same override for the same reason.
      - name: Build, sign, and notarize DMG (RELEASE_CHANNEL=stable)
        run: |
          mkdir -p "$OUT"
          # Unlocked again here, however long the steps before took: a locked
          # keychain makes codesign wait for a password nobody can type.
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          REQUIRE_REMOTE_HELPERS=1 RELEASE_CHANNEL=stable bash scripts/package-macos.sh "$OUT"

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls "$OUT"/AgentMux_*_arm64.dmg | head -1)
          echo "path=$DMG"             >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      # ── Upload to GitHub Actions artifacts (always) ────────────────────────
      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      # ── Upload to GitHub Release (when release-tag is set) ─────────────────
      - name: Upload DMG to GitHub Release
        if: steps.in.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.in.outputs.release_tag }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$DMG_PATH" \
            --repo agentmuxai/agentmux --clobber

      # ── Cleanup: always delete the temp keychain ───────────────────────────
      - name: Delete temp keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-signing.json"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
