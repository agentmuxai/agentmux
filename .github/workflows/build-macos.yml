name: build-macos

# macOS release pipeline for AgentMux.
# Builds a signed + notarized + stapled Developer ID DMG (arm64) and uploads it to the
# corresponding GitHub release.
#
# Five jobs, so that no job holds more than it needs and the one that holds the signing
# credentials runs no code from the commit being built:
#   gate     checks the commit to build is main's (or the gated release commit of a tag), and names
#            the exact commit; no secrets, no identity token.
#   build    compiles and assembles the UNSIGNED .app from that commit. It runs the commit's scripts
#            and its dependencies' scripts (npm, cargo), so it has no certificate, no keychain, no
#            Apple secret and cannot get any: the identity token it holds (the actions broker needs it
#            for the CEF framework and the Google client secret) names no environment, and the Apple
#            role accepts only the `apple-signing` environment.
#   sign     the only job in the `apple-signing` environment, so the only one that can assume the
#            Apple role. It takes the signing scripts from the revision of THIS file that holds its
#            identity (the token's job_workflow_sha), never from the commit that was built, and only
#            reads and signs the app: signs it inside-out, notarizes and staples the app, makes the
#            DMG from the stapled app, signs it, notarizes and staples that.
#   publish  checks the DMG as a user's Mac would (stapled, signed, accepted by Gatekeeper), then
#            uploads it. It holds contents:write and nothing else, and runs no repository code.
#
# The Apple signing secrets (Developer ID certificate and its password, the Apple ID
# and app-specific password for notarytool, the team id) are not repository secrets.
# They are one AWS secret that a role hands out only to the `sign` job of THIS file at
# refs/heads/main, in the `apple-signing` environment (which only main and release tags
# may deploy to), for a run on main or for a gated release tag. A workflow on any
# other branch, or a tag's own copy of a workflow, cannot get them.
# (release upload uses GITHUB_TOKEN with contents:write — no extra PAT needed)
#
# See docs/specs/SPEC_BUILDER_MACOS_LINUX_CI_2026_06_24.md for full design notes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentmux ref to build (tag / branch / SHA)"
        required: true
        default: main
      release-tag:
        description: "GitHub release tag to upload the DMG to (blank = skip upload)"
        required: false
        default: ""
      cef-runtime-tag:
        description: "agentmuxai/cef release tag for patched framework (blank = the pin in scripts/cef-build/cef-runtime-pins.sh)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-macos]
    # client_payload: { ref: "vX.Y.Z", release_tag: "vX.Y.Z", cef_runtime_tag: "" }
  workflow_call:
    # Lets release-core.yml invoke this as a reusable workflow instead of inlining
    # a second copy of the CEF-provisioning + signing/notarization steps.
    # `inputs.*` below is populated from the caller's `with:` block exactly
    # like workflow_dispatch — the "Resolve inputs" step needs no changes.
    inputs:
      suite-proof:
        description: "Set only by release-core.yml: 'later' (the jobs that send anything out of the run need its suite) or the result of its suite job. Blank outside release-core.yml: check 6 of the release gate is then the commit's own push run."
        required: false
        type: string
        default: ""
      ref:
        description: "agentmux ref to build (tag / branch / SHA)"
        required: true
        type: string
      release-tag:
        description: "GitHub release tag to upload the DMG to (blank = skip upload)"
        required: false
        type: string
        default: ""
      cef-runtime-tag:
        description: "agentmuxai/cef release tag for patched framework (blank = the pin in scripts/cef-build/cef-runtime-pins.sh)"
        required: false
        type: string
        default: ""

# Each job names what it needs; none inherits a grant.
permissions: {}

jobs:
  gate:
    name: The code to be signed is main's
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      release_tag: ${{ steps.in.outputs.release_tag }}
      cef_tag: ${{ steps.in.outputs.cef_tag }}
    steps:
      # The inputs reach the shell through env, never interpolated into the script, and are
      # checked for shape: a dispatch input (or a repository_dispatch payload) is text anyone
      # who can dispatch controls, and a later job can ask for the identity token the Apple
      # signing role accepts.
      - name: Resolve inputs
        id: in
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          P_REF: ${{ github.event.client_payload.ref }}
          P_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          P_CEF_TAG: ${{ github.event.client_payload.cef_runtime_tag }}
          I_REF: ${{ inputs.ref }}
          I_RELEASE_TAG: ${{ inputs.release-tag }}
          I_CEF_TAG: ${{ inputs.cef-runtime-tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "repository_dispatch" ]; then
            REF="$P_REF"; RELEASE_TAG="$P_RELEASE_TAG"; CEF_TAG="$P_CEF_TAG"
          else
            REF="$I_REF"; RELEASE_TAG="$I_RELEASE_TAG"; CEF_TAG="$I_CEF_TAG"
          fi
          for v in "$REF" "$RELEASE_TAG" "$CEF_TAG"; do
            # bash's own match covers the whole string (grep checks line by line, so a value
            # with a line break could carry extra `name=value` lines into the outputs file)
            if ! [[ "$v" =~ ^[A-Za-z0-9._/+-]*$ ]]; then
              echo "::error::an input has characters a ref or tag does not"; exit 1
            fi
          done
          printf 'ref=%s\nrelease_tag=%s\ncef_tag=%s\n' "$REF" "$RELEASE_TAG" "$CEF_TAG" >> "$GITHUB_OUTPUT"

      # Checked out only to learn which commit the ref names; nothing from it runs in this job.
      - name: Checkout the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.in.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Before any job runs code from the commit (npm scripts, build scripts) or asks the actions
      # broker for anything: that code could ask for an identity token and so for the Apple
      # secrets. Only main's code, or the gated release commit of a tag run, gets this far. A
      # `workflow_dispatch` or `repository_dispatch` can name any ref to build, and a tag's own
      # workflow can call this file on main with a tag of its own making: neither is main's code.
      - name: The code to be signed is main's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUITE_PROOF: ${{ inputs.suite-proof }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          STATUS="$(gh api "repos/${REPO}/compare/main...${HEAD_SHA}" --jq .status)"
          case "$STATUS" in
            identical|behind) ;;
            *) echo "::error::the commit to build ($HEAD_SHA) is not on main (compare main...sha says '$STATUS'): not signing it with the Apple certificate"; exit 1 ;;
          esac
          if [ "$REF_TYPE" = "tag" ]; then
            # A release: the same gate release-core.yml runs, from main's copy of the script, and the
            # checkout must be the tagged commit itself.
            tmp="$RUNNER_TEMP"
            if command -v cygpath > /dev/null 2>&1; then tmp="$(cygpath -m "$RUNNER_TEMP")"; fi
            gate="$tmp/release-gate.mjs"
            out="$tmp/release-gate.out"
            rm -f "$out"
            gh api -H "Accept: application/vnd.github.raw+json" "repos/${REPO}/contents/scripts/release-gate.mjs?ref=main" > "$gate"
            node "$gate" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$RUN_SHA" --repo "$REPO" --github-output "$out" --suite-proof "$SUITE_PROOF"
            # The script checks only when node was started with it as the main file; if that comparison is ever false
            # (a path form, a drive letter's case) node exits 0 having checked nothing. So it must say it ran.
            if ! grep -qx "sha=${RUN_SHA}" "$out" 2> /dev/null; then
              echo "::error::the release gate did not say it ran"; exit 1
            fi
            if [ "$HEAD_SHA" != "$RUN_SHA" ]; then
              echo "::error::the checkout ($HEAD_SHA) is not the tagged commit ($RUN_SHA)"; exit 1
            fi
          else
            case "$EVENT" in
              schedule|workflow_dispatch|repository_dispatch) ;;
              *) echo "::error::event '$EVENT' does not get the Apple secrets"; exit 1 ;;
            esac
            if [ "$RUN_REF" != "refs/heads/main" ]; then
              echo "::error::a run on '$RUN_REF' does not get the Apple secrets: only main and release tags do"; exit 1
            fi
          fi

      # The commit that was checked is the commit that is built: the later jobs name it, not the ref, which
      # could move between the gate and the build.
      - name: Name the commit
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: macOS arm64 — build the unsigned app
    needs: gate
    runs-on: macos-latest   # Apple Silicon arm64 (M-series)
    # The step took 93 min for v0.60.21, 103 for v0.60.22 and 133 for v0.60.23: the srv release
    # build alone is 85 to 103 min (most of it the final LTO link, which prints nothing). The limit
    # leaves room for that to grow, and still fails long before GitHub's 6-hour limit.
    timeout-minutes: 240
    permissions:
      contents: read
      # Only for the actions broker below (the CEF framework token and the Google client secret). The Apple
      # role accepts the `apple-signing` environment and no other, so this token cannot get the Apple secrets.
      id-token: write
    env:
      OUT: ${{ github.workspace }}/artifacts
      CEF_RUNTIME_DIR_DARWIN: ${{ github.workspace }}/cef-runtime-darwin

    steps:
      # Replaces CEF_RUNTIME_TOKEN, a long-lived PAT, with an installation
      # token that expires in an hour. The broker gives this job a token that can
      # only read agentmuxai/cef, and only to this workflow file as it is on main
      # (a copy on a branch or in a pull request is refused).
      - name: Ask the actions broker for a token that reads agentmuxai/cef
        id: cef_token_grant
        uses: agentmuxai/agentmux/.github/actions/actions-broker@main
        with:
          broker-url: ${{ secrets.ACTIONS_BROKER_URL }}
          entry: ci-cef-macos
          mode: grant

      - name: Read the token from the grant
        id: cef_token
        shell: bash
        env:
          GRANT_FILE: ${{ steps.cef_token_grant.outputs.grant-file }}
        run: |
          set -euo pipefail
          # The broker masked every value it returned; this only moves the token to
          # an output for the steps below. A grant without one fails the job.
          token="$(jq -r '.github.token // empty' "$GRANT_FILE")"
          [ -n "$token" ]
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # AgentMux's own Google OAuth client secret. An installed-app client secret is
      # shipped inside every build by design, so it is no stored secret of this
      # repository: the broker hands it to this release build (tag push, nightly,
      # dispatch, on main's copy of this file only), and it goes to the one step that
      # compiles the app, below. Without it the build says Google sign-in isn't
      # available.
      - name: Ask the actions broker for the Google client secret
        id: google_grant
        uses: agentmuxai/agentmux/.github/actions/actions-broker@main
        with:
          broker-url: ${{ secrets.ACTIONS_BROKER_URL }}
          entry: ci-google-macos
          mode: grant

      - name: Read the Google client secret from the grant
        id: google
        shell: bash
        env:
          GRANT_FILE: ${{ steps.google_grant.outputs.grant-file }}
        run: |
          set -euo pipefail
          # The broker masked every value it returned; this moves the secret to an
          # output for the build step only. A grant without it fails the job: a
          # release build must not go on without Google sign-in.
          value="$(jq -r '.build_secrets.AGENTMUX_GOOGLE_CLIENT_SECRET // empty' "$GRANT_FILE")"
          [ -n "$value" ]
          echo "::add-mask::$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Checkout agentmux source (the commit the gate checked)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      # A release (a tag run) keeps no build cache and takes none: it builds from what it downloads.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'

      # The ref above can be older than the CI helper scripts (a tag rebuilt by hand, a dispatch for an old SHA),
      # so they come from the revision this workflow file is at, not from the tree being built.
      - name: Fetch the CI helpers from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-helper
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-apt.sh
            scripts/ci-install-go-task.sh
            scripts/ci-require-tools.sh
            scripts/go-task.pins
          sparse-checkout-cone-mode: false

      - name: Install frontend dependencies
        run: npm install

      # The release pinned in scripts/go-task.pins, hash-checked, with retries; not Homebrew's formula.
      - name: Install go-task
        run: |
          bash .ci-helper/scripts/ci-install-go-task.sh "$RUNNER_TEMP/go-task"
          export PATH="$RUNNER_TEMP/go-task:$PATH"
          bash .ci-helper/scripts/ci-require-tools.sh task

      # ── Patched CEF framework ─────────────────────────────────────────────
      # The upstream cef-dll-sys framework lacks CefWindow::BeginWindowDrag, so
      # native window drag / floating-pane resize silently no-ops on macOS. We
      # download a pre-built PATCHED framework (agentmuxai/cef release) and point
      # AGENTMUX_CEF_RUNTIME_DIR_DARWIN at it — the macOS analogue of build-linux's
      # patched-libcef.so download. The package-macos.sh patch gate then verifies
      # the framework carries BeginWindowDrag before the app is assembled.
      # See docs/specs/SPEC_PATCHED_MACOS_CEF_FRAMEWORK_RELEASE_2026_06_29.md.
      - name: Resolve patched CEF framework tag
        id: cef
        uses: agentmuxai/agentmux/.github/actions/resolve-cef-runtime-tag@main
        with:
          platform: macos
          tag: ${{ needs.gate.outputs.cef_tag }}

      # Skipped on a release: with no cache step its `cache-hit` output is empty, so the download below runs.
      - name: Cache patched CEF framework
        id: cef-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_RUNTIME_DIR_DARWIN }}
          key: cef-runtime-darwin-${{ steps.cef.outputs.tag }}

      - name: Download patched CEF framework
        if: steps.cef-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ steps.cef_token.outputs.token }}
          CEF_TAG: ${{ steps.cef.outputs.tag }}
        run: |
          mkdir -p /tmp/cef-extract "$CEF_RUNTIME_DIR_DARWIN"
          gh release download "$CEF_TAG" \
            --repo agentmuxai/cef \
            --pattern "*.tar.gz" \
            --dir /tmp/cef-extract \
            --clobber
          tar -xzf /tmp/cef-extract/*.tar.gz -C /tmp/cef-extract
          # Find the .framework regardless of whether the tarball has a top-level dir
          FW=$(find /tmp/cef-extract -maxdepth 3 -name "Chromium Embedded Framework.framework" -type d | head -1)
          if [ -z "$FW" ]; then echo "❌ framework not found in tarball"; exit 1; fi
          # ditto preserves the Versions/Current symlink chain the CEF loader follows.
          ditto "$FW" "$CEF_RUNTIME_DIR_DARWIN/Chromium Embedded Framework.framework"
          rm -rf /tmp/cef-extract

      - name: Set AGENTMUX_CEF_RUNTIME_DIR_DARWIN
        run: echo "AGENTMUX_CEF_RUNTIME_DIR_DARWIN=$CEF_RUNTIME_DIR_DARWIN" >> "$GITHUB_ENV"

      # ── Remote helpers ─────────────────────────────────────────────────────
      # Every package carries agentmux-remote for all four SSH host platforms
      # (scripts/build-remote-helpers.sh, called by the packager; spec
      # SPEC_REMOTE_TERMINALS_AND_DURABLE_SESSIONS_2026_10_02.md §9.1).
      # cargo-zigbuild cross-builds all four from this runner; setup-python gives
      # a pip that installs zig without touching the system Python.
      - name: Install zig and cargo-zigbuild (remote helpers)
        uses: agentmuxai/agentmux/.github/actions/install-remote-helper-toolchain@main

      - name: Install Rosetta (runs the other-architecture remote helper)
        shell: bash
        run: |
          # Rosetta runs the Intel helper in check-remote-helpers.sh.
          softwareupdate --install-rosetta --agree-to-license || true

      # ── Build and assemble the UNSIGNED app ────────────────────────────────
      # RELEASE_CHANNEL=stable is REQUIRED here as of
      # docs/specs/SPEC_MACOS_DMG_PER_BUILD_CHANNEL_2026_08_24.md: `task
      # package:macos` (no override) now bakes a per-build LOCAL channel, same
      # as Windows/Linux. Without this, every release DMG would ship isolated
      # from the user's real (stable) data dir. Matches build-linux.yml, which
      # calls its script directly with the same override for the same reason.
      # Nothing here signs: there is no certificate and no keychain in this job.
      - name: Build and assemble the unsigned app (RELEASE_CHANNEL=stable)
        env:
          AGENTMUX_GOOGLE_CLIENT_SECRET: ${{ steps.google.outputs.value }}
        run: |
          mkdir -p "$OUT"
          # The srv release build ends in a link of many minutes that prints nothing. A line every
          # five minutes with the busiest process tells a slow link from a hang.
          ( while sleep 300; do echo "still running, $((SECONDS / 60)) min into this step; busiest process: $(ps -Ao pcpu=,etime=,comm= -r | head -1)"; done ) &
          HEARTBEAT=$!
          trap 'kill "$HEARTBEAT" 2>/dev/null || true' EXIT
          REQUIRE_REMOTE_HELPERS=1 RELEASE_CHANNEL=stable bash scripts/package-macos.sh --unsigned-app "$OUT"
          # ditto keeps the symlinks, modes and resource forks of the bundle, which the signing job needs as they are.
          # The zip is named so that release-core's "*.dmg" sweep of the run's artifacts cannot pick it up.
          ditto -c -k --keepParent --sequesterRsrc build/AgentMux.app "$OUT/AgentMux-unsigned-app.zip"

      - name: Upload the unsigned app for the signing job
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-unsigned
          path: ${{ env.OUT }}/AgentMux-unsigned-app.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: macOS arm64 — sign, notarize and staple
    needs: [gate, build]
    runs-on: macos-latest
    # Two notarizations (the app, then the DMG) took up to 12.5 minutes each before the first one was added;
    # the rest is minutes. The limit fails a stuck notarization long before GitHub's 6-hour limit.
    timeout-minutes: 90
    # The only job that can assume the Apple role: the role's trust names this environment in the token's `sub`.
    # The environment has no secrets of its own and deploys only from main and v* tags.
    environment: apple-signing
    permissions:
      contents: read
      id-token: write   # the identity token the role for the Apple secrets accepts; this is the only job that can use it
    env:
      WORK: ${{ github.workspace }}/sign-work

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app-unsigned
          path: ${{ env.WORK }}/in

      # Before AWS is asked: the token must name this file on main and the apple-signing environment (the role
      # checks the same and refuses anything else), and the revision of this file it names is where the signing
      # scripts come from. job_workflow_sha is that revision: not the commit that was built, which can be older.
      - name: The identity token names build-macos.yml on main
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          CLAIMS=$(echo "$TOKEN" | jq -R 'split(".")[1] | @base64d | fromjson')
          echo "$CLAIMS" | jq '{sub, job_workflow_ref, job_workflow_sha, workflow_ref, ref, event_name, environment}'
          WANT="${GITHUB_REPOSITORY}/.github/workflows/build-macos.yml@refs/heads/main"
          GOT=$(echo "$CLAIMS" | jq -r .job_workflow_ref)
          SUB=$(echo "$CLAIMS" | jq -r .sub)
          REF=$(echo "$CLAIMS" | jq -r .ref)
          SHA=$(echo "$CLAIMS" | jq -r .job_workflow_sha)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the identity token's job_workflow_ref is '$GOT', not '$WANT'; the Apple signing role accepts only the latter. Is the caller using build-macos.yml@main?"
            exit 1
          fi
          if [ "$SUB" != "repo:${GITHUB_REPOSITORY}:environment:apple-signing" ]; then
            echo "::error::the identity token's sub is '$SUB': the Apple signing role accepts only the apple-signing environment"
            exit 1
          fi
          case "$REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "::error::the identity token's ref is '$REF': the Apple signing role accepts only main and v* tags"; exit 1 ;;
          esac
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the identity token has no workflow revision"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The signing scripts and the entitlements, as data and scripts of main's reviewed workflow revision: this job
      # runs nothing that came from the commit that was built.
      - name: Fetch the signing scripts from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.identity.outputs.sha }}
          path: signing-scripts
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-macos-app.sh
            scripts/notarize-macos.sh
            scripts/make-macos-dmg.sh
            scripts/verify-srv-identity-darwin.sh
            build/entitlements.mac.plist
          sparse-checkout-cone-mode: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.APPLE_SIGNING_ROLE }}
          aws-region: ${{ vars.APPLE_SIGNING_REGION }}
          # Explicit: this repository's logs are public. The account id stays masked.
          mask-aws-account-id: true
          role-session-name: apple-signing-${{ github.run_id }}
          role-duration-seconds: 900

      # The secret goes to a file only the next two steps read, and is deleted in the one after.
      - name: Fetch the Apple signing secrets
        shell: bash
        env:
          # Repository variables, like the role: where the secret lives is not published here.
          SECRET_ID: ${{ vars.APPLE_SIGNING_SECRET_ID }}
          # A jq path to this build's object when the secret holds more than this build's values; empty
          # when the secret is that object itself.
          SECRET_FIELD: ${{ vars.APPLE_SIGNING_SECRET_FIELD }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/apple-signing.json"
          umask 077
          if [ -n "$SECRET_FIELD" ]; then
            # Only the object picked out of the secret reaches the disk.
            aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text \
              | jq -ce "$SECRET_FIELD" > "$FILE" \
              || { echo "::error::the Apple signing secret has no value at the configured field"; exit 1; }
          else
            aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text > "$FILE"
          fi
          # Every field is a non-empty single-line string, and each one is masked in the logs.
          jq -e 'type == "object" and length > 0 and all(.[]; type == "string" and length > 0 and (contains("\n") | not))' "$FILE" > /dev/null \
            || { echo "::error::the Apple signing secret is not a flat object of non-empty single-line strings"; exit 1; }
          jq -r '.[]' "$FILE" | while IFS= read -r v; do echo "::add-mask::$v"; done
          echo "APPLE_SIGNING_FILE=$FILE" >> "$GITHUB_ENV"
          # The role is needed for this one call. Later steps get no AWS session: configure-aws-credentials
          # exported one to the job, so it is emptied here.
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do echo "$v=" >> "$GITHUB_ENV"; done

      # A short-lived keychain that is torn down in the last step. Keeps the signing identity off the default
      # login keychain so it doesn't persist between runs.
      - name: Import Developer ID certificate into temp keychain
        shell: bash
        run: |
          set -euo pipefail
          APPLE_CERTIFICATE="$(jq -er .APPLE_CERTIFICATE "$APPLE_SIGNING_FILE")"
          APPLE_CERTIFICATE_PASSWORD="$(jq -er .APPLE_CERTIFICATE_PASSWORD "$APPLE_SIGNING_FILE")"
          # Use a full absolute path so security(1) and notarytool agree on the
          # file location — passing just a name causes a -db suffix mismatch on
          # modern macOS (the file lands at ~/Library/Keychains/<name>-db but
          # notarytool --keychain looks for the literal name).
          KEYCHAIN_PATH="$RUNNER_TEMP/build-${{ github.run_id }}.keychain"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          # Auto-lock after 6 hours, the longest a job can run: it is unlocked again before every
          # step that signs, so a locked keychain never makes codesign wait for a password.
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow codesign to access the key without interactive prompts
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      # Store notarization credentials under the temp keychain so notarytool
      # can submit without interactive prompts (NOTARY_PROFILE defaults to notarytool).
      - name: Store notarytool credentials
        shell: bash
        run: |
          set -euo pipefail
          APPLE_ID="$(jq -er .APPLE_ID "$APPLE_SIGNING_FILE")"
          APPLE_PASSWORD="$(jq -er .APPLE_PASSWORD "$APPLE_SIGNING_FILE")"
          APPLE_TEAM_ID="$(jq -er .APPLE_TEAM_ID "$APPLE_SIGNING_FILE")"
          # --no-validate skips the live Apple credential check so a pending
          # Developer Program agreement doesn't block credential storage; a
          # submission Apple does not accept then fails the notarize step below.
          xcrun notarytool store-credentials "notarytool" \
            --apple-id   "$APPLE_ID" \
            --password   "$APPLE_PASSWORD" \
            --team-id    "$APPLE_TEAM_ID" \
            --keychain   "$KEYCHAIN_PATH" \
            --no-validate
          # Everything that needed the secret has read it: the file goes now, not at the end.
          rm -f "$APPLE_SIGNING_FILE"

      - name: Unpack the unsigned app
        id: app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK/app" && mkdir -p "$WORK/app"
          ditto -x -k "$WORK/in/AgentMux-unsigned-app.zip" "$WORK/app"
          APP="$WORK/app/AgentMux.app"
          [ -d "$APP/Contents" ] || { echo "::error::the build job's artifact holds no AgentMux.app"; exit 1; }
          # The version comes out of the app, and names the DMG: shape-checked, as it came from the build job.
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.+-]+)?$ ]] || { echo "::error::the app's version is not a version"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "DMG=$WORK/dmg/AgentMux_${VERSION}_arm64.dmg" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Inside-out, hardened runtime, secure timestamp; then verified, srv's identity included.
      - name: Sign the app
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          bash signing-scripts/scripts/sign-macos-app.sh "$APP" signing-scripts/build/entitlements.mac.plist

      # The app first, so that the DMG is made from an app that carries its own ticket and a Mac that is
      # offline can open a fresh download. Apple not accepting it fails the release: a signed-only DMG
      # would need a right-click on every Mac.
      - name: Notarize and staple the app
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          bash signing-scripts/scripts/notarize-macos.sh app "$APP"

      - name: Make the DMG from the stapled app
        shell: bash
        run: |
          set -euo pipefail
          bash signing-scripts/scripts/make-macos-dmg.sh "$APP" "$DMG"

      - name: Sign, notarize and staple the DMG
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          CERT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$CERT" ] || { echo "::error::no 'Developer ID Application' identity in the keychain"; exit 1; }
          codesign --force --timestamp --sign "$CERT" --keychain "$KEYCHAIN_PATH" "$DMG"
          bash signing-scripts/scripts/notarize-macos.sh dmg "$DMG"
          # A suffix that is not .dmg: release-core.yml gathers every "*.dmg" in the run's artifacts into the
          # signed manifest, and only the publish job's checked copy may be one of them.
          mv "$DMG" "$DMG.pending"

      - name: Upload the signed DMG for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg-signed
          path: ${{ env.WORK }}/dmg/*.dmg.pending
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Delete temp keychain
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/apple-signing.json" "$RUNNER_TEMP/cert.p12"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; fi

  publish:
    name: macOS arm64 — check the DMG and publish it
    needs: [gate, sign]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to upload release assets via GITHUB_TOKEN
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg-signed
          path: signed

      # What a person's Mac asks, asked here: before the DMG is an artifact the release picks up, and before it is
      # a release asset. Only inline commands: no repository code runs in this job.
      - name: Check the DMG as a Mac would
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pending=(signed/*.dmg.pending)
          [ "${#pending[@]}" = 1 ] || { echo "::error::expected one signed DMG, found ${#pending[@]}"; exit 1; }
          DMG="${pending[0]%.pending}"
          mv "${pending[0]}" "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          # Gatekeeper's verdict on a downloaded disk image.
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          MNT="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -noautoopen -mountpoint "$MNT" > /dev/null
          trap 'hdiutil detach "$MNT" > /dev/null 2>&1 || true' EXIT
          APP="$MNT/AgentMux.app"
          # The app inside carries its own ticket (the first launch needs no network), is signed and is accepted.
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -t exec -vv "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt" || { echo "::error::Gatekeeper does not report the app as a notarized Developer ID app"; exit 1; }
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [ "$(basename "$DMG")" = "AgentMux_${VERSION}_arm64.dmg" ] || { echo "::error::the DMG's name does not match the app's version"; exit 1; }
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      # ── Upload to GitHub Actions artifacts (always) ────────────────────────
      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      # ── Upload to GitHub Release (when release-tag is set) ─────────────────
      - name: Upload DMG to GitHub Release
        if: needs.gate.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$DMG_PATH" \
            --repo agentmuxai/agentmux --clobber
