name: CI — nightly cross-platform build + test

# Consolidates the former ci-nightly-build.yml (compile-only) and ci-fast.yml /
# ci-nightly.yml (test-only) into one workflow. Since the CEF build is already
# paid for the compile step, the test step costs only marginal runner time.
#
# Phase A of SPEC_NIGHTLY_CROSS_PLATFORM_BUILDS_2026_06_23.md (issue #1718):
# compile the whole workspace (incl. agentmux-cef → the CEF build) on all three
# shipping platforms, nightly, so a Linux/macOS BUILD break is caught instead of
# shipping unnoticed. NOT packaging — that's Phase B (artifacts).
#
# Windows and ubuntu both BLOCK; macOS is non-blocking (continue-on-error).
# Ubuntu was advisory "until greened" and is now greened — it also carries the
# ubuntu-only `RPC bindings are current` gate, which enforced nothing while the
# leg could not fail (see the `continue-on-error` note on `build-and-test`).
# Standard GitHub-hosted runners only (free on public repos for any workload;
# only LARGER runners are billed — invariant CI-1). Run on demand via the
# Actions tab.
#
# --test-threads=1: accumulated test-isolation flakes (process-shared in-memory
# FileStore, a focus-flag global) flake under parallel runs; serial is
# deterministic. Follow-up to fix isolation + drop this (SPEC_CI_TEST_RUNNER §6.4).

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch: {}

# Own group, separate from ci-pr.yml's — a manual workflow_dispatch re-trigger
# (or an unlucky overlap with the scheduled run) queues behind an
# already-running nightly instead of racing it on the same windows-latest/
# ubuntu-latest/macos-latest runners for no reason. cancel-in-progress:
# false, not true — unlike a superseded PR run, a nightly run in progress is
# still a real signal worth finishing; queue rather than throw it away.
#
# This does NOT give nightly its own runner capacity separate from
# ci-pr.yml's — GitHub-hosted `windows-latest`/`ubuntu-latest`/`macos-latest`
# are one shared pool per repo/org regardless of concurrency group; two
# different groups still draw from the same queue. Actual capacity
# separation would need self-hosted runners or GitHub Enterprise runner
# groups, neither of which this repo has. What this achieves is narrower but
# real: nightly stops competing with itself, which is one less source of
# load on that shared pool.
concurrency:
  group: ci-nightly-build
  cancel-in-progress: false

jobs:
  build-and-test:
    name: cargo build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows AND ubuntu block; macOS stays advisory.
    #
    # This was `!= 'windows-latest'`, i.e. ubuntu was advisory too — which
    # silently defeated the superset invariant this workflow exists to provide
    # (reagentx P1 on #3489). The `RPC bindings are current` step below is
    # ubuntu-only on purpose (platform-independent output, and the script runs
    # its own `cargo test`, not worth paying for three times), so under the old
    # expression it ran on the one leg whose failures were swallowed: RPC
    # binding drift on `main` would have gone undetected exactly as it did
    # before this workflow was touched. A gate that cannot fail is not a gate.
    #
    # Ubuntu is safe to block on, by the same standard SPEC_CI_CHECK_PLACEMENT_
    # PROTOCOL_2026_09_21.md applied to ci-pr.yml: the ubuntu leg passed on its
    # own merits in all 5 most recent nightly runs (job-level conclusions, not
    # the run-level status that `continue-on-error` masks). macOS keeps
    # `continue-on-error` — it has no gate of its own that anything depends on,
    # and is the leg most prone to toolchain churn.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    # INCIDENT_2026_09_10_CI_PR_WINDOWS_RUNNER_HANG_BACKLOG.md's contributing
    # cause #1 (no timeout-minutes -> a hung runner occupies the job for
    # GitHub's 360-minute default) was fixed on ci-pr.yml but explicitly
    # flagged there as "not yet addressed" for this workflow. This full
    # cross-platform build+test (CEF included) legitimately needs more room
    # than the PR lane's 20 min (ci-pr.yml) — 60 min is generous headroom over a
    # from-scratch CEF build+test on any of the three platforms while still
    # bounding a hang to a fraction of the 360-minute default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # GH-hosted Windows runners scan every new/exec'd file with Defender
      # real-time protection by default; node.exe invoked from a Rust test
      # (agentmux-srv/tests/subprocess_io.rs::create_no_window_flag_set) has
      # hit slow-enough cold starts to flake past a 15s read timeout twice
      # (2026-06-28, 2026-08-13) — see
      # docs/specs/PLAN_WINDOWS_CI_SUBPROCESS_IO_FLAKE_FIX_2026_08_13.md.
      # Exclude the checkout/build paths and the toolchain's own processes
      # rather than disabling real-time protection outright. Best-effort: on
      # the one hard-gated leg in this workflow, a cmdlet failing here (e.g.
      # Defender module unavailable, access denied on some runner image)
      # must not fail the build — that would defeat this step's own purpose
      # of making that leg more reliable. Each exclusion is wrapped so a
      # failure just logs a warning and the rest still get attempted.
      #
      # -ExclusionProcess by itself does not reliably exempt a process from
      # exec-time scanning — Microsoft's own guidance is that the process's
      # actual file path needs to be excluded too. Static guesses at
      # node.exe/cargo.exe/rustc.exe's install paths would drift across
      # runner-image and toolchain versions, so resolve the real paths on
      # this runner via Get-Command instead (this step runs after
      # dtolnay/rust-toolchain@stable, so cargo/rustc are already on PATH;
      # node.exe ships preinstalled on GH-hosted windows-latest images).
      - name: Exclude build paths + toolchain processes from Windows Defender
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          function Add-ExclusionSafe {
            param([scriptblock]$Body, [string]$Desc)
            try {
              & $Body
            } catch {
              Write-Warning "Defender exclusion failed ($Desc): $_"
            }
          }

          foreach ($exe in @("node.exe", "cargo.exe", "rustc.exe")) {
            $resolved = Get-Command $exe -ErrorAction SilentlyContinue
            if ($resolved) {
              Add-ExclusionSafe { Add-MpPreference -ExclusionPath $resolved.Source -ErrorAction Stop } "$exe path ($($resolved.Source))"
            } else {
              Write-Warning "Defender exclusion: could not resolve a path for $exe via Get-Command"
            }
            Add-ExclusionSafe { Add-MpPreference -ExclusionProcess $exe -ErrorAction Stop } "$exe process"
          }

          # link.exe (MSVC linker) isn't on PATH outside a Developer Command
          # Prompt, so Get-Command can't resolve it here. Exclude the whole
          # Visual Studio install root instead — this is an ephemeral,
          # single-purpose CI runner, so a broad exclusion here carries no
          # meaningful risk, unlike on a persistent/shared machine.
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "C:\Program Files\Microsoft Visual Studio" -ErrorAction Stop } "VS install root (Program Files)"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction Stop } "VS install root (Program Files x86)"
          Add-ExclusionSafe { Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction Stop } "link.exe process"

          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop } "workspace path"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction Stop } "runner temp path"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction Stop } "cargo home path"
          Add-ExclusionSafe { Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup" -ErrorAction Stop } "rustup toolchains path"

      # cef-dll-sys builds CEF's C wrapper with CMake + Ninja.
      - name: Install Ninja (Windows — CMake ships with VS)
        if: matrix.os == 'windows-latest'
        run: choco install ninja -y
      - name: Install build deps (Linux — CEF + launcher Wayland/GTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The runner image ships a google-chrome apt source we install nothing
          # from; a corrupt index there exits apt 100 and takes the whole Linux
          # leg down (2026-09-09). The glob covers both the `.list` and deb822
          # `.sources` spellings.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*

          # Tolerate a broken THIRD-PARTY index, but never a broken Ubuntu one.
          # A bare `|| true` would also swallow an archive/signing/network
          # failure on Ubuntu's own mirrors, and `apt-get install` can still
          # succeed from stale cached lists -- so a RELEASE could be built
          # without a successful refresh, silently. Tolerate the exit code, then
          # re-read the log and abort if Ubuntu itself was the failure.
          sudo apt-get update 2>&1 | tee /tmp/apt-update.log || true
          # Match the error form AND the warning form. `-qq` suppresses the
          # `Err:<n> <url>` acquisition record and reports the same failure as
          # `W: Failed to fetch ...`, and apt can still exit 0 while keeping the
          # old indexes -- so matching only E:/Err: would miss the common
          # network case in a quiet release build.
          if grep -qE '^(E|Err):.*(archive\.ubuntu\.com|security\.ubuntu\.com)|^W: Failed to fetch.*(archive\.ubuntu\.com|security\.ubuntu\.com)' \
               /tmp/apt-update.log; then
            echo "::error::apt-get update failed against the Ubuntu archive - refusing to build from stale package lists"
            exit 1
          fi
          sudo apt-get install -y ninja-build cmake libwayland-dev libxkbcommon-dev libgtk-3-dev
      - name: Install build deps (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ninja cmake

      - uses: Swatinem/rust-cache@v2

      # Compile every crate, incl. agentmux-cef (pays the CEF download + build).
      # Surfaces cross-platform compile/link breaks; packaging is Phase B (#1718).
      - name: cargo build --release --workspace
        run: cargo build --release --workspace

      # CEF build already paid above — run the full test suite at near-zero
      # marginal cost. Serial (--test-threads=1) for determinism; see note above.
      - name: cargo test --workspace
        run: cargo test --workspace -- --test-threads=1

      # agentmux-cef's `test-authfile` feature gates the authfile tests that
      # touch the real OS data dir. Nothing built them: PR CI deliberately
      # excludes agentmux-cef (CEF compile time — see ci-pr.yml's header), and
      # the workspace run above does not enable non-default features. So that
      # module could only rot, and it did — PR #3354 shipped a duplicate
      # `mod tests` (E0428) and two stale call sites with the wrong argument
      # count, and every one of them passed the Windows leg because the code
      # was never compiled. Review caught them; CI could not have.
      #
      # The CEF build is already paid for by the steps above, so this is
      # near-zero marginal cost, and nightly is the lane that owns
      # agentmux-cef coverage.
      - name: cargo test -p agentmux-cef --features test-authfile
        run: cargo test -p agentmux-cef --features test-authfile -- --test-threads=1

      # Superset invariant (protocol §3). Needs a Rust toolchain and a built
      # agentmux-srv, which this job already has, so it belongs here rather
      # than in the `gates` job. Ubuntu only: the generated output is
      # platform-independent (.gitattributes normalizes to LF), and this
      # script runs its own `cargo test -p agentmux-srv export_bindings`,
      # which is not something to pay for three times across the matrix.
      #
      # Ubuntu-only is only sound because the ubuntu leg BLOCKS — see the
      # `continue-on-error` note on this job. If that is ever loosened back to
      # advisory, this gate silently stops gating.
      - name: RPC bindings are current
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-rpc-bindings.sh

  frontend:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: vitest run
        run: npx vitest run

  # The superset invariant from
  # docs/specs/SPEC_CI_CHECK_PLACEMENT_PROTOCOL_2026_09_21.md §3: every PR
  # check must also run here, except the ones that structurally cannot (R1).
  #
  # Before this job existed the nightly had 8 steps to the PR checks' 22, so
  # RPC codegen, type-checking, the color lint and every whole-tree grep gate
  # ran ONLY on PRs — meaning nothing re-verified them against `main` after
  # merge. These are all seconds-long and this job runs in parallel with the
  # 19-37 min build legs, so it does not move the nightly's wall clock.
  #
  # DELIBERATELY NOT MIRRORED HERE (protocol R1 — these cannot work on a
  # schedule, and their absence is a decision, not an oversight):
  #   * no-coauthor-trailers (separate workflow) reads the PR BODY.
  #   * The doc RATCHETS and every *changed-files-scoped* gate
  #     (check-doc-status.sh, check-docs-lifecycle.mjs, gen-docs-index.sh
  #     --check, check-spec-citations.sh, check-doc-links.mjs,
  #     check-new-spec-status.mjs) only fail a change that ADDS debt. With no
  #     diff to attribute debt to they degrade into whole-repo assertions that
  #     fail forever on the ~165 pre-existing violations — which ci-pr.yml's
  #     own comment records as how three earlier attempts died.
  gates:
    name: PR-parity gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Commands below are kept identical to their ci-pr.yml counterparts --
      # including `tsconfig.citypecheck.json` (not tsconfig.json) and the
      # `npm run` indirection for the color lint -- so the two cannot drift
      # into checking subtly different things.
      - name: tsc --noEmit
        run: npx tsc --noEmit -p tsconfig.citypecheck.json

      - name: Theme-aware color lint (no hardcoded Tailwind palette colors)
        run: npm run lint:theme-colors

      - name: RPC codegen hygiene
        run: node scripts/check-rpc-codegen-hygiene.mjs

      # Whole-tree gates (not changed-files scoped), so they are meaningful
      # without a PR diff.
      - name: No living doc references the removed CLAUDE.md
        run: bash scripts/check-claude-md-references.sh
      - name: docs/ directory map is accurate
        run: node scripts/check-docs-dir-map.mjs
      - name: Menu positioning gate
        run: bash scripts/check-menu-positioning.sh
      - name: Scrollbar cursor gate
        run: bash scripts/check-scrollbar-cursor.sh
      - name: Ligature font gate
        run: bash scripts/check-ligature-fonts.sh
      - name: cef-verify self-test
        run: bash scripts/cef-verify.test.sh
      - name: Input-handler layout-read gate
        run: bash tools/lint/check-input-handler-layout-reads.sh
      - name: muxbus credential store gate
        run: bash scripts/check-muxbus-credential-store.sh
