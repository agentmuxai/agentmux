name: ReAgent review (GitHub Actions)

# Runs ReAgent's Claude reviewer directly on this repo's own free GitHub
# Actions minutes. Design and rationale live in ReAgent's private repo.
#
# Security model (same established pattern as this repo's own
# codex-review-gate.yml, see that workflow's header comment): pull_request_target
# runs the WORKFLOW FILE from main, so a fork PR cannot alter what this job
# does, and grants secrets/credentials even for a fork-originated PR. This
# job never checks out the PR's own code at all -- the reviewer container
# clones it itself and, by ReAgent's own design, never holds AWS or GitHub
# credentials while reading it. ReAgent, not the transport, decides whether
# to act.
#
# HARD CONSTRAINT for any future edit to this file: never add a step that
# runs actions/checkout against the PR's head ref or any fork-supplied ref.
# If a future need arises to read the diff from a workflow step directly,
# use the GitHub API (gh pr diff), not a checkout of untrusted code.
#
# Image: ReAgent's reviewer image, pulled from a PRIVATE GHCR package,
# ghcr.io/agentmuxai/reagent-reviewer, with this run's GITHUB_TOKEN: free,
# and no AWS egress. mirror-reviewer-image.yml copies ECR's `:prod` there
# after every ReAgent deploy. Do NOT point this at ECR: that cost real AWS
# egress per run, and this workflow's AWS role no longer has ECR access, so
# it would fail. The run logs the digest
# and the ECR digest it was mirrored from; to pin a build, set REVIEWER_IMAGE
# to `ghcr.io/agentmuxai/reagent-reviewer:ecr-<first 12 hex of the ECR digest>`.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  id-token: write # aws-actions/configure-aws-credentials (OIDC, no static keys)
  contents: read
  packages: read # pull the reviewer image from GHCR with GITHUB_TOKEN

jobs:
  review:
    # reagentx caught this on PR #4009: without a gate, EVERY comment on
    # ANY issue in the repo (not just a PR) spun up AWS OIDC credential
    # exchange, a registry login and a docker pull before the reviewer's own
    # "not a PR" filter ever ran downstream. Same gate shape as this repo's
    # own codex-review-gate.yml uses for the identical problem.
    #
    # Gate before the pull: a superset of the reviewer's own filter, so it
    # never skips an event the reviewer would act on, but it drops the ones
    # it would certainly drop: edits that change neither the base, title nor
    # body, closed PRs, ReAgent's own
    # comments, and comments from humans with no @-mention. Codex's comments
    # are NOT dropped: the reviewer reads them. ReAgent's tests read THIS
    # expression from main; keep the `pull_request.state == 'open'` clause
    # (the test uses it as a marker of this gate).
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.state == 'open' &&
       (github.event.action != 'edited' || github.event.changes.base ||
        github.event.changes.title || github.event.changes.body)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login != 'reagentx-workflow[bot]' &&
       (contains(github.event.comment.body, '@reagentx-workflow') ||
        endsWith(github.event.comment.user.login, '[bot]') ||
        startsWith(github.event.comment.user.login, 'GenericAgentX-')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level, not workflow-level -- same reasoning as codex-review-gate.yml's
    # identical comment: a run the `if:` above skips (a non-PR issue comment)
    # must not occupy this group, or it can cancel/block an actually-running
    # review a second earlier. cancel-in-progress is false: a synchronize
    # mid-review shouldn't cancel a review still in flight for the prior
    # head -- the reviewer already handles a stale head safely and does not
    # post duplicates.
    concurrency:
      group: reagent-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::050544946291:role/reagent-actions-agentmux-role
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run ReAgent reviewer
        env:
          # See this file's header comment: `:prod` follows ReAgent's deploys.
          REVIEWER_IMAGE: "ghcr.io/agentmuxai/reagent-reviewer:prod"
        # --user: the image runs as root under plain `docker run`, and the
        # Claude CLI refuses --dangerously-skip-permissions as root.
        # HOME=/tmp in the image, which is world-writable, so a non-root user
        # can still write its credentials and clones.
        # STATE_TABLE_NAME is not baked into the image; the reviewer needs it
        # to avoid reviewing the same head twice.
        run: |
          docker pull --quiet "$REVIEWER_IMAGE"
          echo "ReAgent reviewer image: $(docker image inspect --format '{{index .RepoDigests 0}}' "$REVIEWER_IMAGE") (mirrored from ECR $(docker image inspect --format '{{index .Config.Labels "reagent.ecr-digest"}}' "$REVIEWER_IMAGE"))"
          docker run --rm \
            --user 1000:1000 \
            -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e STATE_TABLE_NAME=reagent-state \
            -e GITHUB_EVENT_PATH=/tmp/event.json \
            -v "$GITHUB_EVENT_PATH:/tmp/event.json:ro" \
            --entrypoint python \
            "$REVIEWER_IMAGE" \
            github_actions_entrypoint.py
