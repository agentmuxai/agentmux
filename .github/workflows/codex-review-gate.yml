name: Codex review gate

# Sets the `Codex review` commit status on a PR's head commit: success only
# once Codex has said "Didn't find any major issues" about that commit, or
# about an earlier one with only docs changed since, or flagged only docs, or
# answered the request for that commit with its out-of-quota notice (or
# muxreview skipped asking for it while Codex is out of quota).
# Make it a required check on main to stop merges ahead of Codex (#3513 merged
# while Codex was still finding bugs; three fixes were orphaned into #3538).
# Logic and rationale: scripts/ci-codex-review-gate.mjs.
#
# Codex only reviews when a5af asks. muxreview decides when (after it approves,
# then only for changes Codex would care about; see the script header); this
# workflow only reads and sets a status.
#
# Triggers:
#   pull_request_target  a push resets the new head to pending
#   issue_comment        Codex's "no major issues" or out-of-quota comment, or
#                        muxreview's quota-skip comment (created or edited in
#                        place for a later head)
#   pull_request_review  Codex's findings review
#   workflow_dispatch    re-evaluate one PR by hand (e.g. PRs opened before
#                        this workflow existed), or by the sweep
#   schedule             the sweep: dispatches the above for each open PR whose
#                        head has no status, or a pending one older than a
#                        Codex answer or muxreview note (an evaluation lost to
#                        an outage, a dropped webhook or a cancelled run)
#
# pull_request_target and issue_comment run main's copy of this workflow
# with a write token, so a PR cannot edit the gate that judges it. Nothing
# here checks out or runs PR code; keep it that way. Only main's copy of the
# script and the modules it imports is checked out, whatever the trigger.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate
        required: true
  # Off the top of the hour, where GitHub delays scheduled runs most.
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  statuses: write
  pull-requests: read
  issues: read

jobs:
  evaluate:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.user.login == 'reagentx-workflow[bot]' ||
         github.event.comment.user.login == 'muxreview[bot]') &&
        contains(github.event.comment.body, 'reagent:codex-skipped')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, not workflow-level: a run whose `if:` skips this job (every
    # non-Codex review or comment) must not join the group. At workflow level
    # it did, and cancelled the push's evaluation a second earlier -- the new
    # head got no status and the PR showed a failed `evaluate` (#3556).
    # Every run re-reads the PR's current state, so only the latest matters.
    concurrency:
      group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit this workflow file was read from, when that is the
          # default branch (pull_request_target into it, issue_comment,
          # workflow_dispatch on it), so the script and the sparse list below
          # always come from the same commit. Checking out the branch's head
          # instead let a run queued just before a merge pair the old list with
          # the new script, which failed on a module it didn't check out.
          # Otherwise (pull_request_review, whose sha is the PR's own merge
          # commit) the default branch, so PR code never runs here.
          ref: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || github.event.repository.default_branch }}
          # Every module the gate imports, or it crashes on every PR once
          # merged. ci-codex-review-gate.test.mjs fails when one is missing.
          sparse-checkout: |
            scripts/ci-codex-review-gate.mjs
            scripts/lib/github-rest.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set Codex review status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: node scripts/ci-codex-review-gate.mjs

  # Dispatches `evaluate` (workflow_dispatch) rather than posting statuses
  # itself, so each PR's evaluation runs in that PR's concurrency group above
  # and can't race an event-driven run. Dispatches made with GITHUB_TOKEN do
  # start runs, unlike other events it causes. It never asks Codex anything.
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
      pull-requests: read
      issues: read
      actions: write
    concurrency:
      group: codex-review-gate-sweep
      cancel-in-progress: true
    steps:
      # A schedule only ever runs on the default branch, so this is main's copy.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci-codex-review-gate.mjs
            scripts/lib/github-rest.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Dispatch the gate for PRs that missed an input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SWEEP: "1"
          DISPATCH_REF: ${{ github.ref_name }}
        run: node scripts/ci-codex-review-gate.mjs
