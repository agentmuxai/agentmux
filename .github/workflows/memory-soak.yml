name: Memory soak (nightly, Windows)

# Measures the latest nightly Windows portable with the memory lab
# (scripts/perf/memory-lab) and checks it against scripts/perf/memory-lab/budget.json.
#
# REPORT ONLY until the operator sets the lines and the mode in budget.json:
# with every line null (as shipped) this job cannot fail on a number, and it
# is not a required check for any PR. See docs/reports/REPORT_MEMORY_SOAK_GATE_2026_10_18.md.
#
# It runs on its own schedule, after the nightly artifacts build, and fetches
# that build's portable by looking the run up rather than by a workflow_run
# trigger (which has not fired reliably in this repo, see nightly-release.yml).

on:
  schedule:
    # ci-nightly-artifacts is scheduled for 06:00 UTC but GitHub starts it late (its runs have begun between 10:28 and
    # 11:36 UTC) and it takes about 25 minutes; this runs well after, so it measures the same morning's build.
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Run of "CI — nightly artifacts" whose windows-portable artifact to measure (blank: the latest successful one)'
        required: false
        default: ''
      panes:
        description: 'Agents (the nightly standard is 12)'
        required: false
        default: '12'
      rounds:
        description: 'Rounds (the nightly standard is 10)'
        required: false
        default: '10'
      runs:
        description: 'Runs of the lab in a row, to size the job and see the spread (the nightly does 1)'
        required: false
        default: '1'

concurrency:
  group: memory-soak
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  soak:
    name: lab on the nightly Windows portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The lab's CDP client needs the `ws` package; nothing else here uses node_modules.
      - run: npm ci --ignore-scripts

      - name: Find the nightly build
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-nightly-artifacts.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::no successful nightly artifacts run to measure"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
          path: portable-archive

      - name: Extract the portable
        shell: bash
        run: |
          archive=$(ls portable-archive/agentmux-*-x64-portable.7z | head -n 1)
          7z x "$archive" -oportable -y > /dev/null
          # The folder holding agentmux.exe, wherever the archive puts it (with or without a top-level folder).
          exe=$(find portable -name agentmux.exe | head -n 1)
          if [ -z "$exe" ]; then
            echo "::error::no agentmux.exe in the extracted portable; top level:"
            ls -la portable
            exit 1
          fi
          dir=$(dirname "$exe")
          echo "PORTABLE=$dir" >> "$GITHUB_ENV"
          echo "measuring $dir from run ${{ steps.build.outputs.run-id }}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: memory-soak

      - name: Run the lab
        shell: bash
        env:
          PANES: ${{ inputs.panes || '12' }}
          ROUNDS: ${{ inputs.rounds || '10' }}
          RUNS: ${{ inputs.runs || '1' }}
        run: |
          # The first run is labelled "nightly" (the gate and the artifact read it); the others nightly-2, nightly-3 ...
          # The wall time of each run is kept, to size the job.
          : > memory-lab-out-walls.txt
          for n in $(seq 1 "$RUNS"); do
            label=nightly
            [ "$n" -gt 1 ] && label="nightly-$n"
            start=$(date +%s)
            node scripts/perf/memory-lab/run.mjs --portable "$PORTABLE" --label "$label" \
              --panes "$PANES" --rounds "$ROUNDS" --seed 1 --port 9333 --out memory-lab-out
            echo $(( $(date +%s) - start )) >> memory-lab-out-walls.txt
          done

      - name: Gate
        shell: bash
        run: |
          node scripts/perf/memory-lab/gate.mjs memory-lab-out/nightly/result.json --md gate.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Spread over the runs
        if: ${{ inputs.runs != '' && inputs.runs != '1' }}
        shell: bash
        run: |
          walls=$(paste -sd, memory-lab-out-walls.txt)
          node scripts/perf/memory-lab/spread.mjs memory-lab-out/nightly*/result.json --wall "$walls" --md spread.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak-${{ github.run_id }}
          path: |
            memory-lab-out/nightly*/result.json
            memory-lab-out/nightly*/summary.md
            memory-lab-out/nightly/instance.log
            memory-lab-out-walls.txt
            gate.md
            spread.md
          if-no-files-found: warn
          retention-days: 90
