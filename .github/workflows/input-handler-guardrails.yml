name: Input-handler guardrails

# Two grep-gate lints for the keystroke path, folded into one workflow (same
# trigger/runner/shape — was two near-identical files: input-handler-layout-reads.yml
# + input-handler-sync-ipc.yml).
#
# Repo policy (2026-06-23): CI runs NIGHTLY, not per-PR — so this runs on a
# nightly schedule + manual dispatch instead of on pull_request (reagent still
# reviews PRs). The path filter is dropped — both lints are fast and run
# whole-tree nightly. Trade-off: an in-scope regression is caught the next
# morning, not at PR time.

on:
  schedule:
    - cron: '0 10 * * *' # nightly
  workflow_dispatch: {}

jobs:
  layout-reads:
    name: layout-read guardrail
    # Enforces SPEC_INPUT_RESPONSIVENESS_TERMINAL_AND_AGENT_2026_05_29.md
    # rule #3: "Never read layout after touching style on the keystroke path."
    # Catches the 22 ms-per-keystroke reflow regression (see
    # docs/analysis/agent-typing-lag-trace-2026-04-12.md for the prior incident).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check
        run: bash tools/lint/check-input-handler-layout-reads.sh

  sync-ipc:
    name: sync-IPC guardrail
    # Enforces input-first invariant I2 (follow-up to discussion #1161, built
    # on SPEC_INPUT_RESPONSIVENESS_TERMINAL_AND_AGENT_2026_05_29.md):
    #   "No synchronous IPC on any input path, ever."
    # A keystroke handler may DISPATCH host work (fire-and-forget invokeCommand)
    # but must never BLOCK on it before paint. See
    # docs/analysis/ANALYSIS_KEYDOWN_IPC_AUDIT_2026_05_29.md for the audit baseline.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check
        run: bash tools/lint/check-input-handler-sync-ipc.sh
