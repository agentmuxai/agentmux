name: Mirror ReAgent reviewer image to GHCR

# Copies ReAgent's reviewer image from ECR to a PRIVATE GHCR package, once per
# new image, so reagent-review.yml can pull it with GITHUB_TOKEN: free, and no
# AWS egress. Pulling from ECR on every review run cost real AWS data
# transfer. The design lives in ReAgent's private repo.
#
# The common run is a no-op: one ECR DescribeImages call (no image transfer)
# and one GHCR manifest read. Only when ECR's :prod moved does it pull the
# image (~0.6 GiB of egress, once per ReAgent deploy) and push it here.
#
# Its ECR access is read-only and short-lived, granted by the actions broker
# only to this file on main (scheduled or dispatched runs); no other workflow
# here can pull from ECR.
#
# HARD CONSTRAINT: the package must stay PRIVATE. The image holds ReAgent's
# private source and prompts. Every run checks that first and fails if an
# anonymous pull of :prod would succeed.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: mirror-reviewer-image
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for the actions broker
      packages: write # push to ghcr.io/agentmuxai/reagent-reviewer, prune old tags
    env:
      # The ECR registry is derived at run time (and masked) rather than written
      # here: this repo and its Actions logs are public.
      ECR_REPO_NAME: reagent-reviewer-image
      GHCR_IMAGE: ghcr.io/agentmuxai/reagent-reviewer
    steps:
      - name: The package must be private
        run: |
          # Anonymous: runs before any docker login.
          if docker manifest inspect "$GHCR_IMAGE:prod" >/dev/null 2>&1; then
            echo "::error::$GHCR_IMAGE is PUBLIC: it holds ReAgent's private code. Make it private in the package settings now."
            exit 1
          fi
          echo "anonymous read refused (private, or not created yet)"

      - name: Broker client
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Read-only ECR access from the actions broker
        uses: ./.github/actions/actions-broker
        with:
          broker-url: ${{ secrets.ACTIONS_BROKER_URL }}
          entry: reagent-image-mirror
          mode: aws

      - name: Mirror when ECR's :prod moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          ECR_REPO="$account.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME"
          ecr_digest=$(aws ecr describe-images --repository-name "$ECR_REPO_NAME" \
            --image-ids imageTag=prod --query 'imageDetails[0].imageDigest' --output text)
          echo "ECR :prod = $ecr_digest"

          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          mirrored=$(docker buildx imagetools inspect "$GHCR_IMAGE:prod" --format '{{json .Image.Config.Labels}}' 2>/dev/null \
            | jq -r '."reagent.ecr-digest" // ""' || true)
          if [ "$mirrored" = "$ecr_digest" ]; then
            echo "up to date: GHCR :prod is ECR $ecr_digest; nothing pulled"
            exit 0
          fi
          echo "GHCR :prod is '${mirrored:-none}'; mirroring $ecr_digest"

          aws ecr get-login-password | docker login "${ECR_REPO%%/*}" -u AWS --password-stdin
          docker pull --quiet "$ECR_REPO@$ecr_digest"
          # A label-only layer on top: no new filesystem layers, so the push
          # re-uses the pulled layers. No provenance/SBOM attestations: one
          # linux/amd64 manifest, no index or attestation children (keeps pruning simple).
          short=${ecr_digest#sha256:}; short=${short:0:12}
          printf 'FROM %s\nLABEL reagent.ecr-digest=%s org.opencontainers.image.source=https://github.com/%s\n' \
            "$ECR_REPO@$ecr_digest" "$ecr_digest" "${{ github.repository }}" \
            | docker buildx build --quiet --provenance=false --sbom=false --push \
                -t "$GHCR_IMAGE:ecr-$short" -t "$GHCR_IMAGE:prod" -
          echo "pushed $GHCR_IMAGE:prod and :ecr-$short"

      - name: Still private after the push
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker manifest inspect "$GHCR_IMAGE:prod" >/dev/null 2>&1; then
            echo "::error::$GHCR_IMAGE is PUBLIC after the push. Make it private now."
            exit 1
          fi

      - name: Prune old tagged versions (keep newest 5; never untagged, never :prod)
        continue-on-error: true # pruning is housekeeping; storage is free today
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "/orgs/agentmuxai/packages/container/reagent-reviewer/versions" \
            --jq '[.[] | select((.metadata.container.tags | length) > 0)]' \
            | jq -s 'add | sort_by(.created_at) | reverse | .[5:] | .[]
                     | select(.metadata.container.tags | index("prod") | not) | .id' \
            | while read -r id; do
                echo "deleting version $id"
                gh api -X DELETE "/orgs/agentmuxai/packages/container/reagent-reviewer/versions/$id"
              done
