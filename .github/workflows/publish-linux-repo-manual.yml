name: Publish Linux repository (manual)

# Republish a release to the apt and dnf repository by hand. It only calls publish-linux-repo.yml on main, so the
# publish job runs as a called workflow, which is the identity the publish role checks.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release to add, like 0.60.8 (no leading v; blank: the latest published release)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the apt and dnf repository
    permissions:
      contents: read
      id-token: write   # the OIDC token the repository's publish role accepts
    uses: agentmuxai/agentmux/.github/workflows/publish-linux-repo.yml@main
    with:
      version: ${{ inputs.version }}
