name: PR title names the agent

# A PR opened through the shared GitHub App (muxagent[bot], named
# genericagentx-workflow[bot] until 2026-10-07) can't
# say which agent opened it, so its title must start with "<Agent>@<host>: ",
# e.g. "Korp@narko: fix the toolbar". PRs from any other author pass.
# Keep this file identical across agentmux, agentmux-docs, agentmux-landing and
# agentmux-mobile.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # A merge queue group (docs/specs/SPEC_CI_MERGE_QUEUE_AND_FAST_GATES_2026_10_19.md
  # §5 Phase 1): a title belongs to a PR, which the PR's own run checked, so here it
  # passes.
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  agent-title:
    name: PR title names the agent
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: In a merge queue
        if: github.event_name == 'merge_group'
        run: echo "A title belongs to a PR. Each PR in this group passed it before it could join the queue."
      - name: Shared-identity PRs start with <Agent>@<host>
        if: github.event_name != 'merge_group'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$AUTHOR" != "muxagent[bot]" ] && [ "$AUTHOR" != "genericagentx-workflow[bot]" ]; then
            echo "Opened by $AUTHOR, not the shared identity: nothing to check."
            exit 0
          fi
          if printf '%s' "$TITLE" | grep -Eq '^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+: [^ ]'; then
            echo "Title names the agent."
            exit 0
          fi
          echo "::error title=PR title must name the agent::PRs opened as $AUTHOR must start the title with '<Agent>@<host>: ', for example 'Korp@narko: fix the toolbar'. Edit the title; this check re-runs."
          exit 1
