name: build-linux

# Linux release pipeline for AgentMux.
# Builds a patched-libcef.so-backed AppImage, .deb, .rpm, and portable
# .tar.gz (all x86_64, from one compile — see the "Build AppImage + deb +
# rpm + tarball" step below) and uploads them to the corresponding GitHub
# release. docs/specs/SPEC_LINUX_DISTRO_TARGETS_AND_DOWNLOADS_PAGE_2026_09_15.md
# Phase 1 widened this from AppImage-only (.deb + .tar.gz); Phase 2 added
# .rpm.
#
# The upstream cef-dll-sys libcef.so lacks BeginWindowDrag; building from source
# takes 3-6 h and 99 GB. Instead we download a pre-built patched libcef.so from
# a release in agentmuxai/cef (private) and point AGENTMUX_CEF_RUNTIME_DIR at it.
# See docs/specs/SPEC_BUILDER_MACOS_LINUX_CI_2026_06_24.md for full design notes.
#
# Required repo secrets (Settings → Secrets → Actions):
#   CI_APP_ID / CI_APP_PRIVATE_KEY   GitHub App creds (org secrets); a
#                                   short-lived token for agentmuxai/cef is
#                                   minted per run, replacing CEF_RUNTIME_TOKEN
#   (release upload uses GITHUB_TOKEN with contents:write — no extra PAT needed)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentmux ref to build (tag / branch / SHA)"
        required: true
        default: main
      release-tag:
        description: "GitHub release tag to upload the AppImage to (blank = skip upload)"
        required: false
        default: ""
      cef-runtime-tag:
        description: "agentmuxai/cef release tag for patched libcef.so (blank = the pin in scripts/cef-build/cef-runtime-pins.sh)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-linux]
    # client_payload: { ref: "vX.Y.Z", release_tag: "vX.Y.Z", cef_runtime_tag: "" }
  workflow_call:
    # Lets release.yml invoke this as a reusable workflow instead of inlining
    # a second copy of the CEF-provisioning steps. `inputs.*` below is
    # populated from the caller's `with:` block exactly like workflow_dispatch
    # — the "Resolve inputs" step needs no changes for this path.
    inputs:
      ref:
        description: "agentmux ref to build (tag / branch / SHA)"
        required: true
        type: string
      release-tag:
        description: "GitHub release tag to upload the AppImage to (blank = skip upload)"
        required: false
        type: string
        default: ""
      cef-runtime-tag:
        description: "agentmuxai/cef release tag for patched libcef.so (blank = the pin in scripts/cef-build/cef-runtime-pins.sh)"
        required: false
        type: string
        default: ""

permissions:
  contents: write   # needed to upload release assets via GITHUB_TOKEN

jobs:
  build:
    name: Linux x86_64 — AppImage
    runs-on: ubuntu-22.04
    env:
      OUT: ${{ github.workspace }}/artifacts
      CEF_RUNTIME_DIR: ${{ github.workspace }}/cef-runtime

    steps:
      # Replaces CEF_RUNTIME_TOKEN, a long-lived PAT, with an installation
      # token that expires in an hour. Scoped to agentmuxai/cef only -- the
      # private key can mint broader tokens, but this job only reads one
      # repo's releases, so that is all it gets.
      # Proven equivalent before this swap by ci-app-token-smoke.yml (since removed).
      - name: Mint a short-lived token for agentmuxai/cef
        id: cef_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: agentmuxai
          repositories: cef

      - name: Resolve inputs
        id: in
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}"                   >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ github.event.client_payload.release_tag }}"   >> "$GITHUB_OUTPUT"
            echo "cef_tag=${{ github.event.client_payload.cef_runtime_tag }}"   >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}"                  >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release-tag }}"  >> "$GITHUB_OUTPUT"
            echo "cef_tag=${{ inputs.cef-runtime-tag }}"  >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout agentmux source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.in.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Isolate this cache from ubuntu-latest (glibc 2.39) runs — the runner
          # OS key is just "Linux" for both, so without a prefix a cache entry
          # built on ubuntu-24.04 gets restored here and fails (GLIBC_2.39 not found).
          prefix-key: "v1-ubuntu22"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Install system dependencies
        run: |
          # The runner image ships a google-chrome apt source we install nothing
          # from; a corrupt index there exits apt 100 and takes the whole Linux
          # leg down (2026-09-09). The glob covers both the `.list` and deb822
          # `.sources` spellings.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*

          # Tolerate a broken THIRD-PARTY index, but never a broken Ubuntu one.
          # A bare `|| true` would also swallow an archive/signing/network
          # failure on Ubuntu's own mirrors, and `apt-get install` can still
          # succeed from stale cached lists -- so a RELEASE could be built
          # without a successful refresh, silently. Tolerate the exit code, then
          # re-read the log and abort if Ubuntu itself was the failure.
          # No -qq: it hides the `Err:` acquisition records this check reads.
          sudo apt-get update 2>&1 | tee /tmp/apt-update.log || true
          # Match the error form AND the warning form. `-qq` suppresses the
          # `Err:<n> <url>` acquisition record and reports the same failure as
          # `W: Failed to fetch ...`, and apt can still exit 0 while keeping the
          # old indexes -- so matching only E:/Err: would miss the common
          # network case in a quiet release build.
          if grep -qE '^(E|Err):.*(archive\.ubuntu\.com|security\.ubuntu\.com)|^W: Failed to fetch.*(archive\.ubuntu\.com|security\.ubuntu\.com)' \
               /tmp/apt-update.log; then
            echo "::error::apt-get update failed against the Ubuntu archive - refusing to build from stale package lists"
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libwayland-dev libxkbcommon-dev libgtk-3-dev \
            libglib2.0-dev libpango1.0-dev libcairo2-dev \
            libgdk-pixbuf2.0-dev libatk1.0-dev

      - name: Install go-task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # ── Patched libcef.so ─────────────────────────────────────────────────
      # We cache by CEF tag so repeat builds don't re-download 600 MB.
      - name: Resolve patched libcef.so tag
        id: cef
        env:
          GH_TOKEN: ${{ steps.cef_token.outputs.token }}
        run: |
          TAG="${{ steps.in.outputs.cef_tag }}"
          if [ -z "$TAG" ]; then
            # Blank = this ref's committed pin, never "latest published":
            # a nightly or a direct dispatch must not pair a newly published
            # runtime with this ref's binding
            # (SPEC_CEF_MILESTONE_UPGRADE_152_TO_154_2026_09_27.md §4). A
            # deliberate non-pinned build names its cef-runtime-tag explicitly.
            # shellcheck source=/dev/null
            source scripts/cef-build/cef-runtime-pins.sh
            TAG="$CEF_LINUX_RUNTIME_TAG"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: no Linux CEF runtime tag (input blank and no pin in cef-runtime-pins.sh)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved patched libcef.so tag: $TAG"

      - name: Cache patched libcef.so
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_RUNTIME_DIR }}
          key: cef-runtime-${{ steps.cef.outputs.tag }}

      - name: Download patched libcef.so
        if: steps.cef-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ steps.cef_token.outputs.token }}
        run: |
          mkdir -p /tmp/cef-extract "$CEF_RUNTIME_DIR"
          gh release download "${{ steps.cef.outputs.tag }}" \
            --repo agentmuxai/cef \
            --pattern "*.tar.gz" \
            --dir /tmp/cef-extract \
            --clobber
          tar -xzf /tmp/cef-extract/*.tar.gz -C /tmp/cef-extract
          # Find libcef.so regardless of whether the tarball has a top-level dir
          LIBCEF=$(find /tmp/cef-extract -name "libcef.so" | head -1)
          if [ -z "$LIBCEF" ]; then echo "ERROR: libcef.so not found in tarball"; exit 1; fi
          cp -r "$(dirname "$LIBCEF")/." "$CEF_RUNTIME_DIR/"
          rm -rf /tmp/cef-extract

      - name: Set AGENTMUX_CEF_RUNTIME_DIR
        run: echo "AGENTMUX_CEF_RUNTIME_DIR=$CEF_RUNTIME_DIR" >> "$GITHUB_ENV"

      # ── appimagetool ──────────────────────────────────────────────────────
      # appimagetool is itself distributed as an AppImage. GitHub runners don't
      # have FUSE devices, so we set APPIMAGE_EXTRACT_AND_RUN=1 to let it
      # extract itself to a tmp dir and run without mounting.
      - name: Install appimagetool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # ── fpm (packages .deb/.rpm from the same staged tree — see
      #    docs/specs/SPEC_LINUX_DISTRO_TARGETS_AND_DOWNLOADS_PAGE_2026_09_15.md
      #    §2.1). The ubuntu-22.04 runner ships Ruby; fpm's `-t deb` backend
      #    is pure-Ruby, but `-t rpm` shells out to `rpmbuild` (NOT pure Ruby),
      #    hence the separate `rpm` apt package below (Debian/Ubuntu's cross-
      #    packaging path — see build-rpm-linux.sh's header comment).
      #
      #    `sudo` (2026-09-16): this job hadn't run since 2026-07-19 — the
      #    next run (PR #3283's release build) failed with
      #    Gem::FilePermissionError, "You don't have write permissions for
      #    the /var/lib/gems/3.0.0 directory." Unqualified `gem install`
      #    writes into the runner's SYSTEM Ruby's gem directory, owned by
      #    root; whatever let the unqualified form work as of the last
      #    success two months ago no longer holds (most likely a
      #    ubuntu-22.04 runner-image update to how the bundled Ruby's gem
      #    dir is owned — nothing in this repo changed between those two
      #    runs). `sudo` installs into the same system location `fpm`
      #    already resolves on PATH afterward, so no other step needs to
      #    change. ──
      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Install rpmbuild
        run: sudo apt-get install -y --no-install-recommends rpm

      # ── Remote helpers ─────────────────────────────────────────────────────
      # Every package carries agentmux-remote for all four SSH host platforms
      # (scripts/build-remote-helpers.sh, called by the packager; spec
      # SPEC_REMOTE_TERMINALS_AND_DURABLE_SESSIONS_2026_10_02.md §9.1).
      # cargo-zigbuild cross-builds all four from this runner; setup-python gives
      # a pip that installs zig without touching the system Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild (remote helpers)
        shell: bash
        run: |
          python -m pip install ziglang==0.16.0
          cargo install cargo-zigbuild --locked --version 0.23.4
          # qemu runs the arm64 helper in check-remote-helpers.sh.
          sudo apt-get install -y --no-install-recommends qemu-user-static

      # ── Build all Linux release formats from ONE compile ───────────────────
      # package-linux.sh's --format= flag accepts a comma-separated list and
      # runs the frontend/backend/host/schema/bundle build exactly once,
      # then packages each format from that same build output — see that
      # script's header comment. Do not call it once per format here; that
      # would silently quadruple the compile time (and the CEF download/cache
      # cost above is per-job, not per-format, so this is the only place
      # that duplication could sneak back in).
      - name: Build AppImage + deb + rpm + tarball
        run: |
          mkdir -p "$OUT"
          REQUIRE_REMOTE_HELPERS=1 RELEASE_CHANNEL=stable bash scripts/package-linux.sh --format=appimage,deb,rpm,tarball "$OUT"

      - name: Locate built packages
        id: pkgs
        run: |
          APPIMAGE=$(ls "$OUT"/AgentMux_*_amd64.AppImage | head -1)
          DEB=$(ls "$OUT"/AgentMux_*_amd64.deb | head -1)
          RPM=$(ls "$OUT"/AgentMux-*.x86_64.rpm | head -1)
          TARBALL=$(ls "$OUT"/AgentMux_*_amd64-portable.tar.gz | head -1)
          echo "appimage_path=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb_path=$DEB"           >> "$GITHUB_OUTPUT"
          echo "rpm_path=$RPM"           >> "$GITHUB_OUTPUT"
          echo "tarball_path=$TARBALL"   >> "$GITHUB_OUTPUT"

      # ── Upload to GitHub Actions artifacts (always) ────────────────────────
      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ${{ steps.pkgs.outputs.appimage_path }}
          if-no-files-found: error

      - name: Upload deb as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ steps.pkgs.outputs.deb_path }}
          if-no-files-found: error

      - name: Upload rpm as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: ${{ steps.pkgs.outputs.rpm_path }}
          if-no-files-found: error

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: ${{ steps.pkgs.outputs.tarball_path }}
          if-no-files-found: error

      # ── Upload to GitHub Release (when release-tag is set) ─────────────────
      - name: Upload Linux packages to GitHub Release
        if: steps.in.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.in.outputs.release_tag }}" \
            "${{ steps.pkgs.outputs.appimage_path }}" \
            "${{ steps.pkgs.outputs.deb_path }}" \
            "${{ steps.pkgs.outputs.rpm_path }}" \
            "${{ steps.pkgs.outputs.tarball_path }}" \
            --repo agentmuxai/agentmux --clobber
