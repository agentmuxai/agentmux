name: Performance check (nightly, Windows)

# Compares the latest nightly Windows portable (B) with the previous nightly build (A) on the memory lab
# (scripts/perf/memory-lab): the same 12-agent workload, runs interleaved A B A B ..., medians and ranges, flags where a
# figure moved by more than its margin in scripts/perf/memory-lab/budget.json, and the list of what was merged between
# the two builds. Where a build sits is decided by `nightly.mjs plan`.
#
# REPORT ONLY. Nothing here fails on a number, and it is not a required check for any PR. The result is the job summary,
# the uploaded artifact and, when a change is flagged, the `perf-regression` issue (SPEC_NIGHTLY_PERF_REGRESSION §4.5): if
# the first matrix flags anything, one more A/B pair is run, and the issue is opened (or commented on) only when the flag
# holds on all the runs together. A clean night closes it. Later phases add the history on a data branch.
#
# Runs after the nightly artifacts build (which GitHub starts between 10:28 and 11:36 UTC and which takes about
# 25 minutes). It looks that build up rather than using a workflow_run trigger, which has not fired reliably in this
# repo (see nightly-release.yml).

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      b-run:
        description: 'Run of "CI — nightly artifacts" to test as B (blank: the latest with a windows-portable artifact)'
        required: false
        default: ''
      runs:
        description: 'Runs of the lab per side (the nightly does 4)'
        required: false
        default: '4'
      panes:
        description: 'Agents (the nightly standard is 12)'
        required: false
        default: '12'
      rounds:
        description: 'Rounds (the nightly standard is 10)'
        required: false
        default: '10'
      dry-run-issue:
        description: 'Print what the issue step would do instead of doing it'
        type: boolean
        required: false
        default: false

concurrency:
  group: perf-regression
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  compare:
    name: lab, previous nightly against latest
    runs-on: windows-latest
    # About 5 minutes a run, 8 runs, plus setup (Phase 0 sizing on this runner type).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The lab's CDP client needs the `ws` package; nothing else here uses node_modules.
      - run: npm ci --ignore-scripts

      - name: Pick the builds
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          B_RUN: ${{ inputs.b-run }}
        run: |
          args=()
          [ -n "$B_RUN" ] && args+=(--b-run "$B_RUN")
          node scripts/perf/memory-lab/nightly.mjs plan --out plan.json "${args[@]}"

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          run-id: ${{ steps.plan.outputs.b-run }}
          github-token: ${{ github.token }}
          path: archive-b

      - uses: actions/download-artifact@v4
        if: ${{ steps.plan.outputs.a-run != '' }}
        with:
          name: windows-portable
          run-id: ${{ steps.plan.outputs.a-run }}
          github-token: ${{ github.token }}
          path: archive-a

      - name: Extract the portables
        shell: bash
        run: |
          extract() {
            local side=$1
            archive=$(ls "archive-$side"/agentmux-*-x64-portable.7z | head -n 1)
            7z x "$archive" -o"portable-$side" -y > /dev/null
            # The folder holding agentmux.exe, wherever the archive puts it (with or without a top-level folder).
            exe=$(find "portable-$side" -name agentmux.exe | head -n 1)
            if [ -z "$exe" ]; then
              echo "::error::no agentmux.exe in the extracted portable $side; top level:"
              ls -la "portable-$side"
              exit 1
            fi
            echo "$(echo "$side" | tr a-z A-Z)_PORTABLE=$(dirname "$exe")" >> "$GITHUB_ENV"
          }
          extract b
          [ -d archive-a ] && extract a
          exit 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: perf-regression

      - name: Run the lab (A and B interleaved)
        if: ${{ steps.plan.outputs.a-run != '' }}
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '4' }}
          PANES: ${{ inputs.panes || '12' }}
          ROUNDS: ${{ inputs.rounds || '10' }}
        run: |
          node scripts/perf/memory-lab/ab.mjs --a-portable "$A_PORTABLE" --b-portable "$B_PORTABLE" \
            --a-label a --b-label b --runs "$RUNS" --out perf-out \
            --margins scripts/perf/memory-lab/budget.json \
            -- --panes "$PANES" --rounds "$ROUNDS" --seed 1 --port 9333 --open-agents 3 --heavy-turns 1 --heavy-kb 600

      # No earlier build to compare with (the first night, or its portable has expired): B alone, so the numbers still exist.
      - name: Run the lab (B alone)
        if: ${{ steps.plan.outputs.a-run == '' }}
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '4' }}
          PANES: ${{ inputs.panes || '12' }}
          ROUNDS: ${{ inputs.rounds || '10' }}
        run: |
          for n in $(seq 1 "$RUNS"); do
            node scripts/perf/memory-lab/run.mjs --portable "$B_PORTABLE" --label "b$n" \
              --panes "$PANES" --rounds "$ROUNDS" --seed 1 --port 9333 --open-agents 3 --heavy-turns 1 --heavy-kb 600 --out perf-out
          done
          node scripts/perf/memory-lab/spread.mjs perf-out/b*/result.json --md perf-out/spread.md

      # A flag in the first matrix is confirmed by one more A/B pair, in the other order so a drift in the runner's speed
      # during the job falls on the other side this time.
      - name: Did the first matrix flag anything
        id: first
        if: ${{ steps.plan.outputs.a-run != '' }}
        shell: bash
        run: node scripts/perf/memory-lab/nightly.mjs flagged --compare perf-out/compare.json

      - name: Confirmation pair
        if: ${{ steps.first.outputs.flagged == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          PANES: ${{ inputs.panes || '12' }}
          ROUNDS: ${{ inputs.rounds || '10' }}
        run: |
          node scripts/perf/memory-lab/ab.mjs --a-portable "$A_PORTABLE" --b-portable "$B_PORTABLE"             --a-label a --b-label b --runs 1 --order ba --out perf-confirm             --margins scripts/perf/memory-lab/budget.json             -- --panes "$PANES" --rounds "$ROUNDS" --seed 1 --port 9333 --open-agents 3 --heavy-turns 1 --heavy-kb 600

      # The comparison over every run that finished, first matrix and confirmation pair together. Without a confirmation
      # it is the first matrix again.
      - name: Compare all the runs
        if: ${{ steps.first.outputs.flagged == 'true' }}
        shell: bash
        run: |
          commas() { local IFS=,; echo "$*"; }
          a=(perf-out/a*/result.json perf-confirm/a*/result.json)
          b=(perf-out/b*/result.json perf-confirm/b*/result.json)
          a=($(ls "${a[@]}" 2>/dev/null)); b=($(ls "${b[@]}" 2>/dev/null))
          if [ ${#a[@]} -gt 0 ] && [ ${#b[@]} -gt 0 ]; then
            node scripts/perf/memory-lab/compare.mjs --base "$(commas "${a[@]}")" --head "$(commas "${b[@]}")"               --md perf-out/compare-all.md --json perf-out/final.json --margins scripts/perf/memory-lab/budget.json
          fi

      - name: Perf-regression issue
        if: ${{ always() && steps.plan.outputs.a-run != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run-issue && '1' || '' }}
        run: |
          final=perf-out/final.json
          [ -f "$final" ] || final=perf-out/compare.json
          node scripts/perf/memory-lab/nightly.mjs issue --plan plan.json --initial perf-out/compare.json --final "$final"

      - name: Report
        if: always()
        shell: bash
        run: |
          args=(--plan plan.json)
          if [ -f perf-out/compare-all.md ]; then args+=(--compare perf-out/compare-all.md)
          elif [ -f perf-out/compare.md ]; then args+=(--compare perf-out/compare.md); fi
          [ -f perf-out/spread.md ] && args+=(--spread perf-out/spread.md)
          node scripts/perf/memory-lab/nightly.mjs report "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-${{ github.run_id }}
          path: |
            plan.json
            perf-out/ab.json
            perf-out/compare.md
            perf-out/compare.json
            perf-out/compare-all.md
            perf-out/final.json
            perf-confirm/ab.json
            perf-confirm/*/result.json
            perf-confirm/*/summary.md
            perf-confirm/*/instance.log
            perf-out/spread.md
            perf-out/*/result.json
            perf-out/*/summary.md
            perf-out/*/instance.log
          if-no-files-found: warn
          retention-days: 90

  # A night that did not finish (the lab failed, or the job timed out) would otherwise show only as a red run nobody
  # watches, and the history would quietly stop growing. One `perf-run-failed` issue per streak of failed nights; the
  # first night that finishes closes it. A job that hit its timeout counts as failed (GitHub reports it as cancelled, so
  # its annotations are read); a plain cancel says nothing. Only on main, as for the nightly's own issue.
  failed:
    name: report a night that did not finish
    needs: compare
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.compare.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read # a cancelled job's annotations say whether it timed out
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run-issue && '1' || '' }}
          RESULT: ${{ needs.compare.result }}
        run: node scripts/perf/memory-lab/nightly.mjs failure --result "$RESULT"
