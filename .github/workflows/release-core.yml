name: Release (core)

# The release itself: gate, build all three platforms, sign the manifest, publish a
# GitHub Release (the single source of truth for distribution), and trigger the
# landing page deploy. Asset mirroring to agentmux.ai is done by the landing page
# itself — this workflow never touches S3.
#
# This file is what the signing service trusts. It is a reusable workflow, called
# from release.yml (the thin trigger on a `v*` tag) as
# `agentmuxai/agentmux/.github/workflows/release-core.yml@main`, so the copy that
# runs is main's, whatever the tag's own release.yml says. The signing role accepts
# a token only from a job of THIS file at `refs/heads/main` (the token's
# job_workflow_ref claim); a tag's own workflow, a branch workflow, or a job of any
# other workflow cannot sign, however it is named or triggered. So who can create a
# `v*` tag does not matter for signing: the gate below decides what is built and
# signed, and changing this file is a change to main (a pull request through the
# merge queue, a review and the required checks).
#
# It takes no inputs. Everything it needs comes from GitHub's own context for the
# run (github.ref_type, github.ref_name, github.sha), which the caller cannot set.
# Every checkout is of github.sha, the commit the run was created for, and never of
# the tag NAME: a tag deleted and made again at another commit during the signing
# wait (see sign-release) must not change what is built, signed or run.
#
# WinGet/Microsoft Store submission jobs are disabled (see "Phase 4" below,
# commented out, 2026-08-12) — MS Store is uploaded manually. WinGet's
# automated job never actually worked: `wingetcreate update` requires an
# existing manifest in microsoft/winget-pkgs, which was never bootstrapped
# via a first-time `wingetcreate new` submission, so every release back
# through at least v0.54.14 failed this job identically
# ("repos/microsoft/winget-pkgs/.../AgentMux was not found"). Re-enable once
# a manifest actually exists there (or bootstrap one and switch back to
# `update`).
#
# See docs/specs/SPEC_UNIFIED_RELEASE_CICD_2026_06_29.md and the correction
# docs/specs/SPEC_RELEASE_CICD_CORRECTION_2026_06_30.md for the full design, and
# docs/specs/SPEC_SIGNED_UPDATE_CHECKSUMS_2026_10_25.md §4 for the signing.

on:
  workflow_call:

# Read-only by default; a job that needs more says so itself (job-level permissions replace this
# block). A job added later gets nothing it did not ask for.
permissions:
  contents: read

jobs:
  # ── Phase 1: The gate ────────────────────────────────────────────────────
  # Refuses anything that is not a `chore: release vX.Y.Z` commit on main for the
  # tag being released, and checks the five version locations agree with the tag
  # (the check this job replaces: `verify`). Every other job needs it, so nothing
  # is built, waits, or asks for a token for a commit that fails. The checks are
  # in scripts/release-gate.mjs, run from a checkout of MAIN (not the tagged
  # commit: a tag cannot bring its own gate).
  gate:
    name: Release gate (a release commit on main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/release-gate.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the tag, its commit and its versions
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: node scripts/release-gate.mjs --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$SHA" --repo "$REPO" --github-output "$GITHUB_OUTPUT"

  # ── The agent container image ───────────────────────────────────────────
  # Published for each release, after the gate, by main's container-image.yml (which
  # re-runs the gate from this run's own context). Independent of the builds below.
  container-image:
    name: Container agent image
    needs: gate
    permissions:
      contents: read
      packages: write
    uses: agentmuxai/agentmux/.github/workflows/container-image.yml@main

  # ── Phase 1b: Single source of truth for the three pinned CEF runtime tags ──
  # PR #3086 pinned each build-*.yml call's cef-runtime-tag to a literal
  # string, fixing release-to-release reproducibility: a blank tag used to
  # resolve to "latest published release for that platform" at build time, so
  # two builds of the identical commit — or the same tagged release rebuilt
  # later — could silently ship different Chromium versions. That fix has one
  # gap: the three pins lived in three separate places (one per build-* call
  # below), so a human bumping one platform's pin (e.g. Windows to CEF 152)
  # and forgetting the other two reproduces the exact failure #3086 exists to
  # prevent — via a stale manual edit instead of a live "latest" race. Nothing
  # caught that.
  #
  # This job is now the ONE place the release reads the three pins — build-windows/
  # linux/macos below reference its outputs, not a literal string of their
  # own — and it fails the release if they don't agree on Chromium MILESTONE
  # before any build starts. Milestone, not full version equality: the three
  # platforms don't even share a version-string format. Confirmed against the
  # tags PR #3086 pinned: windows=148.0.7778.180, linux=148.0.7778.180-codecs
  # (both Chromium's own major.minor.branch.patch), macos=148.23.23-codecs (an
  # unrelated local build-counter scheme — 148.23.23 is not a Chromium build
  # number). All three do keep the milestone as the leading dot-separated
  # segment regardless of scheme, so that's the one component a comparison
  # can mean something for.
  #
  # No GitHub API calls, no secrets: this only parses the three literal
  # strings in the committed pin file, so it's a fast, offline,
  # always-reproducible check — not a live "resolve latest" query, which would
  # silently undo #3086's reproducibility fix.
  #
  # The values live in scripts/cef-build/cef-runtime-pins.sh, not here: the
  # blank-tag path of each build-*.yml (nightlies, direct dispatches) reads the
  # same file, so publishing a new runtime can't reach a build until a PR moves
  # the pins (SPEC_CEF_MILESTONE_UPGRADE_152_TO_154_2026_09_27.md §4). To bump
  # a pin: edit that file, in the same PR as the consumer-side CEF upgrade.
  cef-runtime-pins:
    name: CEF runtime tags (single source of truth + milestone check)
    needs: [gate, check-macos]
    runs-on: ubuntu-latest
    outputs:
      windows-tag: ${{ steps.pins.outputs.windows-tag }}
      linux-tag: ${{ steps.pins.outputs.linux-tag }}
      macos-tag: ${{ steps.pins.outputs.macos-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/cef-build

      - name: Read pins and check milestone agreement
        id: pins
        env:
          MACOS_AVAILABLE: ${{ needs.check-macos.outputs.available }}
        run: |
          # shellcheck source=/dev/null
          source scripts/cef-build/cef-runtime-pins.sh
          WIN_TAG="$CEF_WINDOWS_RUNTIME_TAG"
          LINUX_TAG="$CEF_LINUX_RUNTIME_TAG"
          MACOS_TAG="$CEF_MACOS_RUNTIME_TAG"

          # Local and package Windows builds read their own pin
          # (windows-runtime-pin.sh, which also carries libcef.dll's SHA-256).
          # A release whose CI Windows runtime differs from it would ship a
          # runtime no local build verifies against.
          # shellcheck source=/dev/null
          source scripts/cef-build/windows-runtime-pin.sh
          if [ "$WIN_TAG" != "$CEF_WINDOWS_RELEASE_TAG" ]; then
            echo "ERROR: cef-runtime-pins.sh has windows=$WIN_TAG but windows-runtime-pin.sh has $CEF_WINDOWS_RELEASE_TAG — bump both in the same PR."
            exit 1
          fi

          # Chromium milestone = the leading dot-separated numeric segment
          # after the cef-<platform>-<arch>- prefix. Works across both
          # version schemes above because both keep the milestone number
          # first — it's the one component the three schemes agree on the
          # meaning of.
          milestone() {
            echo "$1" | sed -E 's/^cef-[a-z0-9_]+-[a-z0-9_]+-//' | cut -d. -f1
          }
          WIN_MS=$(milestone "$WIN_TAG")
          LINUX_MS=$(milestone "$LINUX_TAG")
          MACOS_MS=$(milestone "$MACOS_TAG")
          echo "Pinned CEF runtime tags: windows=$WIN_TAG (m$WIN_MS) linux=$LINUX_TAG (m$LINUX_MS) macos=$MACOS_TAG (m$MACOS_MS) macos-available=$MACOS_AVAILABLE"

          # Cross-check windows/linux unconditionally — both always build.
          # Only cross-check macos when it's actually going to build
          # (APPLE_CEF_AVAILABLE set): a stale macOS pin that build-macos's
          # own `if:` is going to skip anyway ships nothing this run, so
          # hard-failing on it would block an otherwise-fine Windows/Linux
          # release for a mismatch with no real consequence. Deferring the
          # check to whenever macOS is actually available means it still
          # fires the moment the stale pin WOULD matter.
          MISMATCH=""
          if [ "$WIN_MS" != "$LINUX_MS" ]; then
            MISMATCH="windows ($WIN_TAG, m$WIN_MS) vs linux ($LINUX_TAG, m$LINUX_MS)"
          elif [ "$MACOS_AVAILABLE" = "true" ] && [ "$WIN_MS" != "$MACOS_MS" ]; then
            MISMATCH="windows/linux (m$WIN_MS) vs macos ($MACOS_TAG, m$MACOS_MS)"
          fi
          if [ -n "$MISMATCH" ]; then
            echo "ERROR: CEF Chromium milestone mismatch across the pinned tags — refusing to build a release from mismatched runtimes."
            echo "  $MISMATCH"
            echo "  One platform's pin was bumped without the others — update all three together, in the same PR."
            exit 1
          fi

          echo "windows-tag=$WIN_TAG" >> "$GITHUB_OUTPUT"
          echo "linux-tag=$LINUX_TAG" >> "$GITHUB_OUTPUT"
          echo "macos-tag=$MACOS_TAG" >> "$GITHUB_OUTPUT"

  # ── Phase 2: Build all platforms (parallel) ───────────────────────────────
  # Reuses build-windows.yml's own job instead of inlining a second copy of
  # the CEF-provisioning + packaging steps — same pattern as build-linux/
  # build-macos below. release-tag is left blank: the release doesn't exist
  # yet at this point in the pipeline (publish creates it after all three
  # platforms finish) — the reused workflow's own actions/upload-artifact
  # steps (windows-portable/windows-installer/windows-msix) are what
  # `publish` downloads below, exactly as when this was inlined.
  # See docs/specs/SPEC_CEF_PROPRIETARY_CODECS_ALL_PLATFORMS_2026_07_26.md.
  #
  # cef-runtime-tag comes from cef-runtime-pins above, the one place all
  # three platforms' pins are declared and cross-checked — see that job's
  # comment for the full history (PR #3086 pinned per-build-job literals
  # fixing reproducibility; this closes the gap that left open: nothing
  # caught one platform's pin drifting from the other two).
  build-windows:
    name: Build — Windows portable + installer + MSIX
    needs: [gate, cef-runtime-pins]
    permissions:
      contents: write
    uses: agentmuxai/agentmux/.github/workflows/build-windows.yml@main
    with:
      ref: ${{ github.sha }}
      release-tag: ""
      cef-runtime-tag: ${{ needs.cef-runtime-pins.outputs.windows-tag }}
    secrets: inherit

  # Reuses build-linux.yml's own job instead of inlining a second copy of the
  # CEF-provisioning steps (previously ~100 lines duplicated verbatim — see
  # docs/analysis/ANALYSIS_CI_WORKFLOW_CATALOG_2026_07_18.md §2.2). release-tag
  # is left blank: the release doesn't exist yet at this point in the pipeline
  # (publish creates it after all three platforms finish) — the reused
  # workflow's own `actions/upload-artifact` step (name: linux-appimage) is
  # what `publish` downloads below, exactly as when this was inlined.
  build-linux:
    name: Build — Linux AppImage
    needs: [gate, cef-runtime-pins]
    permissions:
      contents: write
    uses: agentmuxai/agentmux/.github/workflows/build-linux.yml@main
    with:
      ref: ${{ github.sha }}
      release-tag: ""
      cef-runtime-tag: ${{ needs.cef-runtime-pins.outputs.linux-tag }}
    secrets: inherit

  # check-macos probes the APPLE_CEF_AVAILABLE secret and exposes it as a job
  # output, because the `secrets` context is not available in job-level `if`
  # expressions (only github, needs, vars, inputs, and status functions are).
  check-macos:
    name: Check macOS build availability
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          APPLE_CEF_AVAILABLE: ${{ secrets.APPLE_CEF_AVAILABLE }}
        run: |
          if [ -n "$APPLE_CEF_AVAILABLE" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

  # Reuses build-macos.yml's own job instead of inlining a second copy of the
  # CEF-provisioning + signing/notarization steps (previously ~135 lines
  # duplicated verbatim — see docs/analysis/ANALYSIS_CI_WORKFLOW_CATALOG_2026_07_18.md
  # §2.2). release-tag is left blank: the release doesn't exist yet at this
  # point (publish creates it after all three platforms finish) — the reused
  # workflow's own `actions/upload-artifact` step (name: macos-dmg) is what
  # `publish` downloads below, exactly as when this was inlined.
  build-macos:
    name: Build — macOS arm64 DMG
    needs: [gate, check-macos, cef-runtime-pins]
    if: needs.check-macos.outputs.available == 'true'
    permissions:
      contents: write
    uses: agentmuxai/agentmux/.github/workflows/build-macos.yml@main
    with:
      ref: ${{ github.sha }}
      release-tag: ""
      cef-runtime-tag: ${{ needs.cef-runtime-pins.outputs.macos-tag }}
    secrets: inherit

  # ── Phase 2b: Sign the release's manifest ───────────────────────────────
  # docs/specs/SPEC_SIGNED_UPDATE_CHECKSUMS_2026_10_25.md. The app downloads
  # nothing a signed manifest doesn't list, so this runs between the builds and
  # `publish`: it makes the manifest of the release files, an envelope that names
  # it by its hash, and a signature of the envelope by a key held in a signing
  # service this job can ask but never read, reached with the run's own identity
  # token (no stored secret). It checks what it made with the app's rules before
  # `publish` ever sees it.
  #
  # Off until the repository variable RELEASE_SIGNING_ENABLED is 'true' (set once
  # the key, the role and the `release-signing` environment exist). Once on, a
  # failure here stops `publish`: no release goes out unsigned. The environment
  # is limited to `v*` tags and waits before the job starts (a window in which
  # the run can be cancelled); nothing about the role, the key or the account is
  # in this file, only variables (RELEASE_SIGNING_ROLE, RELEASE_SIGNING_KEY,
  # RELEASE_SIGNING_REGION) set in the repository's settings.
  #
  # The locks, in the order a run meets them:
  #   - the gate (above) refused any commit that is not a release commit on main;
  #   - this job re-runs the gate AFTER the wait and before it asks for a token, from
  #     main's copy of the script, so the checks hold at the moment of signing;
  #   - the job checks out github.sha (the commit the run was created for), never
  #     the tag name, so a tag moved during the wait changes nothing;
  #   - the signing role accepts only a token whose job_workflow_ref is THIS file at
  #     refs/heads/main (checked below first, with a clear message, then by the role).
  sign-release:
    name: Sign the release manifest
    needs: [gate, check-macos, cef-runtime-pins, build-windows, build-linux, build-macos]
    if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' && !failure() && !cancelled() && (needs.build-macos.result == 'success' || (needs.build-macos.result == 'skipped' && needs.check-macos.outputs.available != 'true')) }}
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      TAG: v${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: The gate again, now that the wait is over
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # main's copy of the gate, kept outside the workspace (which is the commit being signed).
          gate="$RUNNER_TEMP/release-gate.mjs"
          gh api -H "Accept: application/vnd.github.raw+json" "repos/${REPO}/contents/scripts/release-gate.mjs?ref=main" > "$gate"
          node "$gate" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --sha "$SHA" --repo "$REPO"
          # The workspace is the gated commit and nothing else.
          test "$(git rev-parse HEAD)" = "$SHA"

      # Before any credential is requested: the token this job would present names
      # this file on main. Prints the claims, never the token.
      - name: The identity token names release-core.yml on main
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          CLAIMS=$(echo "$TOKEN" | jq -R 'split(".")[1] | @base64d | fromjson')
          echo "$CLAIMS" | jq '{sub, job_workflow_ref, job_workflow_sha, workflow_ref, ref, event_name, environment}'
          WANT="${GITHUB_REPOSITORY}/.github/workflows/release-core.yml@refs/heads/main"
          GOT=$(echo "$CLAIMS" | jq -r .job_workflow_ref)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the identity token's job_workflow_ref is '$GOT', not '$WANT'; the signing role accepts only the latter. Is release.yml calling release-core.yml@main?"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      # The same selection `publish` makes (its "Flatten artifact tree"); the
      # "Check the files that are published" step there fails if they differ.
      - name: Flatten artifact tree
        run: |
          mkdir -p dist-flat
          find release-artifacts -type f \( -name "*.7z" -o -name "*.exe" -o -name "*.msix" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.xz" \) -exec cp {} dist-flat/ \;
          ls -l dist-flat/

      - name: Build the manifest and the envelope
        run: node scripts/release-manifest.mjs build --dir dist-flat --tag "$TAG" --out release-manifest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.RELEASE_SIGNING_ROLE }}
          aws-region: ${{ vars.RELEASE_SIGNING_REGION }}
          role-session-name: release-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Sign the envelope
        run: |
          VERSION="${TAG#v}"
          KEY_ID=$(node -e 'const k=JSON.parse(require("fs").readFileSync("crates/common/update-keys.json","utf8")).keys; if(!k.length){console.error("no signing key is pinned in crates/common/update-keys.json yet");process.exit(1)} console.log(k[0].id)')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          node scripts/release-manifest.mjs sign-kms \
            --envelope "release-manifest/AgentMux-${VERSION}-envelope.json" \
            --key-id "${{ vars.RELEASE_SIGNING_KEY }}" --id "$KEY_ID" \
            --out "release-manifest/AgentMux-${VERSION}-envelope.json.sig"

      # What the app will check, against the public key it pins and the real files.
      - name: Check what was signed
        run: node scripts/release-manifest.mjs verify --dir release-manifest --tag "$TAG" --id "$KEY_ID" --keys-file crates/common/update-keys.json --files dist-flat

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest/
          if-no-files-found: error

  # ── Phase 3: Publish GitHub Release ───────────────────────────────────────
  # GitHub Releases is the single source of truth for distribution. The landing
  # page reads this release, mirrors the assets into its own storage, and
  # serves them from agentmux.ai — so this job must NOT touch S3 or AWS. Its only handoff is the
  # GitHub Release plus a repository_dispatch to redeploy the landing page.
  #
  # `if: !failure() && !cancelled()` rather than plain `success()` is
  # deliberate: build-macos is legitimately SKIPPED (not failed) whenever
  # APPLE_CEF_AVAILABLE isn't set, and `success()` would treat that skip as
  # not-a-success and block publish even though a Windows/Linux-only release
  # is fine. `failure()`/`cancelled()` only inspect jobs THIS job directly
  # `needs` — they do not look at the whole transitive graph (GitHub Actions'
  # documented behaviour: an `if:` that references one of these functions
  # gets no implicit "all needs succeeded" check at all, unlike a plain
  # output-only `if:` such as build-macos's own) — so cef-runtime-pins MUST
  # be listed here explicitly, or its failure (a milestone mismatch) would
  # cascade to skip every build job (invisible to failure()) while publish's
  # condition stayed true, ran anyway, downloaded zero artifacts, and failed
  # confusingly later instead of being cleanly blocked at the real point of
  # failure.
  #
  # build-macos is checked by its result as well: a job killed by a time limit
  # ends as `cancelled`, which `failure()` doesn't count, and `cancelled()`
  # only covers the whole run. v0.59.37 shipped without macOS that way. So
  # publish needs build-macos to have succeeded, or to have been skipped
  # because macOS signing isn't set up (check-macos), never anything else.
  publish:
    name: Publish release
    needs: [gate, check-macos, cef-runtime-pins, build-windows, build-linux, build-macos, sign-release]
    if: ${{ !failure() && !cancelled() && (needs.build-macos.result == 'success' || (needs.build-macos.result == 'skipped' && needs.check-macos.outputs.available != 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifact tree
        # Extension allowlist — a new Linux package format added to
        # build-linux.yml (or any platform) but not added HERE is silently
        # excluded from the actual GitHub Release and the landing-page
        # deploy that reads it (Codex review, PR #3234; see
        # docs/specs/SPEC_LINUX_DISTRO_TARGETS_AND_DOWNLOADS_PAGE_2026_09_15.md
        # §2.5). *.deb and *.tar.gz added for that spec's Phase 1
        # (AppImage/deb/tar.gz; the tarball is .tar.xz after v0.59.24, see
        # docs/specs/SPEC_LINUX_PACKAGES_XZ_2026_10_14.md); *.rpm added for Phase 2 (.pacman lands here
        # too once Phase 3 ships). *.7z is the Windows portable, which replaced
        # the only *.zip (docs/specs/SPEC_WINDOWS_PORTABLE_7Z_2026_10_11.md).
        run: |
          mkdir -p dist-flat
          find release-artifacts -type f \( -name "*.7z" -o -name "*.exe" -o -name "*.msix" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.xz" \) -exec cp {} dist-flat/ \;
          echo "--- Release artifacts ---"
          ls -lh dist-flat/

      # Signing is on (the sign-release job ran, and `publish` only runs if it
      # succeeded): the manifest goes up with the files, after a check that the
      # files about to be published are exactly the ones it was made from.
      - name: Download the signed manifest
        if: ${{ needs.sign-release.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest
      - name: Check the files that are published
        if: ${{ needs.sign-release.result == 'success' }}
        run: |
          TAG="v${VERSION}"
          KEY_ID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("crates/common/update-keys.json","utf8")).keys[0].id)')
          node scripts/release-manifest.mjs verify --dir release-manifest --tag "$TAG" --id "$KEY_ID" --keys-file crates/common/update-keys.json --files dist-flat
          cp release-manifest/* dist-flat/
          ls -l dist-flat/

      - name: Extract changelog for this version
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # extract-changelog.sh exits non-zero on a missing entry, so an
          # empty-NOTES fallback here is dead code — the step would already
          # have failed under set -e before reaching it.
          # --include-unpublished adds the older versions with no GitHub
          # release (a failed build skips publish), whose changes ship here.
          NOTES=$(bash scripts/extract-changelog.sh --include-unpublished "$VERSION")
          # Write to file to safely pass multiline content to gh release create
          echo "$NOTES" > /tmp/release-notes.md
          echo "Release notes:"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "AgentMux v${VERSION}" \
              --notes-file /tmp/release-notes.md \
              dist-flat/*
          else
            echo "Release v${VERSION} already exists -- uploading/overwriting artifacts only"
            gh release upload "v${VERSION}" dist-flat/* --clobber
          fi

      # Replaces LANDING_DEPLOY_TOKEN, which fingerprinted as an `a5af`
      # account PAT. The dispatch below is fire-and-forget -- this job stays
      # green whether or not it lands -- so a dead credential here fails
      # SILENTLY and the site just goes stale. A per-run token removes the
      # "expired months ago and nobody noticed" failure mode entirely.
      # Proven by ci-app-token-smoke.yml (since removed) with a real (no-op) dispatch.
      - name: Mint a short-lived token for the landing repo
        id: landing_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: agentmuxai
          repositories: agentmux-landing

      - name: Trigger landing page deploy
        env:
          GH_TOKEN: ${{ steps.landing_token.outputs.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/agentmuxai/agentmux-landing/dispatches \
            -f event_type=release \
            -F client_payload[version]="${VERSION}"

