name: Install the remote-helper toolchain
description: >-
  zig (from the ziglang pip package) and cargo-zigbuild, which scripts/build-remote-helpers.sh uses to cross-build
  agentmux-remote for all four SSH host platforms from one runner. A pip of its own keeps zig out of the system Python.
  Needs a Rust toolchain on PATH. The one place the two versions are written.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install zig and cargo-zigbuild
      shell: bash
      run: |
        python -m pip install ziglang==0.16.0
        cargo install cargo-zigbuild --locked --version 0.23.4
