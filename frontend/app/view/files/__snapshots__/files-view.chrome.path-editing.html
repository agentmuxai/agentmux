<div class="files-toolbar">
<div class="ui-tooltip-anchor">
<button aria-label="Back (Alt+←)" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool" disabled="">
<i aria-hidden="true" class="fa-solid fa-arrow-left">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Forward (Alt+→)" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool" disabled="">
<i aria-hidden="true" class="fa-solid fa-arrow-right">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Up (Alt+↑)" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool">
<i aria-hidden="true" class="fa-solid fa-arrow-up">
</i>
</button>
</div>
<input class="files-path-input" data-raw-text-field="the breadcrumb row's inline path editor: it replaces the crumbs in place and ends on Enter, Escape or blur, not a form field" aria-label="Folder path" spellcheck="false">
<div class="ui-tooltip-anchor">
<button aria-label="Filter (Ctrl+F)" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool files-filter-button" aria-pressed="false">
<i aria-hidden="true" class="fa-solid fa-filter">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="New folder" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool">
<i aria-hidden="true" class="fa-solid fa-folder-plus">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Show hidden files" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool" aria-pressed="false">
<i aria-hidden="true" class="fa-solid fa-eye-slash">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Refresh (F5)" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool">
<i aria-hidden="true" class="fa-solid fa-arrows-rotate">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Hide Places" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool" aria-pressed="true">
<i aria-hidden="true" class="fa-solid fa-table-columns">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Show as thumbnails" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool" aria-pressed="false">
<i aria-hidden="true" class="fa-solid fa-table-cells-large">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Show preview (Space)" type="button" class="ui-button ui-tone-quiet ui-icon-button files-tool" aria-pressed="false">
<i aria-hidden="true" class="fa-solid fa-eye">
</i>
</button>
</div>
</div>
