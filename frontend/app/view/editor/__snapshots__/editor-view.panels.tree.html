<div class="editor-tree-column editor-region" style="width: 240px; flex: 0 0 240px;">
<div class="file-tree">
<div class="file-tree-toolbar">
<div class="ui-tooltip-anchor">
<button aria-label="Hide file tree" type="button" class="ui-button ui-tone-quiet ui-density-compact ui-icon-button">
<i aria-hidden="true" class="fa-solid fa-angles-left">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Show hidden files" type="button" class="ui-button ui-tone-quiet ui-density-compact ui-icon-button" aria-pressed="false">
<i aria-hidden="true" class="fa-solid fa-eye-slash">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Collapse all folders" type="button" class="ui-button ui-tone-quiet ui-density-compact ui-icon-button">
<i aria-hidden="true" class="fa-solid fa-square-minus">
</i>
</button>
</div>
<div class="ui-tooltip-anchor">
<button aria-label="Refresh tree" type="button" class="ui-button ui-tone-quiet ui-density-compact ui-icon-button">
<i aria-hidden="true" class="fa-solid fa-arrows-rotate">
</i>
</button>
</div>
</div>

<div class="file-tree-item" role="treeitem" data-path="/home/u" tabindex="-1" aria-label="u" aria-level="1" aria-posinset="1" aria-setsize="1" aria-expanded="true">

<i class="fa fa-chevron-down file-tree-chevron">
</i>
<i aria-hidden="true" class="fa-solid fa-folder-open file-tree-icon file-tree-icon--steel">
</i>
<span class="file-tree-label">u</span>
</div>
<div role="group">
<div class="file-tree-item" role="treeitem" data-path="/home/u/src" tabindex="-1" aria-label="src" aria-level="2" aria-posinset="1" aria-setsize="2" aria-expanded="false">
<div class="file-tree-row file-tree-row--dir" style="padding-left: 20px;" data-hover-tip="/home/u/src" aria-description="/home/u/src">

</i>
<i aria-hidden="true" class="fa-solid fa-folder file-tree-icon file-tree-icon--steel">

</div>

</span>
<i aria-hidden="true" class="fa-solid fa-file-code file-tree-icon file-tree-icon--blue">

<span class="file-tree-label">a.ts</span>
</div>
</div>
</div>
</div>
</div>
</div>
