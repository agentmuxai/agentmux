[package]
name = "agentmux-mcp"
version.workspace = true
edition = "2021"
description = "AgentMux MCP server — exposes Shell and other agent tools to Claude"
authors = ["AgentMux Corp"]
license = "Apache-2.0"

[[bin]]
name = "agentmux-mcp"
path = "src/main.rs"

[dependencies]
agentmux-common = { path = "../agentmux-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Cross-platform (Windows/macOS/Linux) window enumeration + capture for the
# CaptureWindow tool — deliberately not hand-rolled per-platform GDI/
# CoreGraphics/X11 FFI (see docs/analysis/ANALYSIS_AGENT_UI_AUTOMATION_CROSS_PANE_AND_CROSS_INSTANCE_TARGETING_2026_08_21.md §1.3).
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
