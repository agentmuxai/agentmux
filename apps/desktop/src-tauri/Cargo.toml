[package]
name = "agentmux-desktop"
version = "0.2.7"
description = "AgentMux Desktop - Native desktop app for agent monitoring"
authors = ["AgentMux Team"]
edition = "2021"

[lib]
name = "agentmux_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
dirs = "5.0"

[dev-dependencies]
reqwest = "0.11"
